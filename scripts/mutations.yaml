# 變異盤點清單 — 規格見 references/mutation-inventory.md
#
# 每一條的意思是：「把這一行改成那樣，應該要有測試紅」。
#
# survives 記的是**上次實測的結果**，不是希望的樣子。兩個方向都會被比對：
#   survives: false 卻活下來 → regression（測試被刪掉，或碼被改得繞過測試）
#   survives: true  卻被殺掉 → stale-record（有人補了測試，清單該更新）
# 只釘一個方向的話，把 survives 全填 true 就會永遠綠——那是許願單不是盤點。
#
# survives: true 一定要寫清楚 why：誰在管、出處在哪。已知的缺口掛著是誠實
# （紅線 8），沒有理由的存活是掩蓋。
#
# 新增條目時挑「壞掉最痛」的地方，不是最好寫的地方。這份清單不保證覆蓋完整，
# 它只回答「我列出來的這些地方守不守得住」。
#
# find 必須在目標檔案裡**剛好出現一次**——selftest 有一條在 0.5 秒內釘住這件事。
# 針腳不唯一會改到隔壁那一處，然後假裝成「存活」（規格：坑一）。

