  # ── 量不到就寫量不到（紅線 8）：heat 那條線的五個回頭路 ──────────────
  #
  # 這五條守的是同一件事：`heat` 這個欄位在沒有任何傳播證據的時候不准長出一個
  # 數字。2026-07-26 之前它會——四項傳播輸入恆為 0（pulse-cluster.py 呼叫時寫死
  # metrics=[]），heat 照樣印 8–32，敘述層還拿那個數字當論據寫句子。
  # 規格：references/readiness-gate.md。
  #
  # 分成五條而不是一條，是因為「走回去」有五個不同的入口：源頭重新計算、
  # 門禁不擋、value 悄悄改權重、前台印 0、送 0 給敘述層。堵一個不等於堵住。

  - id: M21
    title: "heat 又變回無條件計算（沒量到也編一個低分出來）"
    file: lib/scoring.py
    find: "    ) if propagation_signals else None"
    replace: "    )"
    survives: false
    why: ""

  - id: M22
    title: "沒有傳播證據撐著的 heat 數字不再被擋下來"
    file: pulse-gate.py
