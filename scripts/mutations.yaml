# 變異盤點清單 — 規格見 references/mutation-inventory.md
#
# 每一條的意思是：「把這一行改成那樣，應該要有測試紅」。
#
# survives 記的是**上次實測的結果**，不是希望的樣子。兩個方向都會被比對：
#   survives: false 卻活下來 → regression（測試被刪掉，或碼被改得繞過測試）
#   survives: true  卻被殺掉 → stale-record（有人補了測試，清單該更新）
# 只釘一個方向的話，把 survives 全填 true 就會永遠綠——那是許願單不是盤點。
#
# survives: true 一定要寫清楚 why：誰在管、出處在哪。已知的缺口掛著是誠實
# （紅線 8），沒有理由的存活是掩蓋。
#
# 新增條目時挑「壞掉最痛」的地方，不是最好寫的地方。這份清單不保證覆蓋完整，
# 它只回答「我列出來的這些地方守不守得住」。
#
# find 必須在目標檔案裡**剛好出現一次**——selftest 有一條在 0.5 秒內釘住這件事。
# 針腳不唯一會改到隔壁那一處，然後假裝成「存活」（規格：坑一）。

mutations:

  # ── 死人開關的出口：整條鏈紅不紅只取決於這個數字 ──────────────────

  - id: M01
    title: "monitor 的 main() 直接回 0（算得再準也不會讓 CI 紅）"
    file: pulse-monitor.py
    find: "    return rc\n"
    replace: "    return 0\n"
    survives: false
    why: ""  # 2026-07-26 併入 test/monitor-exit-codes 後被殺（10 條紅）

  - id: M02
    title: "sys.exit(main()) 改成不看回傳值（exit code 恆為 0）"
    file: pulse-monitor.py
    find: "    sys.exit(main())"
    replace: "    main()"
    survives: false
    why: ""  # 同 M01。13 個釘子全走真的子行程，這一格才量得到（10 條紅）

  - id: M03
    title: "rc 一開始就是 1（天天紅的 CI，跟永遠綠的一樣沒資訊）"
    file: pulse-monitor.py
    find: "    rc = 0\n"
    replace: "    rc = 1\n"
    survives: false
    why: ""  # 同 M01。乾淨 vault 四旗標全開要 exit 0 就是那個反方向（5 條紅）

  # ── 「那天有沒有語料」的判準（references/health-alarms.md）─────────

  - id: M04
    title: "目錄名回到寬鬆判準（2026-13-99 也算一天）"
    file: lib/corpus.py
    find: "        datetime.strptime(name, \"%Y-%m-%d\")\n"
    replace: "        pass\n"
    survives: false
    why: ""

  - id: M05
    title: "空的 _corpus/<日>/ 目錄又算「這天有語料」"
    file: lib/corpus.py
    find: "    return _day_dirs(vault / \"_corpus\", keep=_has_jsonl_rows)"
    replace: "    return _day_dirs(vault / \"_corpus\")"
    survives: false
    why: ""

  - id: M06
    title: "沒寫出 report.md 的班也算「跑過了」"
    file: lib/corpus.py
    find: "    return _day_dirs(vault / \"_probe\", keep=lambda d: (d / \"report.md\").exists())"
    replace: "    return _day_dirs(vault / \"_probe\")"
    survives: false
    why: ""

  - id: M07
    title: "_as_date 不先歸零到 UTC（跨時區的日期會差一天）"
    file: pulse-monitor.py
    find: "        return dt.astimezone(timezone.utc).date() if dt.tzinfo else dt.date()"
    replace: "        return dt.date()"
    survives: false
    why: ""

  - id: M08
    title: "未來日期的語料目錄不再判紅（時鐘壞掉永遠綠）"
    file: pulse-monitor.py
    find: "    future = item_lag is not None and item_lag < 0"
    replace: "    future = False"
    survives: false
    why: ""

  - id: M09
    title: "從來沒抓到過不算 stale（None 被當成健康）"
    file: pulse-monitor.py
    find: "    stale = item_lag is None or item_lag >= stale_after_days"
    replace: "    stale = item_lag is not None and item_lag >= stale_after_days"
    survives: false
    why: ""

  - id: M10
    title: "缺 ingested_at 的未潤稿事件不再回報（量不到被寫成 0）"
    file: pulse-monitor.py
    find: "        \"unenriched_undated\": undated_unenriched,"
    replace: "        \"unenriched_undated\": 0,"
    survives: false
    why: ""

  # ── 隱私邊界（紅線 6）與進庫時刻的黏性 ─────────────────────────

  - id: M11
    title: "來源頁 frontmatter 繞過白名單（api_key / 本機路徑會進 vault）"
    file: pulse-source-notes.py
    find: "    for k in FM_FROM_CONFIG:"
    replace: "    for k in src:"
    survives: false
    why: ""  # 同 M01。改成餵一筆帶祕密欄位的 src 進 render() 看輸出（1 條紅）

  - id: M12
