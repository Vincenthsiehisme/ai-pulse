# 抓取鏈：probe → score → cluster → gate → dashboard → render → commit → 部署 Pages。
# 全程 0 LLM（判斷走規則）。潤稿（enrich）不在這條鏈上，由排程 Cowork 任務另跑。
# 也可在 Actions 頁手動 Run。
#
# ── 2026-07-25 ~ 07-27：暫時加密到每兩小時一班（收班任務已排在 07-27）──
# 為什麼加密：`_corpus/` 當時只有一天資料，而 21 條來源裡有 14 條從沒成功抓過。
# pulse-probe 的 `is_backfill = not st.get("first_fetch_at")` 表示**每條來源的第一次
# 抓取整批都算存量、不算當期訊號**（14 則 review 事件裡有 12 則的 blocker 就是
# stale_backfill）。所以每條來源要跑到第二次才開始產出，一天一班等於一天只暖一條。
# 加密同時把 first_observed_at 的解析度從「天」拉到「兩小時」，而 lead_days
# （事情被官方承認 vs 被個人談論的時間差）是這套系統唯一做得出來的產物。
#
# 為什麼這樣加密不算失禮：safe_fetch 走 etag 條件式請求，沒更新的來源回 304
# 就結束（連 body 都不傳），probe 每條來源之間還 sleep 1 秒。
#
# 收班：2026-07-27 有一個排程任務會把 cron 改回 '0 16 * * *'、robots
# --stale-days 改回 7。**若你看到現在已經過了 07-27 而這裡還是 */2，代表那個
# 收班任務沒跑到——請手動改回去，別讓它長期這樣打人家的站。**
name: AI Pulse nightly refresh

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pyyaml feedparser ruamel.yaml
      - name: Configure git identity
        run: |
          git config user.name  "ai-pulse-bot"
          git config user.email "ai-pulse-bot@users.noreply.github.com"
      # robots_ok 是快取不是判決。放在 probe 之前，讓這一班就吃到最新的判定。
      # --stale-days：每條來源最多這麼久重驗一次，不是每班都打人家 robots.txt。
      #   平常是 7；07-25~07-27 這兩天暫時改 1，因為 src-kol-importai /
      #   src-kol-raschka 兩條掛著 dormant + revive_when_allowed，7 天節流表示
      #   它們這一整週都不會被重驗，兩天空檔等於白等。收班任務會改回 7。
      # --revive：只把「當初因 robots 被判死、現在放行」的 dormant 升回 probing，
      # 人為停用的來源不碰。每筆異動都寫進 _probe/source-history.jsonl 並進 commit diff。
      - name: Robots recheck (0 LLM)
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-robots-recheck.py --stale-days 1 --apply --revive
      - name: Deterministic pipeline (0 LLM)
        env:
          VAULT_DIR: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 這裡曾經是 `python scripts/pulse-probe.py || echo "…部分來源失敗，續跑"`。
          # 那句註解描述的情況 probe 根本不會用非零表示：單條來源抓失敗只寫進 stats，
          # main() 照樣 return 0。probe 的非零**全部**是致命的：
          #   2 = VAULT_DIR / _config 不見了     3 = 0 個可跑來源（硬防護，刻意大聲）
          # 於是 `|| echo` 沒有接住任何「部分失敗」，只接住了兩種必須紅燈的狀況。
          # 實測：把所有 lifecycle 改成 draft（0 可跑來源）→ probe 印 [fatal] 回 3 →
          # 被吞掉 → score/cluster/gate 拿舊資料照跑 → dist/index.html 生得出來 →
          # 部署成功 → 整條 job 綠燈。網站看起來好好的，只是再也不會更新。
          # 硬防護寫了不接等於沒寫，所以這裡讓它照原樣往上冒。
          python scripts/pulse-probe.py
          python scripts/pulse-score.py
          python scripts/pulse-cluster.py
          python scripts/pulse-gate.py
          python scripts/pulse-dashboard.py
          python scripts/pulse-render.py
          # 星速的 Δ/天有 `days = max(..., 0.5)` 下限。一天跑 12 班時如果班班都
          # --snapshot，基線才隔兩小時、Δ 卻被除以半天，★/天就變成一個看起來很正常
          # 的假數字——假數字比空欄危險，因為沒有人會去查它。
          # 所以改由快照自己的年紀決定該不該更新基線，不由班次順序或時鐘決定：
          # Actions 的 cron 是「最早不早於」，實測誤點過 96 分鐘，用時鐘判會在誤點
          # 那天整天不更新基線，而且一樣沒人會發現。20 小時＝一天一次但容得下誤點。
          python scripts/pulse-github.py --snapshot-if-older-than 20
      # 來源層健康分。放在 pipeline 之後，因為它吃的是 pulse-probe 這一班剛
      # append 進 _probe/source-runs.jsonl 的觀測。
      #
      # 敢直接掛 --apply 的理由：這支能自動寫的只有 probing/active → degraded，
      # 而 degraded **仍然每班被抓**（RUN_LIFECYCLES 有它），連續成功三班它會自己
      # 回來。dormant 永遠只有人能寫，達到隔離門檻的來源只進報告的候選清單。
      # 也就是說這一步做不出「無聲關掉一條好來源」那種沒有自癒路徑的傷害——
      # 2026-07-24 漏抓 Claude Opus 5 正是那種傷害。
      # continue-on-error：來源健康是觀測，觀測失敗不該讓整條資料鏈紅燈。
      - name: Source health (0 LLM)
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-source-health.py --apply
      # 機器產生的 vault 頁面。規格：references/vault-pages.md。
      #
      # 排在這裡的兩個理由，缺一不可：
      #   1. 必須在 Source health **之後**——兩支都讀 _probe/source-health.json，
      #      排在前面的話寫出來的分數永遠是上一班的。
      #   2. 必須在 Commit & push **之前**——它們產生的是要進版控的 vault 檔案，
      #      排在 commit 之後等於每班寫完就被下一次 checkout 洗掉，整天沒產出。
      #
      # Sources/*.md：pulse-render 從第一天就往每則 Event 的證據區塊寫
      # [[Sources/src-xxx]]，而那個資料夾裡只有一個 0 bytes 的檔案——所有事件的
      # 證據行在 Obsidian 裡都是紅色斷鏈，關聯圖的一整邊是空的。
      # 不掛 --prune：自動刪 vault 檔案不可逆，孤兒頁的代價只是多一個沒人連的檔。
      #
      # _dashboards/health.md：部署規格從第一天就寫著「last_success 過期即紅燈」，
      # 但這個檔案從來沒有存在過，gate.yaml 的 monitor.stale_after_days 也因此
      # 一直沒有消費者。
      #
      # continue-on-error：這兩頁是觀測產物，寫不出來不該讓整條資料鏈紅燈。
      #
      # 拆成兩個 step 不是排版偏好。同一個 `run:` 底下是 `bash -e`：前面那行非零，
      # 後面那行**根本不會執行**。而後面那行寫的是 health.md，health.md 的
      # generated_day 正是「排程整個死掉」的判準。也就是說：來源筆記產生器炸掉
      # （例如 _probe/state.json 被寫壞成非 dict），health.md 就停在昨天不動，
      # 死人開關於是報「鏈死了」——鏈其實好好的，死的是一支觀測腳本。
      # 一個假訊號指向錯的地方，比沒有訊號更花時間。分開跑，各壞各的。
      - name: Vault pages — source notes (0 LLM)
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-source-notes.py --quiet
      - name: Vault pages — health (0 LLM)
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-monitor.py --write-health > /dev/null
      # concurrency: nightly 只擋 Actions 撞 Actions。半夜潤稿那條 Cowork 鏈是另一
      # 個 push 來源，兩邊都寫 Events/*.md。一天 12 班時「checkout 完到 push 之間
      # 對面剛好也推了一版」不再是理論值，所以這裡重試而不是直接紅燈。
      # rebase 而非 merge：資料 commit 線性比較好讀，衝突時寧可失敗也不要自動合。
      - name: Commit & push data changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "本次無變更"
            exit 0
          fi
          git commit -m "chore: nightly refresh"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "[warn] push 被拒（第 $i 次），拉對面的版本重來"
            git pull --rebase origin main || {
              echo "[fatal] rebase 有衝突，停手不自動解——請人看一眼"
              exit 1
            }
            sleep $((i * 5))
          done
          echo "[fatal] 重試三次仍推不上去"
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      # 死人開關：放在部署之後，紅燈不擋上線，但會寄失敗通知。
      # 觸發條件＝有事件「未 enrich 且放了 ≥2 天」——那代表半夜潤稿那條鏈連續兩晚沒跑到。
      - name: Health monitor (dead-man's switch)
        if: always()
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: |
          {
            echo '### AI Pulse 健康監看'
            echo '```'
            python scripts/pulse-monitor.py --top 5 || true
            echo '```'
            echo '### 來源 robots 狀態'
            echo '```'
            # --stale-days 要跟上面那個 --apply 步驟同值。不給的話預設是 0，而
            # check() 裡的判斷是 `if stale_days and ...`——0 是 falsy，等於「一條都不跳」，
            # 於是這個純顯示用的步驟會把每條來源的 robots.txt 再抓一次。
            # 加上 apply 步驟一次、probe 抓每條來源時一次，同一份 robots.txt 一班三抓；
            # 一天 12 班 × 28 條來源 = 672 次。我們自己沒有那個量的需求，
            # 而且這是最容易招來 429 的那種行為——429 是唯一一種「錯在我們自己」的狀態碼。
            python scripts/pulse-robots-recheck.py --stale-days 1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # --alert-coverage：鏈在跑、但看不見某家必盯公司時要叫。前面那些指標
          # 回答的都是「有沒有動」，07-24 漏抓 Opus 5 那晚它們全綠。
          # 標了 pending 的已知缺口不觸警（要把待辦逼到零時另外跑 --alert-no-source），
          # 否則 CI 天天紅，人只會學會忽略 CI，連帶忽略真正的回歸。
          # --alert-stale：吃 gate.yaml 的 monitor.stale_after_days，判的是
          # 「幾天沒抓到任何項目」。排程整個死掉的那一種，靠的是 health.md 的
          # generated_day 停住不動——兩件事分開判，見 references/vault-pages.md。
          python scripts/pulse-monitor.py \
            --alert-unenriched-days 2 --alert-coverage --alert-stale > /dev/null
