# 抓取鏈：probe → score → cluster → gate → dashboard → render → commit → 部署 Pages。
# 全程 0 LLM（判斷走規則）。潤稿（enrich）不在這條鏈上，由排程 Cowork 任務另跑。
# 也可在 Actions 頁手動 Run。
#
# ── 2026-07-25 ~ 07-27：暫時加密到每兩小時一班（收班任務已排在 07-27）──
# 為什麼加密：`_corpus/` 當時只有一天資料，而 21 條來源裡有 14 條從沒成功抓過。
# pulse-probe 的 `is_backfill = not st.get("first_fetch_at")` 表示**每條來源的第一次
# 抓取整批都算存量、不算當期訊號**（14 則 review 事件裡有 12 則的 blocker 就是
# stale_backfill）。所以每條來源要跑到第二次才開始產出，一天一班等於一天只暖一條。
# 加密同時把 first_observed_at 的解析度從「天」拉到「兩小時」，而 lead_days
# （事情被官方承認 vs 被個人談論的時間差）是這套系統唯一做得出來的產物。
#
# 為什麼這樣加密不算失禮：safe_fetch 走 etag 條件式請求，沒更新的來源回 304
# 就結束（連 body 都不傳），probe 每條來源之間還 sleep 1 秒。
#
# 收班：2026-07-27 有一個排程任務會把 cron 改回 '0 16 * * *'、robots
# --stale-days 改回 7。**若你看到現在已經過了 07-27 而這裡還是 */2，代表那個
# 收班任務沒跑到——請手動改回去，別讓它長期這樣打人家的站。**
name: AI Pulse nightly refresh

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pyyaml feedparser ruamel.yaml
      - name: Configure git identity
        run: |
          git config user.name  "ai-pulse-bot"
          git config user.email "ai-pulse-bot@users.noreply.github.com"
      # robots_ok 是快取不是判決。放在 probe 之前，讓這一班就吃到最新的判定。
      # --stale-days：每條來源最多這麼久重驗一次，不是每班都打人家 robots.txt。
      #   平常是 7；07-25~07-27 這兩天暫時改 1，因為 src-kol-importai /
      #   src-kol-raschka 兩條掛著 dormant + revive_when_allowed，7 天節流表示
      #   它們這一整週都不會被重驗，兩天空檔等於白等。收班任務會改回 7。
      # --revive：只把「當初因 robots 被判死、現在放行」的 dormant 升回 probing，
      # 人為停用的來源不碰。每筆異動都寫進 _probe/source-history.jsonl 並進 commit diff。
      - name: Robots recheck (0 LLM)
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-robots-recheck.py --stale-days 1 --apply --revive
      - name: Deterministic pipeline (0 LLM)
        env:
          VAULT_DIR: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/pulse-probe.py || echo "[warn] probe 無新料或部分來源失敗，續跑"
          python scripts/pulse-score.py
          python scripts/pulse-cluster.py
          python scripts/pulse-gate.py
          python scripts/pulse-dashboard.py
          python scripts/pulse-render.py
          # 星速的 Δ/天有 `days = max(..., 0.5)` 下限。一天跑 12 班時如果班班都
          # --snapshot，基線才隔兩小時、Δ 卻被除以半天，★/天就變成一個看起來很正常
          # 的假數字——假數字比空欄危險，因為沒有人會去查它。
          # 所以改由快照自己的年紀決定該不該更新基線，不由班次順序或時鐘決定：
          # Actions 的 cron 是「最早不早於」，實測誤點過 96 分鐘，用時鐘判會在誤點
          # 那天整天不更新基線，而且一樣沒人會發現。20 小時＝一天一次但容得下誤點。
          python scripts/pulse-github.py --snapshot-if-older-than 20
      # concurrency: nightly 只擋 Actions 撞 Actions。半夜潤稿那條 Cowork 鏈是另一
      # 個 push 來源，兩邊都寫 Events/*.md。一天 12 班時「checkout 完到 push 之間
      # 對面剛好也推了一版」不再是理論值，所以這裡重試而不是直接紅燈。
      # rebase 而非 merge：資料 commit 線性比較好讀，衝突時寧可失敗也不要自動合。
      - name: Commit & push data changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "本次無變更"
            exit 0
          fi
          git commit -m "chore: nightly refresh"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "[warn] push 被拒（第 $i 次），拉對面的版本重來"
            git pull --rebase origin main || {
              echo "[fatal] rebase 有衝突，停手不自動解——請人看一眼"
              exit 1
            }
            sleep $((i * 5))
          done
          echo "[fatal] 重試三次仍推不上去"
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      # 死人開關：放在部署之後，紅燈不擋上線，但會寄失敗通知。
      # 觸發條件＝有事件「未 enrich 且放了 ≥2 天」——那代表半夜潤稿那條鏈連續兩晚沒跑到。
      - name: Health monitor (dead-man's switch)
        if: always()
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: |
          {
            echo '### AI Pulse 健康監看'
            echo '```'
            python scripts/pulse-monitor.py --top 5 || true
            echo '```'
            echo '### 來源 robots 狀態'
            echo '```'
            python scripts/pulse-robots-recheck.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # --alert-coverage：鏈在跑、但看不見某家必盯公司時要叫。前面那些指標
          # 回答的都是「有沒有動」，07-24 漏抓 Opus 5 那晚它們全綠。
          # 標了 pending 的已知缺口不觸警（要把待辦逼到零時另外跑 --alert-no-source），
          # 否則 CI 天天紅，人只會學會忽略 CI，連帶忽略真正的回歸。
          python scripts/pulse-monitor.py --alert-unenriched-days 2 --alert-coverage > /dev/null
