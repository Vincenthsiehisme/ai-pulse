# 抓取鏈：probe → score → cluster → gate → dashboard → render → commit。**到 commit 為止。**
# 部署由 pages.yml 接手（它本來就在任何 push 到 main 時跑）。這條鏈曾經自己也部署一次，
# 而部署要進 `github-pages` 這個 environment——2026-08-09 就是那個閘門把整條資料鏈
# 擋了四天。經過見 references/incidents/2026-08-09-the-gate-that-stopped-the-chain.md。
# 全程 0 LLM（判斷走規則）。潤稿（enrich）不在這條鏈上，由排程 Cowork 任務另跑。
# 也可在 Actions 頁手動 Run。
#
# 而「那個任務沒跑到」這件事，本身沒有任何東西會讓它變紅——一個只靠單次觸發的
# 收班安排，就是這個 repo 一直在修的那種「警報自己把自己關掉」。所以另外排了一個
# **每週的禮貌檢查**（`0 16 * * 0` UTC ＝**台北每週一 00:00**），它不看收班任務
# 跑了沒，只讀這個檔案的事實：cron 一天超過一班、或任一處 --stale-days 小於 7，
# 它就當場改回來並推 main。所以這個上限是每週自癒的，不是靠人記得。
#
# （它原本排在 `0 16 * * 1`，名字寫「每週一」——但 cron 的 day-of-week 也是 UTC，
# 那其實是**台北週二** 00:00。2026-07-27 改成 `* * 0` 才對得上名字。同一個坑：
# 換算了「時」卻忘了換算「星期」。見 references/timezones.md〈排程〉。）
name: AI Pulse nightly refresh

on:
  schedule:
    # cron 欄位一律是 **UTC**（Actions 沒有時區設定），**連 day-of-week 也是**。
    # 同一行註解要寫出台北時間，selftest 會擋——收班後的 '0 16 * * *' 是
    # **台北隔日 00:00**，不是下午四點。
    #
    # 而且每日班只能跑在 16:00Z：那是台北隔日 00:00，上一班是台北當日 00:00，
    # 中間那段正好是**台北的一整天**，而 `_corpus/<UTC 日>/` 的目錄名也正好等於
    # 那個台北日。改成 20:00Z 看起來無害，但目錄名會跟它裝的內容錯開一天。
    # 這條 selftest 也會擋。規格：references/timezones.md〈排程〉。
    - cron: '0 16 * * *'   # 台北隔日 00:00
  workflow_dispatch:

# 只留 contents: write。pages / id-token 是部署要的，而部署已經不在這條鏈上了——
# 權限跟著責任一起搬走，不然下一個人看到 pages: write 會以為這裡還在部署。
permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 這一格以前是 `environment: github-pages`，掛在**整個 job** 上。那代表任何一條
    # 部署保護規則（wait timer／分支政策／必要審核）都會讓這個 job 連 checkout 都
    # 不開始，狀態停在 Waiting。2026-08-09 實際發生：#34 卡了三天，而
    # concurrency: nightly 是單槽，後面每一班都排在它後面死掉，main 四天沒有資料。
    # 網站晚上線，跟情報庫四天沒進資料，不是同一件事，不該共用一個閘門。
    #
    # timeout-minutes：整份 workflow 以前一個都沒有，所以任何一次卡住都會燒滿
    # 預設的 6 小時，再連累後面每一班。正常一班是分鐘級（實測 8～14 分鐘）。
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 不是為了 build，是為了**看得到 commit 歷史**。
      # 底下的 --alert-enrich-stale 量的是「main 上最近一個 nightly: enrich commit
      # 幾天前」——半夜潤稿那條鏈跑在沙箱裡、推不上來的時候它自己叫不出聲，
      # 所以由這一邊量。預設的淺 clone（fetch-depth: 1）裡 git log --grep 什麼都
      # 找不到，而「找不到」跟「很久沒有」在數字上長得一樣。
      # 拿掉這一行不會變成假紅燈——monitor 會先問 is-shallow-repository，
      # 淺的就印「量不到」且不觸警。規格 references/health-alarms.md。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pyyaml feedparser ruamel.yaml
      - name: Configure git identity
        run: |
          git config user.name  "ai-pulse-bot"
          git config user.email "ai-pulse-bot@users.noreply.github.com"
      # robots_ok 是快取不是判決。放在 probe 之前，讓這一班就吃到最新的判定。
      # --stale-days：每條來源最多這麼久重驗一次，不是每班都打人家 robots.txt。平常 7。
      # --revive：只把「當初因 robots 被判死、現在放行」的 dormant 升回 probing，
      # 人為停用的來源不碰。每筆異動都寫進 _probe/source-history.jsonl 並進 commit diff。
      - name: Robots recheck (0 LLM)
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-robots-recheck.py --stale-days 7 --apply --revive
      - name: Deterministic pipeline (0 LLM)
        env:
          VAULT_DIR: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 這裡曾經是 `python scripts/pulse-probe.py || echo "…部分來源失敗，續跑"`。
          # 那句註解描述的情況 probe 根本不會用非零表示：單條來源抓失敗只寫進 stats，
          # main() 照樣 return 0。probe 的非零**全部**是致命的：
          #   2 = VAULT_DIR / _config 不見了     3 = 0 個可跑來源（硬防護，刻意大聲）
          # 於是 `|| echo` 沒有接住任何「部分失敗」，只接住了兩種必須紅燈的狀況。
          # 實測：把所有 lifecycle 改成 draft（0 可跑來源）→ probe 印 [fatal] 回 3 →
          # 被吞掉 → score/cluster/gate 拿舊資料照跑 → dist/index.html 生得出來 →
          # 部署成功 → 整條 job 綠燈。網站看起來好好的，只是再也不會更新。
          # 硬防護寫了不接等於沒寫，所以這裡讓它照原樣往上冒。
          python scripts/pulse-probe.py
          python scripts/pulse-score.py
          python scripts/pulse-cluster.py
          python scripts/pulse-gate.py
          python scripts/pulse-dashboard.py
          python scripts/pulse-render.py
          # 星速的 Δ/天有 `days = max(..., 0.5)` 下限。一天跑 12 班時如果班班都
          # --snapshot，基線才隔兩小時、Δ 卻被除以半天，★/天就變成一個看起來很正常
          # 的假數字——假數字比空欄危險，因為沒有人會去查它。
          # 所以改由快照自己的年紀決定該不該更新基線，不由班次順序或時鐘決定：
          # Actions 的 cron 是「最早不早於」，實測誤點過 96 分鐘，用時鐘判會在誤點
          # 那天整天不更新基線，而且一樣沒人會發現。20 小時＝一天一次但容得下誤點。
          python scripts/pulse-github.py --snapshot-if-older-than 20
      # 來源層健康分。放在 pipeline 之後，因為它吃的是 pulse-probe 這一班剛
      # append 進 _probe/source-runs.jsonl 的觀測。
      #
      # 敢直接掛 --apply 的理由：這支能自動寫的只有 probing/active → degraded，
      # 而 degraded **仍然每班被抓**（RUN_LIFECYCLES 有它），連續成功三班它會自己
      # 回來。dormant 永遠只有人能寫，達到隔離門檻的來源只進報告的候選清單。
      # 也就是說這一步做不出「無聲關掉一條好來源」那種沒有自癒路徑的傷害——
      # 2026-07-24 漏抓 Claude Opus 5 正是那種傷害。
      # continue-on-error：來源健康是觀測，觀測失敗不該讓整條資料鏈紅燈。
      - name: Source health (0 LLM)
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-source-health.py --apply
      # 機器產生的 vault 頁面。規格：references/vault-pages.md。
      #
      # 排在這裡的兩個理由，缺一不可：
      #   1. 必須在 Source health **之後**——兩支都讀 _probe/source-health.json，
      #      排在前面的話寫出來的分數永遠是上一班的。
      #   2. 必須在 Commit & push **之前**——它們產生的是要進版控的 vault 檔案，
      #      排在 commit 之後等於每班寫完就被下一次 checkout 洗掉，整天沒產出。
      #
      # Sources/*.md：pulse-render 從第一天就往每則 Event 的證據區塊寫
      # [[Sources/src-xxx]]，而那個資料夾裡只有一個 0 bytes 的檔案——所有事件的
      # 證據行在 Obsidian 裡都是紅色斷鏈，關聯圖的一整邊是空的。
      # 不掛 --prune：自動刪 vault 檔案不可逆，孤兒頁的代價只是多一個沒人連的檔。
      #
      # _dashboards/health.md：部署規格從第一天就寫著「last_success 過期即紅燈」，
      # 但這個檔案從來沒有存在過，gate.yaml 的 monitor.stale_after_days 也因此
      # 一直沒有消費者。
      #
      # continue-on-error：這兩頁是觀測產物，寫不出來不該讓整條資料鏈紅燈。
      #
      # 拆成兩個 step 不是排版偏好。同一個 `run:` 底下是 `bash -e`：前面那行非零，
      # 後面那行**根本不會執行**。而後面那行寫的是 health.md，health.md 的
      # generated_day 正是「排程整個死掉」的判準。也就是說：來源筆記產生器炸掉
      # （例如 _probe/state.json 被寫壞成非 dict），health.md 就停在昨天不動，
      # 死人開關於是報「鏈死了」——鏈其實好好的，死的是一支觀測腳本。
      # 一個假訊號指向錯的地方，比沒有訊號更花時間。分開跑，各壞各的。
      - name: Vault pages — source notes (0 LLM)
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-source-notes.py --quiet
      - name: Vault pages — health (0 LLM)
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-monitor.py --write-health > /dev/null
      # 跟上面兩支同樣的理由各佔一個 step：這一頁炸掉不該讓 health.md 停在昨天。
      # 這一頁取代 BACKLOG.md 以前那張手寫的〈現況〉表——手寫那版在寫下之後
      # 3 小時就過期了（實例清單第 9 條）。規格 references/vault-pages.md。
      - name: Vault pages — backlog status (0 LLM)
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-backlog-status.py --quiet
      # gate.yaml 的 clustering.unknown_entity.report_to 指的就是這一頁。
      # 在此之前那個路徑指著一個不存在的檔案，也沒有任何碼會產生它。
      - name: Vault pages — dictionary gaps (0 LLM)
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-dictionary-gaps.py --quiet
      # Tracks/ 與 Actors/：關聯圖的另外兩維。skill 的結構圖從第一天就畫著這兩個
      # 資料夾，repo 這端一直不存在（規格 references/obsidian-schema.md）。
      - name: Vault pages — track & actor notes (0 LLM)
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-entity-notes.py --quiet
      # 「我上次說要看什麼」的待回答清單。規格 references/vault-pages.md。
      # 它不判定任何事，只把主線的 next 與事件的「下一個訊號」整理出來讓人回答，
      # 答案進 _probe/signal-verdicts.jsonl。為什麼不自動核對，見
      # docs/design/2026-08-11-theme-tracking-revisited.md。
      # 排在這裡的理由跟上面幾支一樣：要進版控，所以必須在 commit 之前。
      - name: Vault pages — signal review (0 LLM)
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-signal-review.py --write --quiet
      # 星速榜的待譯清單。**由這一班準備，不由潤稿端自己重建榜單。**
      # 潤稿端是 Cowork 容器、沒有 GITHUB_TOKEN，未認證額度很緊——它自己跑
      # pulse-github.py 那一步是整個 C2 段唯一需要外部服務的地方，而 runbook
      # 的規定是「這步失敗就整段跳過」。實測結果：_github/desc-zh.json 在整個
      # git 歷史裡從來沒有出現過，榜上 225 條全是英文。
      #
      # 這一班有 token、每班都跑得到榜單，順手把清單寫進版控就好。潤稿端 clone
      # 下來就有，C2 少一個會失敗的外部依賴。規格見 scripts/enrich-runbook.md。
      #
      # --limit 25：單晚成本封頂。prep 量不到時回 2 且**不覆寫既有清單**，
      # 這一步 continue-on-error 所以不會擋鏈。
      - name: GitHub 榜單待譯清單（0 LLM）
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-github-desc-prep.py --limit 25
      # Event 標題的待譯清單。跟上面那條同一個形狀、同一個理由：判斷誰要翻是
      # 規則的事，翻成什麼字才是潤稿端的事。量不到時 prep 回 2 且不覆寫既有清單。
      - name: Event 標題待譯清單（0 LLM）
        continue-on-error: true
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/pulse-title-prep.py --limit 20
      # concurrency: nightly 只擋 Actions 撞 Actions。半夜潤稿那條 Cowork 鏈是另一
      # 個 push 來源，兩邊都寫 Events/*.md。一天 12 班時「checkout 完到 push 之間
      # 對面剛好也推了一版」不再是理論值，所以這裡重試而不是直接紅燈。
      # rebase 而非 merge：資料 commit 線性比較好讀，衝突時寧可失敗也不要自動合。
      - name: Commit & push data changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "本次無變更"
            exit 0
          fi
          git commit -m "chore: nightly refresh"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "[warn] push 被拒（第 $i 次），拉對面的版本重來"
            git pull --rebase origin main || {
              echo "[fatal] rebase 有衝突，停手不自動解——請人看一眼"
              exit 1
            }
            sleep $((i * 5))
          done
          echo "[fatal] 重試三次仍推不上去"
          exit 1
      # 這裡以前是 upload-pages-artifact + deploy-pages。搬去 pages.yml 了：
      # 那支本來就在 push 到 main 時跑，而這一步 push 完必然觸發它。
      # 兩支工作流同時宣告 `environment: github-pages` 是這次事故的形狀之一。
      # 設定檔不變式：機器這一班寫回 _config/ 的東西，還守不守得住規則。
      #
      # 為什麼要有這一步：selftest 從來只在人的機器上跑，而這條鏈**會自己改設定檔**
      # （robots recheck 寫 robots_ok / robots_checked_at、source-health 寫 lifecycle）。
      # 不變式只釘在人會走的那條路上，機器走的那條沒釘。
      # 2026-07-26 首班就撞到：recheck 把 src-media-theregister 寫成 robots_ok: false
      # 卻沒附 robots_evidence 入場券，兩條 selftest 當場紅——但 CI 不跑 selftest，
      # 那一班仍然全綠，一筆看起來像人手寫死的 false 就這樣進了 main。
      #
      # if: always()：跟死人開關同一個位階。設定檔壞了要有人知道，但不該擋住前面
      # 已經 push 出去的資料。（這段原本寫「放在部署之後」——部署已經搬去 pages.yml，
      # 現在它擋不到任何東西了，位置留著是為了讓警報跑在最後。）
      # 0.5 秒，不值得為了省它而讓機器寫壞設定檔沒人發現。
      - name: Config invariants (selftest)
        if: always()
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: python scripts/selftest.py
      # 死人開關：放在最後，紅燈不擋前面已經 push 出去的資料，但會寄失敗通知。
      # 觸發條件＝有事件「未 enrich 且放了 ≥2 天」——那代表半夜潤稿那條鏈連續兩晚沒跑到。
      - name: Health monitor (dead-man's switch)
        if: always()
        env:
          VAULT_DIR: ${{ github.workspace }}
        run: |
          {
            echo '### AI Pulse 健康監看'
            echo '```'
            python scripts/pulse-monitor.py --top 5 || true
            echo '```'
            echo '### 來源 robots 狀態'
            echo '```'
            # --stale-days 要跟上面那個 --apply 步驟同值。不給的話預設是 0，而
            # check() 裡的判斷是 `if stale_days and ...`——0 是 falsy，等於「一條都不跳」，
            # 於是這個純顯示用的步驟會把每條來源的 robots.txt 再抓一次。
            # 加上 apply 步驟一次、probe 抓每條來源時一次，同一份 robots.txt 一班三抓。
            # 我們自己沒有那個量的需求，而且這是最容易招來 429 的那種行為——
            # 429 是唯一一種「錯在我們自己」的狀態碼。
            python scripts/pulse-robots-recheck.py --stale-days 7 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # --alert-coverage：鏈在跑、但看不見某家必盯公司時要叫。前面那些指標
          # 回答的都是「有沒有動」，07-24 漏抓 Opus 5 那晚它們全綠。
          # 標了 pending 的已知缺口不觸警（要把待辦逼到零時另外跑 --alert-no-source），
          # 否則 CI 天天紅，人只會學會忽略 CI，連帶忽略真正的回歸。
          # --alert-stale：吃 gate.yaml 的 monitor.stale_after_days，判的是
          # 「幾天沒抓到任何項目」。排程整個死掉的那一種，靠的是 health.md 的
          # generated_day 停住不動——兩件事分開判，見 references/vault-pages.md。
          # --alert-unenriched-days 有兩個觸發條件，不只天數那一個：未潤稿又缺
          # ingested_at 的事件是「量不到年紀」，本身就算警報（紅線 8）。只看天數的話，
          # 缺欄位會讓 max() 回退成 0，開關自己閉嘴——見 references/health-alarms.md。
          # --alert-enrich-stale：半夜潤稿那條 Cowork 鏈太久沒推回 main 就叫。
          # 2026-08-05 那次它的 push 被沙箱 git proxy 擋掉（403，repo 不在該 session
          # 的授權集合裡），活做完了、commit 建了，跟拋棄式容器一起沒了——而上面
          # 那三個旗標**一條都沒叫**，因為判準各自對得上別的故障（未 enrich 是 0、
          # 中文覆蓋 31/35 不是 0、health 那一頁是這一邊自己寫的）。
          # 兩條鏈的失效模式不一樣，警報卻只長在其中一條上。
          python scripts/pulse-monitor.py \
            --alert-unenriched-days 2 --alert-coverage --alert-stale \
            --alert-enrich-stale > /dev/null
