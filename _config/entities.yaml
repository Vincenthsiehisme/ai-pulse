# ===========================================================================
# PRODUCT LINES — 手工維護；版本實體由 version_pattern 自動衍生
#
# 衍生規則（collector 執行，見 gate.yaml clustering.version_derivation）：
#   標題/摘要命中 canonical 或 alias，且其後接上符合 version_pattern 的字串
#   → 產生衍生實體 id：<line_id>@<正規化版本號>，parent = <line_id>
#   例：「Claude Opus 4.8 released」→ claude@opus-4.8，parent: claude
#   衍生實體是聚類主鍵；產品線本身只在無版本可辨識時當主鍵。
# ===========================================================================
product_lines:
  - id: gpt
    canonical: GPT
    term_type: product_line
    definition: "OpenAI 的基礎語言模型系列，以版本號區分世代。"
    aliases: ["GPT-3", "GPT-4", "GPT-5"]
    company: openai
    version_pattern: '(?:-|\s)?([0-9]+(?:\.[0-9]+)?(?:[a-z]|-(?:pro|mini|turbo|nano|sol|luna|terra))*)'
    status: active
    note: "GPT-5.5 / GPT-5.6（Sol / Luna / Terra 三軌）已於 2026 H1 出現；由 pattern 衍生，不手工列。"

  - id: chatgpt
    canonical: ChatGPT
