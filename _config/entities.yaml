# _config/entities.yaml — 命名實體字典（去AI化聚類的地基）
# ---------------------------------------------------------------------------
# 本檔是「字典本體」：只放 Identifier / Term / Definition / Aliases / Parent。
#
# 不在本檔的東西（刻意排除，避免層級混淆）：
#   - 聚類主鍵資格、共現規則、權重  → _config/gate.yaml 的 clustering: 段
#   - media_group / 獨立性判斷      → _config/sources.yaml（單一真相源）
#   - 來源健康、tier                → _config/sources.yaml + tiers.md
#
# 正規化約定（由 collector 的 normalize 層負責，字典不重複列）：
#   大小寫、全半形、連字號/空白、簡繁轉換。
#   → aliases 只列「一種寫法」，簡體別名不必再列繁體版本，反之亦然。
#
# aliases 收錄原則：**同一實體的不同稱呼**才算別名。
#   ✅ 深度求索 = DeepSeek（同一家公司的中文名）
#   ❌ multi-agent 不是 AI Agent 的別名（不同概念，各自獨立條目）
#   ❌ 谷歌 不是 Google DeepMind 的別名（上位公司，用 parent 表達）
#
# status: active（已驗證可用） | unverified（待人工查證） | watch（觀察中，未升 active）
# ---------------------------------------------------------------------------

meta:
  version: "1.0.0"
  updated: "2026-07-24"
  review_cycle: quarterly
  note: >
    v1 由 M0 建立。公司層與產品線層為手工維護；版本層由 version_pattern
    自動衍生，不手工列舉（發布頻率為每週級，手工維護必然落後）。

# ===========================================================================
# term_types — 本字典的實體型別，決定它在 gate.yaml 裡的聚類資格
# ===========================================================================
term_types:
  company:        "法人實體：AI 實驗室、模型供應商、晶片廠、雲廠、應用公司"
  product_line:   "持續演進的產品或模型系列，版本由 version_pattern 衍生"
  product:        "單一產品，無版本序列或版本不具情報意義"
  infrastructure: "運算硬體、加速器、資料中心層級的具名產物"
  framework:      "開源框架、函式庫、推論引擎、開發工具"
  technology:     "技術方法或協定；不具法人或產品身分"
  policy:         "法規、行政命令、標準文件等具名治理文件"

