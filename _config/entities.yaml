# ===========================================================================
# 刻意不收（v1 決議，非遺漏）
# ===========================================================================
# people（Sam Altman / Elon Musk 等）：
#   人物名穩定但歧義低、情報價值多半附著於公司事件；且人事變動頻繁、
#   維護成本高。v1 不收，待實際跑過一輪後若證實有「人物獨立成 Event」
#   的需求再開 people 段。
#
# benchmarks（SWE-Bench / GPQA / MMLU 等）：
#   名稱穩定，但常出現在模型發表文的比較段落，收進來會讓不相關的模型
#   發表互相聚類。待 gate 進入 shadow mode 有實測資料後再決定。
#
# funding rounds / 估值數字：
#   非命名實體，屬事件屬性，應由 Event frontmatter 承載，不進字典。
