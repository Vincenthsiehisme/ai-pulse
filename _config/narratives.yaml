# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述/口吻」，是全系統唯一准 LLM 動手處：由排程 Cowork 任務（非 0-LLM 自動抓取鏈）
# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-11-19'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 今天新增兩則。NVIDIA 與微軟在 Microsoft Ignite 擴大合作，範圍從 Azure 基礎設施延伸到工業系統與 Windows PC，並擴大 Azure 虛擬機器等的取用管道；來源摘要在此截斷，機型規格與上市時間證據不足。OpenAI 介紹 Performance Factory，一套由 Codex 驅動、負責找出並修復效能問題的流程，用來維持 ChatGPT 的回應速度；架構與效能數字摘要沒有提供。 前一輪：11-18 NVIDIA RTX Spark 小型桌機由 ASUS、Dell、MSI 推出，今日開賣，最高 128GB 統一記憶體；Hugging Face 刊出用 Transformers 在 32GB 記憶體上跑 180B MoE 模型的文章，兩則都沒有價格、吞吐量或品質數字。11-17 NVIDIA 的 Ian Buck 在 SC26 宣布給 AI agent 用的新工具、Nemotron for Science 與 Rubin HPC GPU，規格、價格與出貨時間證據不足。11-16 NVIDIA 稱 Vera Rubin 首次參賽就拿下 MLPerf Training v6.1 全部項目，是廠商自述；Lambda 用 Photonics CPO 交換器串接 GB300 NVL72，功耗與故障率沒有數字；vLLM v0.34.0 新增 10 個模型支援，KV cache 預設改成依暖機後實際剩餘記憶體配置。11-13 llama.cpp 進入 v1.0.0，變更內容證據不足。
    next: 看 Azure 新虛擬機器的實際規格、供應區域與上市日期；看 Performance Factory 有沒有公布修復數量、延遲改善幅度或人工介入比例；看 RTX Spark 各機型定價與可跑的模型大小，以及 MoE 專家串流的 tokens/s。 看 Rubin HPC 的規格與出貨時間；看 MLPerf Training v6.1 其他廠商的送件情形；看 Lambda 公布的 CPO 部署規模、故障率與功耗；看 vLLM 新模型支援的實測吞吐，以及 KV cache 預設改動有沒有引發記憶體回報；看 llama.cpp v1.0.0 有沒有穩定承諾。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: '今天新增一則。OpenAI 發文〈Research acceleration: The jagged frontier〉，量測程式碼代理加速 AI 研究的程度，並承認代理的表現參差；來源摘要沒有給加速倍數與方法，是 OpenAI 自家量測，沒有外部複現。 前一輪：11-18 新增四則。Google DeepMind 的 Gemini 4 Neon 與 Genie 4 開放使用，依授權只放標題與連結，規格與價格不在手上。Hugging Face 上有 Rumble-2-Flash（開放的 0.5B 語音模型，支援 40 多種語言）與 RadixArk 的 DaisyRose-27B（主打後訓練效率），兩篇的來源摘要都只有通用介紹，評測數字沒有。11-17 OpenAI 發布 GPT-6.2 Astra 與 Sol，Astra 面向最難的專案，Sol 面向日常工作，API 同步開放；價格與基準測試證據裡沒有。11-16 OpenAI 開始「嵌入式評估」，找 Apollo Research、METR、Transluce 與 Goodfire 獨立檢驗對齊、防護與監控系統，範圍與結果公開方式沒寫。11-13 Anthropic 四篇新聞頁文章依授權只放標題與連結；Ai2 的 XYBench 設計與結果手上沒有。11-12 IBM 說 Granite 4.1 的 3B 與 8B 已內建 LLMON。'
    next: 看 OpenAI 那篇全文有沒有公布具體加速倍數與任務分類，以及其他實驗室有沒有發表可比較的量測；看 Gemini 4 Neon 與 Genie 4 原文公布的規格、基準測試與定價；看 Rumble-2-Flash 的語言別錯誤率與授權條款；看 DaisyRose-27B 是否公開權重與訓練成本。 看 GPT-6.2 的價格與第三方基準測試；看 OpenAI 嵌入式評估的第一批報告何時發布；看 Anthropic 那幾篇原文有沒有可驗證的具體措施；看 XYBench 是否公開資料集與評分程式；看 LLMON 的模型卡有沒有對比 JSON 與 XML 的準確率。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 今天新增兩則。住友生命用 ChatGPT Enterprise 研究保險同業、準備提案、撰寫投資分析程式碼，摘要提到主管先用帶動員工採用，採用率與成效數字沒給，是 OpenAI 自己發的客戶案例。另一則是 NVIDIA 的 GeForce NOW 黑色星期五促銷，六個月方案首期六個月 7 折，與 AI 產品線關聯薄弱。 前一輪：11-18 Le Groupe Figaro 與 OpenAI 合作，Le Figaro 的新聞以摘要與節錄進入 ChatGPT，並附原文連結；授權費與期限證據裡沒有。11-17 OpenAI 稱 Astra for Law 在涵蓋 24 個法律領域的發布評測排名第一，ChatGPT Enterprise 客戶可申請使用；評測方法與對手證據裡沒有，是廠商自選評測。11-16 OpenAI 擴大 ChatGPT for Academic Researchers，讓全球 20 萬名研究者免費使用前沿模型，資格條件與額度沒給；Hugging Face 與 OpenRouter 合作，整合方式與定價只有通用簡介。11-12 ChatGPT Ads 指定 Aleph 為 44 國獨家經銷商，廣告營收規模沒給；Gondola 案例說 Codex 讓主力工程師產出提高 50%，沒有第三方查證。
    next: 看住友生命案例全文有沒有揭露使用人數、採用率或成效數字；看 Figaro 與 OpenAI 是否公布合作條件或導流成效，以及其他歐洲出版商是否跟進。 看 Astra for Law 的評測方法與對手是否公開，以及律所的實際使用回報；看 OpenAI 或 Aleph 是否公布 44 國的廣告主數量或營收；看學術研究者方案的申請條件與每人額度；看 Hub 模型頁是否出現 OpenRouter 的呼叫入口；看 OpenAI 是否公開 Gondola 案例的衡量方式。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 今天新增一則。Anthropic 公告首次公開募股（IPO）已定價，標題為〈Anthropic Prices Initial Public Offering〉；這個來源依授權只放標題與連結，定價與發行規模我們不轉述，請看原文。 前一輪：11-16 LVMH 旗下媒體部門與 OpenAI 宣布策略合作，要用 AI 支援新聞業並讓刊物能透過 ChatGPT 取得，金額、期限與授權範圍證據裡都沒有；NVIDIA 在 SC26 紀念 CUDA 二十週年，是紀念稿，沒有新產品或新數字。11-13 Anthropic 三篇新聞頁文章（美國選舉準備、支持 SB 53、對美國 AI 行動計畫的看法）依授權只放標題與連結。11-09 NVIDIA 與韓國科學技術資訊通訊部宣布對韓國新創的新投資計畫，投資對象與金額證據不足。11-05 Anthropic 發表〈The Long Term Benefit Trust〉，同樣只有標題與連結。11-04 OpenAI 宣布收購 Pierre Computer Company, Inc.，金額與業務目前看不到。
    next: 看 Anthropic 原文公布的定價與發行規模，以及掛牌後的交易表現與其他媒體的獨立報導；看 ChatGPT 內出現 LVMH 刊物的呈現方式，以及雙方是否公布授權與分潤條件；看 SB 53 的後續立法進度與其他業者是否表態；看 NVIDIA 或被投資新創公開具體投資對象與金額；看 OpenAI 或 Pierre 是否公布交易金額與交割時間。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 今天新增一則。OpenAI 說明 Codex 在 macOS、Linux、Windows 上如何執行指令，並依使用者設定限制檔案與網路權限；隔離機制的實作細節摘要沒有提。 前一輪：11-17 新增一則。OpenAI 推出 ChatGPT for Sales，含 Sales 外掛與 30 多個新增或擴充的夥伴外掛，用途是研究潛在客戶、準備提案、更新 CRM；外掛清單與寫回權限的控管方式證據裡沒有。前一輪：11-16 OpenAI 的 Revolut 案例宣稱用模型與 Codex 把寫程式時間縮短 30 到 60%，數字來自廠商自述，沒有基準線。ChatGPT for Healthcare 加上 computer-use agent、更好的臨床問答與跨醫療軟體的外掛，沒有功能細節與價格；同日另一篇談醫療團隊 computer-use agent 的文章只放標題與連結。Holiday Extras 案例說 dots 會在沒人要求時主動交出上線報告。NVIDIA 擴充 CUDA-X，新增 cuPhoton、cuPotential、cuSpa，加速倍數不在證據內。
    next: 看 Codex 沙箱原文是否列出各平台的隔離機制，以及外部資安研究者有沒有人驗證或繞過。 看 Sales 外掛清單是否涵蓋主要 CRM 廠商，有沒有企業公開導入後的流程數據；看 Revolut 是否公開 30 到 60% 的衡量方法；看哪些醫療機構公開採用 computer-use agent，有沒有臨床準確度的量化數字；看 dots 是否成為正式產品名稱；看 CUDA-X 各函式庫的基準數字，以及有沒有 agent 框架官方整合。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 今天新增兩則，都是 OpenAI 的政策類文章。「Managing frontier AI risk」整理從訓練到部署的對齊、沙箱、封鎖防護與監控，各項門檻摘要沒有提；Dean Ball 的「The Silent Consensus」談更強的 AI 如何改變社會，是個人署名的觀點文。 前一輪：11-17 新增兩則，都是 OpenAI 與政府的合作。OpenAI for Chile 與智利政府合作，方向是負責任的 AI 採用、公部門技能培訓、協助當地新創，金額、期程與授權條件證據沒有。OpenAI 與北約及盟國網路機構合作，讓受信任的防禦方用 AI 找漏洞、測修補，參與國與使用的模型沒寫。前一輪：NVIDIA 的 AI Day Seoul 兩天吸引逾 2,000 人，主題是實體 AI 與 AI agent，沒有具體合作案或金額。The King's Trust 與 OpenAI 推出 100 萬英鎊合作，協助英國最多 25,000 名年輕人學 AI 技能。Anthropic 的〈Canadian AI Research〉與另外兩篇新聞稿只放標題與連結。11-12 OpenAI 出資 200 萬美元投入 AI 與兒童安全研究，受款單位與期程沒給。
    next: 看風險管理文章是否附可驗證的評估門檻，以及政策圈與第三方的回應；看 Dean Ball 那篇有沒有提出具體的制度建議。 看智利合作是否公布預算、參與的政府部門與首批新創名單；看北約合作是否公布參與機構與第一批可驗證的漏洞發現與修補成果；看 King's Trust 課程是否開跑、首批受訓人數；看 Anthropic 加拿大那篇原文是投資、合作還是據點；看 OpenAI 200 萬美元的受款團隊；看韓國業者後續是否公布與 NVIDIA 的機器人或實體 AI 專案。
    lenses: []
