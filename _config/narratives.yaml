# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述/口吻」，是全系統唯一准 LLM 動手處：由排程 Cowork 任務（非 0-LLM 自動抓取鏈）
# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-09-23'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 這一輪新增五則，NVIDIA 之外多了兩條新面孔。NVIDIA 這邊兩則都在講安全與供應鏈門檻：一則主張自駕車與工業機器人衝上千萬台規模後安全必須做在每一層，另一則推出 DSX Ready 計畫，認證電源與散熱產品是否適配 AI 工廠架構，延續上一輪「把每一塊錢算力壓低」往硬體供應鏈延伸的路線。另外三則轉向推論層的軟體效率：vLLM 釋出 v0.30.0，新增支援 DeepSeek-V4.1-Flash 並用 MXFP8 格式省顯存；Hugging Face 的 Transformers 函式庫現在支援執行 llama.cpp 的量化格式；Hugging Face 也發布 tokenizers v1，主打 encode/decode 效能量測，但內文本站尚未取得。五則合起來，這條線目前同時在硬體供應鏈認證與推論軟體效率兩端往前走，跟先前電網協調、MLPerf 基準測試的節奏接得上。
    next: 留意 DSX Ready 第一批通過認證的電源／散熱廠商名單；觀察 vLLM 與 Transformers 這兩項推論效率更新是否有其他團隊的實測數字佐證；同時待補抓 tokenizers v1 的完整內文，才能確認它具體改動了哪些效能指標。AEMA 聯盟的成員擴張與 MLPerf 完整榜單對比，仍是原本要觀察的訊號。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這一輪新增一則：OpenAI 9/21 宣布籌組獨立的數學與人工智慧諮詢小組，負責審核並協助對外溝通 AI 在數學領域的產出。這跟上一輪的失準通報框架、生命科學驗證計畫是同一種動作，OpenAI 又一次把「先讓外部人審過再對外講」的機制往新的領域（這次是數學）複製一份，不是模型能力本身的迭代。目前這條線累積三則都指向治理與信任機制，跟「小而專、成本導向」的模型迭代主軸暫時分屬兩個方向，還沒有新的模型發布訊號能驗證主軸有沒有持續。
    next: 留意這個數學諮詢小組是否公布成員名單與第一個審核案例；也持續觀察前兩則失準通報框架、生命科學驗證計畫有沒有被外部引用或查證。同時仍要等下一輪有沒有新的模型發布訊號，才能判斷「小而專、成本導向」這條主軸還在不在。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這一輪新增三則，分屬三種產品動作。xAI 發布 Grok Bot 客服功能公告，但站方標示 ai-input=no 不授權轉述，實際規格看不到；NVIDIA 在紐約氣候週點名五家用其 AI 技術做乾淨能源的公司，是案例展示而非新模型；OpenAI 則擴大 OpenAI Academy 學習路徑，涵蓋員工、開發者、教育工作者與學生。三則都不是能力發布，延續的是既有格局：OpenAI 持續用案例與教育資源衝產品聲量，NVIDIA 持續用垂直產業案例證明平台價值，xAI 這次少見地在客服場景推新功能，但因授權限制看不出實際規格。Google DeepMind 上一輪「能力接產品入口」的定位這一輪同樣沒有新訊號補上。
    next: 留意 xAI 是否釋出 Grok Bot 客服功能的公開文件；找出 NVIDIA 點名的五家乾淨能源公司名單與應用場景，確認是概念驗證還是量產運行；同時觀察 OpenAI Academy 新課程的實際內容或採用數字。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 這一輪新增一則：oMLX 的創建者與維護者 Jun Kim 加入 Hugging Face，任務是支援 MLX 社群，但摘要來源只給了 Hugging Face 網站的通用宣傳句，沒有更多細節可查。跟上一輪 Anthropic 那五則募資與人事任命比，這則規模小得多，性質也不同，是開源社群的人才吸收，不是資本或組織層級的擴編。這條線目前仍是 Anthropic 那輪 Series F 與人事任命撐著大部分份量，這則新增的是另一種形式、小規模的人才動態。
    next: 找到 Jun Kim 加入 Hugging Face 的公告全文，確認具體職務與近期規劃；同時持續留意 Anthropic Series F 的投資人名單是否揭露，以及這輪估值跟 OpenAI 等競爭對手最新估值的相對位置。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增兩則，方向不太一樣。OpenAI 發布客戶案例，介紹新創 V7 用 GPT-5.6 把公司內部檔案整理成 agent 可用的機構記憶，延續上一輪「agent 怎麼被產品化」的脈絡；NVIDIA 則發布 Isaac ROS 5.0，把 GPU 加速模組疊上開源 ROS 框架，讓機器人也能用上感知、推理、行動這一套 agent 邏輯，把這條線從純軟體 agent 拉向實體機器人開發工具鏈。兩則合起來看，這條線目前同時在兩個層面往前走：企業知識場景的 agent 化，跟機器人開發框架的 agent 化，還看不出哪一個會成為主軸。
    next: 留意 V7 是否公開更多技術細節或客戶採用數據；同時觀察 Isaac ROS 5.0 具體新增了哪些模組（原始摘要在列清單時被截斷），以及有沒有開發者社群的採用回饋，用來判斷機器人這條分支的力道有多大。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增三則，政策論述那條線持續加碼。OpenAI 提出推動全球 AI 標準的路徑，呼籲在評估、通報與治理機制上協調一致；隔一天再發一份文件，說明對前沿模型進行第三方評估該遵循哪些優先順序與原則。兩則合起來，是繼澳洲青少年安全藍圖之後，OpenAI 把政策論述從單一法域拉高到全球治理層級。另一則是 NVIDIA 在開羅活動上呈現埃及 AI 生態系走向量產規模，延續先前曼徹斯特大學案例代表的「區域落地應用」那條分支，換成中東北非市場。這條線目前仍是「據點、信任建設、政策論述三條戰線同時加速布局」的格局，這次是 OpenAI 把政策論述線拉到全球層級、NVIDIA 把區域落地線延伸到新市場。
    next: 觀察 OpenAI 這套全球標準倡議與第三方評估原則是否有具體標準文件、參與機構名單或第一份評估報告公布，用來判斷是實質倡議還是治理姿態的宣示；同時留意埃及這場活動後續有沒有具體投資、合作案或新創案例公布。澳洲監理機關對青少年安全藍圖的回應與曼徹斯特大學 Earth-2 案例的後續，仍是原本要觀察的訊號。
    lenses: []
