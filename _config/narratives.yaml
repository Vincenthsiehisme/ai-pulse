# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述/口吻」，是全系統唯一准 LLM 動手處：由排程 Cowork 任務（非 0-LLM 自動抓取鏈）
# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-11-11'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 今天新增一則。NVIDIA 在 KubeCon 宣布捐出 OpenShell 並擴大開源與 AI 基礎設施投入，OpenShell 的用途與接收的社群摘要沒說清楚，證據不足，待補。前一輪：11-09 NVIDIA 為 SK 電信、LG、Upstage、Motif 四款韓國開放模型釋出 Dynamo 部署配方，處理單張 GPU 放不下的大模型，沒有吞吐量或延遲數字。OpenAI 介紹 Control Room，可追蹤研究設施上的模型工作負載並在安全疑慮時停掉，架構與觸發條件證據不足，待補。11-06 OpenAI 與 Hacktron 合作找自家系統漏洞，範圍與發現數量沒公開。NVIDIA 稱 GPU 記憶體壓力與價格上升會持續，具體數據沒給。
    next: 看 OpenShell 是否進入 CNCF 等中立基金會、有哪些專案採用；看 Dynamo 配方公布的實測吞吐量與四款模型的部署案例；看 OpenAI 是否公布 Control Room 的實際停機事件；看 Hacktron 合作是否發布測試結果。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 今天新增兩則。DeepMind 的 AlphaGenome 2 預測 DNA 序列與變異對特定人類細胞類型和疾病的影響，摘要沒有基準數字，也沒說與前一版差在哪。QVAC 在 Hugging Face 發表 BotPsy，標題主打十億參數以下的裝置端代理模型，來源只有一句作者說明，沒有內文，證據不足，待補。前一輪：11-09 Amazon 的 HOPE 談混合專家模型剪枝時保留彼此相依的專家，方法與結果未知。同日 DeepMind 的 Gemini Robotics 2.5 自稱最強視覺語言動作模型，沒有基準數字。11-06 OpenAI 的 BioBasicsBench 用 100 項任務測代理處理濕實驗數據，沒給任何模型得分，基準由 OpenAI 自己設計。11-03 Ai2 的 StateBench 與 11-02 OpenAI 的 LifeVal 都沒給題數與成績。10-28 Gemini 4 Carbon 的榜首說法與外界反應不一致。
    next: 看 AlphaGenome 2 是否釋出論文與基準對比、是否開放研究者使用；看 BotPsy 的權重是否公開，以及工具呼叫基準與實機延遲；看 Gemini Robotics 2.5 是否公開評測數據與第三方重現；看 HOPE 的剪枝比例、基準分數與是否釋出程式碼；看 StateBench 與 LifeVal 是否公開題目與排行榜；看 Gemini 4 Carbon 何時開放使用，以及第三方對榜首的驗證。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 今天新增四則，全是單一來源的廠商自述。新加坡航空說 Kris 聊天機器人的 CSAT 翻倍，沒有絕對值。OpenAI 說逾 20,000 名退伍軍人與轉職軍人領了一年免費 ChatGPT Plus，是領取數不是續用數。NVIDIA 說視覺 AI 與機器人讓數千噸回收材料免於掩埋，沒有時間範圍與業者名稱。JioStar 與 Gilbert + Tobin 兩則訪談只有主題，沒有成效數字，證據不足，待補。前一輪：OpenAI 與 Upwork 的研究指出 AI 相關自由接案的預算與工時上升，OpenAI 是共同作者。OpenAI 的 ChatGPT Businesses 讓商家查看自己在 ChatGPT 的呈現，是否收費、如何排序沒寫。ChatGPT Enterprise 上架 AWS Marketplace，價格與抵用承諾額度沒寫。Anthropic 的〈Roadshow Launch〉依授權只放標題與連結。
    next: 看新航是否補上 CSAT 絕對值與處理量；看免費方案是否擴到其他族群，或公布領取者的續訂情況；看 Businesses 是否公布排序規則、收費或廣告機制；看 Upwork 研究的方法與樣本，以及獨立研究是否得到相近結果；看 AWS Marketplace 與 Google Cloud Marketplace 的定價與抵扣條件；看 Roadshow Launch 原文有沒有可驗證的產品或時程訊息。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 今天新增一則。NVIDIA 與韓國科學技術資訊通訊部在 COEX 辦 AI 新創合作論壇，會見 20 多家新創，領域含基礎模型、實體 AI、AI 基礎設施與 AI 半導體，標題寫新的計畫中投資，投資對象與金額在摘要裡被截斷，證據不足，待補。前一輪：Anthropic 發表〈The Long Term Benefit Trust〉，來源不允許取用內文，我們只有標題與連結，原文在 anthropic.com/news/the-long-term-benefit-trust。11-04 OpenAI 宣布收購 Pierre Computer Company, Inc.，金額、條件與業務目前看不到。11-03 與 11-02 是兩則 OpenAI 人事公告，沒有金額或合約。
    next: 看 NVIDIA 或被投資新創公開具體投資對象與金額；讀 Long Term Benefit Trust 原文，看治理安排是否有後續公告；看 OpenAI 或 Pierre 是否公布交易金額、交割時間與團隊整併；看 OpenAI 與 Orchestra Bio 是否公布交易條件。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 今天新增一則。Cogent 把 OpenAI 模型和企業內部脈絡結合，讓代理自動修補漏洞，是 OpenAI 部落格的客戶案例，摘要沒有客戶數、修補量或成效數字，也沒說修補是只給建議還是直接上線。前一輪：11-10 DeepMind 的 AlphaProof Code 用 Lean 寫了三百萬行證明來驗證 Signal 的核心加密，證明涵蓋範圍摘要沒寫。11-09 OpenAI 的 CodeRabbit 案例說用 Codex 讓同一批工程師出貨 20 倍，計算口徑與時間範圍沒給，屬廠商自述。11-05 Cult.fit 與 Merge 兩則 OpenAI 客戶案例沒有具體清單或效率數字。11-04 OpenAI 的自動化流程在 Linux 核心找到並驗證 948 個本機提權漏洞，誤報率與上游採納數量沒有。
    next: 看 Cogent 或客戶是否公布修補成功率與誤修率；看 Signal 或第三方是否獨立確認 AlphaProof Code 的證明結果，以及證明庫是否公開；看 CodeRabbit 是否公布出貨量與缺陷率的對照；看 Linux 核心上游是否合併那批修補，以及誤報率。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 今天新增三則，兩則與韓國有關。NVIDIA 與韓國科學技術資訊通訊部擴大主權 AI 合作，涵蓋 AI 半導體、資料中心、人才、新創、模型、代理與資安，並為韓國 NPU 與 XPU 共同開發鋪路，摘要沒有時程與金額。另一組兩篇文章談韓國製造業的實體 AI，以及代理 AI 的安全：現代集團在探索 NemoClaw 藍圖與 OpenShell 執行環境，AIM Intelligence 把 Starfort 整合進 OpenShell，用詞是探索與整合，沒有部署規模。NVIDIA 在 Hugging Face 發布日本金融情境的合成人物資料集 Nemotron-Personas-Finance-Japan，資料量與授權證據不足，待補。前一輪：11-06 Open ASR Leaderboard 加入埃及與奈及利亞口音的英語，資料集規模與排名沒有證據。Project ProtoStar 只有標題，合作單位與時程沒有證據。10-22 NVIDIA 歐洲系列談公部門與 Earth-2，沒有點名機關與預算。
    next: 看韓國合作公布 NPU 與 XPU 共同開發的時程與參與的韓國晶片業者；看現代集團或其他韓國業者公布 NemoClaw、OpenShell 的實際部署範圍；看 Nemotron-Personas-Finance-Japan 的下載數與日本金融任務上的第三方使用；看 Open ASR Leaderboard 新增資料的規模與各模型錯誤率；看 ProtoStar 首批資料集上線時間；看有沒有具名的歐洲政府機關公開採用開放模型。
    lenses: []
