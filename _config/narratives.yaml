# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述」，人為維護、可過 speak-human-tw，刻意獨立於 0-LLM 抓取管線；
# 夜間鏈只在某主線有新事件時重寫該條 now / next（thesis、lenses 不動）。
version: 1
updated: '2026-07-25'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: NVIDIA 還是主角，但這輪多了軟體端。硬體側 Vera Rubin 用每 token 成本、每瓦效能、每塊錢智慧輪流打，往外鋪到網通（Spectrum-6）、在地製造（緯創德州廠、Build in America）、實體與醫療（開源醫療物理模擬、海軍研究院的 DGX GB300、BMS 製藥 AI 工廠）。新進來的是推論軟體這條：vLLM v0.26.0（411 個 commit、新增 Inkling 家族、推測解碼），以及 Hugging Face 把 Nunchaku 4-bit 擴散推論接進 Diffusers，都是實打實壓低推論成本的工程。OpenAI 這邊則是 Project Camellia 在喬治亞州綁能源與社區承諾，屬於搶地搶電那端。方向一致：供給端在替 agent 工作負載重新定價，戰線鋪到實體 AI 與產地，現在連開源推論棧也一起降成本。
    next: 硬體那批仍要第二個獨立來源（雲廠、對手晶片、實際部署者）印證「每 token 成本最低」的說法。可追的硬事：緯創福和市廠的產能爬坡、BMS 的算力跑出什麼研發成果、開源醫療模擬有沒有外部團隊採用。軟體這條可查實測：vLLM 新優化的 throughput 數字、Nunchaku 4-bit 的品質與速度取捨。NVIDIA 那批仍多為單一來源、標待證實。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；四則皆單源、heat 偏低（8–14），還沒跨來源共振。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這輪主軸換人了。Anthropic 一次端出旗艦 Opus 5、中階 Sonnet 5、輕量 Haiku 4.5，整條產品線改版，其中 Opus 5 拿到多個獨立來源、熱度明顯高過同批其他發布。Google 這端的 Gemini Flash 變體，延續上一輪的輕量分化。另外兩條旁支：Anthropic 用 Economic Index Connector 與研究基金議程，把「AI 對經濟影響」做成研究資產；OpenAI 則在安全面出招，公布長時程模型的失效教訓，並和 Hugging Face 揭露模型評測期間的資安事件。方向從「比誰最強」轉成「整線佈局加安全治理」。
    next: 等 Opus 5、Sonnet 5 的第三方 benchmark 與定價，看主版號跳升是真跳代，還是命名策略。安全那條看 OpenAI 有沒有把 safeguard 寫進 model card、資安事件有沒有完整的 post-mortem。Anthropic 的經濟研究資產，看有沒有外部真的接取或撥款。多數事件仍是單一來源、標待證實。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這輪產品訊號的主線是「把模型塞進既有入口」。xAI 最積極，Outlook、Excel、Google Workspace 三個外掛連發，寄生微軟和 Google 的辦公生態搶使用場景。OpenAI 走垂直落地：ChatGPT 健康功能（串接病歷與 Apple Health）、小企業計畫、NTT DATA 把事故分析壓到 30 分鐘的導入案例，外加財務長那套 ROI 計分卡。Google 的 Flash Cyber 把能力包成資安產品。雜訊有兩則 NVIDIA（SIGGRAPH 展示、GeForce NOW 遊戲上架，與 AI 主線關聯低），以及 Anthropic 一則疑似未上線的創意工作頁。整體是能力落地成功能與通路，不是發新模型。
    next: 看這些外掛與功能有沒有離開發布稿的實際採用數字，尤其 xAI add-in 的企業部署、OpenAI 健康功能的監管與隱私爭議、NTT DATA 那個 30 分鐘能不能由客戶自己證實。Anthropic 的創意工作頁等正式公告再認列。NVIDIA 的遊戲營運訊號可以先放一邊。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，heat 8–10 偏低；當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 兩則。Google 的 Genesis Mission 用 4,000 萬美元的 token 與額度（而非現金）綁科研，摘要自評象徵大於實質，代表雲廠開始拿「算力額度」當投資工具。另一則是 OpenAI 董事會補進兩名金融重量級人物 David Vélez 與 Robin Vince，在雙層（Foundation 加 PBC）結構下找金融背景董事，通常是為更大的融資或財務規模鋪路。兩則分別指向「算力當資本」與「治理為資本化鋪路」，方向不同，但都是公司資本化的動作。
    next: 看有沒有第二筆「算力當資本」的同類案例，判斷 Google 那招是模式還是個案；OpenAI 這邊看董事變動後，有沒有大型融資、重組或財務揭露對得上。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這條線目前只有一則已發布事件：OpenAI Presence，一個企業級 agent 平台，主打可部署的語音與聊天客服 agent。這是 OpenAI 從賣 API 往上做打包 agent 產品的動作，但單一事件還撐不起趨勢判斷。
    next: 看 Presence 的定價與首批客戶，判斷它是真平台還是 API 的包裝；也看有沒有第二家把 agent 平台化的對應訊號進來，這條線才談得上收斂。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這條線目前兩則都是「國家隊乘上 AI 巨頭」。南韓總統李在明率企業界在 AI Summit 與 NVIDIA 及夥伴會談，挾三星、SK 海力士的 HBM 供應鏈籌碼談算力綁定；OpenAI 則宣布與美國能源部及國家實驗室合作，用前沿模型加速科學。共同點是 AI 算力與科研變成國家級的外交與戰略議題，企業和政府互相綁定。
    next: 兩則都停在宣示層，要看有沒有具體數字落地：南韓的 GPU 採購、資料中心或半導體合作，OpenAI 與能源部的具體專案、經費與成果。事件數還少，這條線的判斷先當暫定。
    lenses: []
