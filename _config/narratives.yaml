# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述/口吻」，是全系統唯一准 LLM 動手處：由排程 Cowork 任務（非 0-LLM 自動抓取鏈）
# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-08-12'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: NVIDIA 仍是這條線的主角，這輪新增一則觀點文：算力擴張的瓶頸已經從「總耗電量」轉向「供電架構本身」，傳統供電方式沒辦法有效把電力從電網送到 GPU，NVIDIA 提出 800 VDC 這個新方向，但沒給具體規格或第三方驗證數字，是廠商立場文。這接著上週的記憶體牆論述（AI 的資料集與 context window 撐爆系統記憶體，主張要有效率的儲存架構）——兩篇合看，NVIDIA 正在把敘事重心從晶片本身，往供電與記憶體這類「晶片外」的基礎設施瓶頸移。硬體側 Vera Rubin 仍用每 token 成本、每瓦效能輪流打，往網通、在地製造、實體與醫療鋪；Vera CPU 加速 EDA，攜手 Cadence 與 Synopsys 設計下一代晶片。軟體端推論棧持續降成本：vLLM v0.26.0 帶 411 個 commit 與多項 GPU 優化。
    next: 供電架構那則看是否有實際部署案例採用 800 VDC，或第三方工程機構的獨立評估。記憶體牆那則看有沒有落到具體產品或規格。硬體那批仍要第二個獨立來源印證每 token 成本最低；軟體可查實測：vLLM 新優化的 throughput、Nunchaku 4-bit 的品質與速度取捨。NVIDIA 那批仍多為單一來源、標待證實。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這條線最新加了三則：NVIDIA 把 Nemotron 3 家族擴到 Nemotron 3.5 Lightning，主打長時間執行 agent 任務的效率，同時發布 NeMo Switchyard；NVIDIA 另開一個系列文章，八月起要陸續介紹本地開源模型與代理社群的夥伴，目前只有開場頁、沒點名具體對象；OpenAI 把 Daybreak 網路安全治理框架具體化成 GPT-5.6-Cyber，一個專供審核過對象使用的資安模型，跟同批「先審核、再開放」的存取管制公告接在一起看。這些延續原本兩股主軸：一股是模型往小而專、能落地走（LFM2.5-2.6B 端側 agent、Alpamayo 2 Super 自駕商用、GPT-Live 即時語音架構）；另一股是安全與濫用治理，且清一色自述（查禁柬埔寨詐騙集團、第三方網安評測事件說明、EU AI Act provenance）。效率端 GPT-5.6 把賣點從更強移到更省，還自曝兩個 API 設定就讓 ARC-AGI-3 分數翻三倍，等於自己提醒這種跑分經不起設定操弄。
    next: Nemotron 3.5 Lightning 要看有沒有第三方基準測試佐證「同級距最高效率」的說法；那系列開場文看後續是否點名具體模型與夥伴；GPT-5.6-Cyber 看是否有第三方資安研究者測試或實際案例流出。端側與開放模型那批持續看實測：LFM2.5-2.6B 的工具呼叫成功率、Alpamayo 2 Super 的第三方驗證。效率端 GPT-5.6 的每 token 成本要對前代與對手，ARC-AGI-3 那個三倍看有沒有第三方用同一組設定複現。安全治理那批全是自述：查禁詐騙看有沒有完整威脅情報與執法佐證，評測事件那則看執行評測的第三方會不會出面講同一組事件。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這條線最新加了五則，主軸不變——把 AI 能力接進更多客群與商業模式，但這次多了一條新支線：ChatGPT 開始測試廣告，作為支撐免費版的營收來源，是從純訂閱擴充到廣告模式的轉向，官方強調標示清楚、答案獨立、有隱私保護，但這是自我保證，不是外部驗證。企業案例端新增兩則 OpenAI 客戶故事：Virgin Atlantic 用 ChatGPT Work 串連客戶旅程訊號、Zapier 用它降低行銷漏斗流失，這些都是 OpenAI 自己發布的案例，沒有第三方或量化數字佐證。方案分層端：ChatGPT Business 加推 Premium 席位，8 月 20 日前訂閱送 100 美元額度，是把付費層級再往上切一層。網路安全治理端也新增一則：OpenAI 讓通過審核的 Daybreak 夥伴使用前沿網路安全模型做授權資安服務，跟同批「Expanding Daybreak」的 GPT-5.6-Cyber 發布是同一套治理框架。原本的落地案例（avatarin 24 小時客服兩週 3 萬人用、92% 滿意；教育外掛切 K-12；Circles 自報 ARPU 提升 22%）與 GPT-5.6 降價（Luna -80%）仍是這條線最具體的數字，其餘多是宣布層。
    next: 廣告測試看擴大速度、使用者反應，以及是否有獨立分析指出回答中立性受影響。企業案例（Virgin Atlantic、Zapier）看是否有後續可獨立查證的效益數字。Premium 席位看正式定價與採用率。Daybreak 資安服務看夥伴名單與審核標準是否公開。既有支線持續看：教育外掛的試點學區與採用數、Circles 那組留存與 ARPU 有沒有第三方或財報印證、GPT-5.6 降價後有沒有帶動用量或營收的可查訊號。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 這條線現在四則，樣貌分散。資本化動作端：Google 的 Genesis Mission 用 4,000 萬美元的 token 與額度（而非現金）綁科研，自評象徵大於實質，代表雲廠拿「算力額度」當投資工具；OpenAI 董事會補進 David Vélez 與 Robin Vince 兩名金融重量級人物，雙層結構下找金融背景董事，通常是替更大的融資或財務規模鋪路。這兩天新增兩則偏公司事務：OpenAI 公開反駁 Apple 的訴訟（單方說法、法院文件不在證據內），Anthropic 發一則以「Tino Cuellar」為題的消息、但內容證據不足待補。後兩則份量都輕。
    next: 看有沒有第二筆「算力當資本」的同類案例，判斷 Google 那招是模式還是個案；OpenAI 董事變動後有沒有大型融資、重組或財務揭露對得上；Apple 訴訟看 Apple 回應與法院動作；Tino Cuellar 那則等抓到內文再判斷是不是治理或人事訊號。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這條線把 agent 從「能對話」推向「能被部署、能被重用、能被治理」。部署端：OpenAI 用 Presence 把語音客服 agent 做成企業可部署平台；xAI 給 Grok 加 Build Mode 讓使用者自己搭；微軟研究院開源 Orchard，用同一套基礎設施訓練與評測跨任務 agent；OpenAI 的科學計算 field report 指出 coding agent 已在改寫科學工作者的日常工作方式。治理端：Open Secure AI Alliance（120+ 組織）趁 Black Hat 提出 SAFE 準則，要補上 agentic AI 的資安透明度，目前只是準則提案。基礎設施端新增一則：vLLM 釋出 v0.27.1 修補版，緊接在 v0.27.0（561 個 commit、支援 Kimi K3 全棧）之後，是開源推論引擎持續追新模型的例行維護動作。
    next: 部署端看 Orchard 有沒有微軟以外的採用（star、外部 PR、論文引用）、Presence 與 Build Mode 有沒有公開部署數或具名客戶、科學計算成效能不能複現而非只有敘事。治理端看 SAFE 準則會不會收斂成正式規範、主要雲廠與模型商是否採用。基礎設施端看 vLLM 對 Kimi K3 的支援實際效能如何、下一個 minor 版本是否有更大的架構變動。簽名的組織數不算數，照做的家數才算。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這條線新增兩則。一則是 NVIDIA 在 Into the Omniverse 系列談開放世界模型如何推進物理 AI，文中提到七月時有 200 多個組織聯署一封 AI 領導力公開信，但這篇本身是技術系列文，聯署信只是帶過，沒有進一步說明內容或跟進動作。另一則是 OpenAI 與美國心理學會（APA）合作，針對青少年心理健康議題制定 AI 使用的實證指引與防護機制，屬於治理與社會責任層面的跨界合作，不是技術或市場落地。這兩則接上原本的主軸：國家隊組——南韓總統李在明率企業界在 AI Summit 與 NVIDIA 及夥伴會談，挾三星、SK 海力士的 HBM 供應鏈談算力綁定；NVIDIA 加入美國 NSF 的州與區域 AI 基礎設施中心計畫，要把算力、資料與軟體推向更多地區的研究與教育；OpenAI 與美國能源部及國家實驗室合作用前沿模型加速科學。治理組——Open Secure AI Alliance 把開源 AI 資安拉成跨廠共同治理題，Anthropic 發表 open-weights 立場文，但主張只有標題、內容待補。
    next: Into the Omniverse 那篇看聯署信後續有沒有具體承諾或成果；APA 合作看實證指引是否發布、是否有第三方心理健康專業組織背書。南韓的 GPU 採購與半導體合作、OpenAI 與能源部的專案經費與成果、NSF 計畫實際撥給哪些中心與 NVIDIA 投入規模，多數仍停在宣示層。Open Secure AI Alliance 有沒有交出可稽核規範與非發起方成員。Anthropic 那則看全文實際主張與開放權重陣營或政策圈的回應。
    lenses: []
