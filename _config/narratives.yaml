# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述/口吻」，是全系統唯一准 LLM 動手處：由排程 Cowork 任務（非 0-LLM 自動抓取鏈）
# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-07-30'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: NVIDIA 還是主角，這輪多了兩條支線。硬體側 Vera Rubin 用每 token 成本、每瓦效能、每塊錢智慧輪流打，往外鋪到網通（Spectrum-6）、在地製造（緯創德州廠、Build in America）、實體與醫療（開源醫療物理模擬、海軍研究院的 DGX GB300、BMS 製藥 AI 工廠）。Vera CPU 加速 EDA、攜手 Cadence 與 Synopsys 設計下一代晶片，把算力往設計上游推，用自家算力造自家下一代算力。軟體端則是推論棧在降成本：vLLM v0.26.0（411 個 commit、新增 Inkling 家族與推測解碼），以及 Hugging Face 把 Nunchaku 4-bit 擴散推論接進 Diffusers。OpenAI 這邊 Project Camellia 在喬治亞州綁能源與社區承諾，屬搶地搶電那端。這兩天新的一則份量輕：NVIDIA 用 Jetson 談邊緣端「隨處建 AI」，但那是找 VC 站台的行銷貼文，沒帶新型號或出貨數字，只替邊緣 AI 敘事加溫。方向一致：供給端在替 agent 工作負載重新定價，戰線鋪到實體、產地與設計上游，連開源推論棧也一起壓成本。
    next: 硬體那批仍要第二個獨立來源（雲廠、對手晶片、實際部署者）印證「每 token 成本最低」。可追的硬事：緯創福和市廠的產能爬坡、BMS 的算力跑出什麼研發成果、開源醫療模擬有沒有外部團隊採用、Vera CPU 加速 EDA 有沒有公布具體加速倍數。邊緣那則看 Jetson 有沒有跟上新型號規格或出貨數字，否則就停在行銷。軟體這條可查實測：vLLM 新優化的 throughput 數字、Nunchaku 4-bit 的品質與速度取捨。NVIDIA 那批仍多為單一來源、標待證實。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這兩天最新的訊號往兩個方向補：效率與實體場景。OpenAI 一邊發 GPT-5.6，賣點從「更強」移到「更省」，主打每一塊錢買到更多智慧；一邊發文說靠兩個 API 設定就讓 GPT-5.6 的 ARC-AGI-3 分數翻三倍，等於自己提醒這類跑分對設定多敏感，看數字要先問是哪組設定跑的。機器人這條長出第二則：繼 Gemini Robotics 2 之後，Google DeepMind 再發 Gemini Robotics ER 2，聚焦推理、工具編排與多機器人協作，跟前幾天 NVIDIA Cosmos-H-Dreams 把生成式模擬推進手術機器人是同一個方向，模型能力開始往垂直的實體場景長。xAI 則發 Grok Voice Think Fast 2，走語音，但只有標題、規格待補。往前看，整線佈局那格仍是 Anthropic 一次翻新 Opus 5、Sonnet 5、Haiku 4.5，其中 Opus 5 是這批唯一多來源、信心滿分的一則；Google 延續 Gemini Flash 的輕量分化。小而專、開放那格續在：LiquidAI 的 LFM2.5-Encoders 主打在 CPU 上跑長脈絡，Ai2 的 OlmoEarth 把開放路線延伸到行星尺度的地理空間推論。安全與研究兩條旁支也還在：Anthropic 用 Economic Index Connector 與研究基金議程把 AI 對經濟的影響做成研究資產，OpenAI 一面公布長時程模型的失效教訓，一面和 Hugging Face 揭露評測期間模型展現進階攻擊能力的資安事件。主軸仍是整線佈局加安全治理，加上小型、專用、開放各自找縫，外加這輪冒出的效率與實體場景兩個新切面。
    next: GPT-5.6 看定價與 token 成本，對比前代與對手，才知道「per dollar」是行銷還是實質；ARC-AGI-3 那個三倍，看有沒有第三方用同組設定複現。機器人這條看 Gemini Robotics ER 2 與 Cosmos-H-Dreams 有沒有第三方或客戶實測，多機協作實際能同步幾台、擬真度有沒有量化數字。Opus 5、Sonnet 5 等第三方 benchmark 與定價，看主版號跳升是真跳代還是命名策略。小型那批可查實測：LFM2.5-Encoders 的 CPU 延遲與吞吐、OlmoEarth 是否開放權重與資料集。安全那條看 OpenAI 有沒有把 safeguard 寫進 model card、資安事件有沒有完整的 post-mortem。多數事件仍是單一來源、標待證實。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這條線的共同動作，還是把 AI 能力塞進大家本來就在用的產品入口，而不是發表新模型。這批最新一則有份量的是渠道再擴：OpenAI 開放 10 萬名學術研究者免費用 ChatGPT 最先進模型，用的是既有模型，重點在把旗艦模型定向送進學術場景換使用量。入口分幾類：辦公套件（xAI 把 Grok 接進 Outlook、Excel、Google Workspace）、企業工作流（OpenAI 用 Codex 幫 NTT DATA 把事故分析壓到 30 分鐘、覆蓋 9,000 人，另推小企業 ChatGPT 計畫）、創作與垂直場景（Google DeepMind 的 Lyria 3.5 掛進 Flow Music、Gemini 3.5 Flash Cyber 專攻找修漏洞、ChatGPT 串接病歷做健康功能），以及跨出職務邊界的用法研究與 Cognizant 合作這類企業案例。同一段時間，OpenAI 財務長丟出一套計分卡，把衡量標準從模型跑分改成「每次成功任務的成本」，替這波能力落地給了一把商業尺。另外標一句雜訊：NVIDIA GeForce NOW 的返校季內容這幾天也被抓進來，但那是消費級雲端遊戲行銷，跟這條產品線的 AI 落地主軸沒關係。
    next: 接下來看幾個可驗證的訊號。第一，這些外掛、整合與免費開放有沒有走到採用數字，而不是停在發表：xAI 的 Office、Workspace 外掛，OpenAI 的小企業計畫與 10 萬研究者免費方案，真正有多少人用、用的是哪個模型版本。第二，企業案例複製得起來嗎，NTT DATA 那條「30 分鐘、9,000 人」的數字，別家跟不跟得上。第三，OpenAI 那把「每次成功任務成本」的尺，會不會被別家拿去對外報數字，一旦大家開始這樣講 ROI，代表這波從秀能力轉向算帳。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 兩則。Google 的 Genesis Mission 用 4,000 萬美元的 token 與額度（而非現金）綁科研，摘要自評象徵大於實質，代表雲廠開始拿「算力額度」當投資工具。另一則是 OpenAI 董事會補進兩名金融重量級人物 David Vélez 與 Robin Vince，在雙層（Foundation 加 PBC）結構下找金融背景董事，通常是為更大的融資或財務規模鋪路。兩則分別指向「算力當資本」與「治理為資本化鋪路」，方向不同，但都是公司資本化的動作。
    next: 看有沒有第二筆「算力當資本」的同類案例，判斷 Google 那招是模式還是個案；OpenAI 這邊看董事變動後，有沒有大型融資、重組或財務揭露對得上。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這條線從一則長到三則，開始撐得起一點形狀。OpenAI Presence 是企業級 agent 平台，主打可部署的語音與聊天客服 agent，是 OpenAI 從賣 API 往上做打包產品的動作。這兩天再進兩則：xAI 給 Grok 加了 Build Mode，名稱指向「用自然語言直接生出可運行的東西」，落在 Artifacts、canvas 那一格；OpenAI 另發一份 field report，講科學家用 coding agent 改造老舊的科學計算軟體、在基因體學等領域加速。三則指向同一件事：agent 從對話往「交付可運行成果」移動，戰場從客服延到程式建構與科研軟體。但三則都單一來源，Build Mode 與 field report 都只有標題或自家敘事，還撐不起強判斷。
    next: 看 Presence 的定價與首批客戶，判斷它是真平台還是 API 的包裝。Grok Build Mode 看實際 demo 與可用範圍、是否綁 X 分發。OpenAI 的科研 field report 看有沒有具名團隊、可重現成果，或第三方採用數據。這條線要再多幾家把 agent 做成可交付產品的對應訊號，判斷才談得上收斂。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這條線現在四則，兩種樣貌。國家隊那組：南韓總統李在明率企業界在 AI Summit 與 NVIDIA 及夥伴會談，挾三星、SK 海力士的 HBM 供應鏈籌碼談算力綁定；OpenAI 則宣布與美國能源部及國家實驗室合作，用前沿模型加速科學。治理那組：產業多方組成 Open Secure AI Alliance，把開源 AI 的資安拉成跨廠共同治理題；這兩天再加一則，Anthropic 發表對 open-weights 模型的官方立場文，一家走封閉權重路線的公司出面談開放權重，本身就是訊號，但文章具體主張只有標題、內容待補。四則指向同一件事：AI 的算力、科研與開放安全，正變成國家級與產業級的戰略與政策議題，政府、企業、聯盟互相綁定。
    next: 多數仍停在宣示層，要看有沒有具體落地：南韓的 GPU 採購、資料中心或半導體合作，OpenAI 與能源部的專案、經費與成果，Open Secure AI Alliance 有沒有交出可稽核的規範與非發起方成員。Anthropic 那則看全文實際主張、以及是否引來開放權重陣營（Meta、Mistral 等）或政策圈回應。事件數仍少，這條線的判斷先當暫定。
    lenses: []
