# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-10-13'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 這一輪新增 10-13 的 NVIDIA 部落格〈All Systems Go〉。NVIDIA 稱 RTX Spark 最高 128GB 統一記憶體、1 petaflop 的 AI 算力，各家 PC 應用軟體已完成更新。這些是廠商自述，沒有第三方實測，應用名單與出貨日期摘要沒有列。它接續 10-07 黃仁勳與納德拉說明的 Windows PC 本機執行 AI agent。同一天 Liquid AI 的 LFM2.5-24B-A2B 也主打裝置端 agent，方向一致，但兩者之間沒有證據顯示有針對性的最佳化。10-12 的 Vera Rubin 開放架構、10-08 LegalOn 的 Codex 成本降 65%、10-09 Ai2 的 GPU 排程文章與 10-05 vLLM v0.31.0，細節與前一輪相同，仍是單一來源或缺對照數字。
    next: 看搭載 RTX Spark 的筆電上市日期與定價，以及第三方實測的本地模型推論速度；看 Surface Laptop Ultra 的出貨日期與售價，以及其他 OEM 是否推出 RTX Spark 機種；看 OCP 或 NVIDIA 有沒有釋出 Vera Rubin 的開放規格文件；看其他 Codex 客戶有沒有公布類似的成本數字與 65% 的比較基準；看 Ai2 那篇有沒有給叢集利用率的前後數字；看 vLLM 或社群公布 DeepSeek-V4.1-Flash 的吞吐與延遲對照；看 DGX Spark 64GB 版的定價與開賣日。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這一輪新增兩則，都在 10-13。Google DeepMind 發布 Gemini 4 Argon，標題主打處理困難問題，官方文章依授權我們只收標題與連結，能力與價格請讀原文。Liquid AI 在 Hugging Face 發表 LFM2.5-24B-A2B，主打在裝置上跑私密 agent，型號命名看起來是總參數約 24B、啟用約 2B，但這是依命名推測，證據只有一句話，沒有基準、速度或授權。10-07 的 Falcon ASR、Liquid AI d1、NVIDIA Nemotron 在 IOI 與 IMO 達金牌等級，以及 10-06 的 OpenAI 數學進展與 EmbeddingGemma 2，仍只有標題與一兩行說明，規格與評測都沒有。09-29 的 GPT-6.1 Sol 是廠商自述的比較，沒有獨立評測數字。
    next: 看 LFM2.5-24B-A2B 的模型卡有沒有列基準、授權條款與裝置上的每秒 token 數；看 Gemini 4 Argon 原文公布的基準與開放日期，以及第三方評測；看 Falcon ASR 的授權與字詞錯誤率；看 NVIDIA Nemotron 文章公布的 IOI、IMO 分數與評測方式；看 d1 的參數量、授權與邊緣硬體延遲；看 openai/math 預印本實際列了哪些結果；看 EmbeddingGemma 2 的權重釋出平台與多模態檢索基準；看 GPT-6.1 Sol 的獨立實測與價格。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這一輪新增 10-13 的 Higgsfield 案例。OpenAI 稱 Higgsfield 用 GPT-6 Astra 把 AI 影片從 1 分鐘拉到 10 分鐘以上，並搭配 GPT-Image-2.5 與 GPT-Live 做語音拍片。長度數字出自標題，畫質、成本與成功率都沒有，是廠商案例不是產品公告。10-09 的 Sophos 案例延續上一輪：OpenAI 稱威脅調查時間縮短 96%、MDR 案件 52% 自動化，96% 的比較基準沒有交代，52% 是案件比例而不是時間。10-08 的 Anthropic 2026 使用政策更新依授權只收標題與連結，政策改了什麼請讀原文；Pollo AI 案例沒有用量或成效數字。10-07 的 ChatGPT for Teens、Radisson 外掛與 10-06 的 Atlassian 擴大合作，仍是廠商自述。
    next: 看 Higgsfield 是否公開長片樣本與定價，以及其他影片平台是否接入同一組模型；看 Sophos 或第三方是否公布自動化案件的誤判率與複查比例；看 2026 使用政策更新原文公布的生效日期與條款差異；看 Pollo AI 是否公布用戶數或廣告成效；看 Radisson 外掛的預訂占比；看 Atlassian 整合的具體功能、可用方案與上線日期；看 Cyber Verification Program 的參與資格與申請方式。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 這一輪新增 10-13 的 NVIDIA 部落格，宣布對法國新創的新投資。文中說法國企業已把 agentic computing 用在太空、金融服務、公共部門與科學研究，並以 AI Action Summit 為例說明事前的布局。投資金額與被投資名單，摘要裡沒有給，目前只有 NVIDIA 單一來源。這是這條線少見的實際投資類訊號。其餘延續上一輪：10-08 Anthropic 的 Genesis Mission Commitment 與 Cyber Mission 依授權只收標題與連結，我們無從判斷是否涉及資金；OpenAI 的歐盟文字來源標示一篇同樣只收標題與連結；09-30 的 NVIDIA 研究生獎學金最高 6 萬美元與 09-28 OpenAI 對 Lenfest 計畫出資 500 萬美元，仍是最近的資金類訊號。
    next: 看 NVIDIA 或被投資新創是否公布投資金額與名單，以及這些公司是否公開採用 NVIDIA 的 agent 相關軟體；讀 Genesis Mission Commitment 原文，確認承諾項目、時程與是否涉及資金；讀 Anthropic Cyber Mission 原文，確認它是新團隊、新產品還是對外承諾；讀 OpenAI 歐盟文字來源標示原文，確認規則與時程；看 Lenfest 計畫的參與機構與資金分配。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增兩則，證據都很薄。10-08 Hugging Face 發表〈The model that didn't exist, so you made it yourself〉，網址帶 building-with-ml-intern，摘要只有該站的通用介紹，ML intern 是什麼看不出來。同日 NVIDIA 的 Omniverse 系列文說開發者把前沿 AI 模型接上 Omniverse 函式庫來組裝資產、串接物理與渲染，摘要在句中截斷，沒有數字與具名客戶。Oracle 的客戶案例仍只有標題「數天縮到數分鐘」，來源沒給量測方式。10-07 微軟研究院的 Agent Lightning v1.0 約 3,500 行，把既有 agent 接上強化學習訓練，效果數據來源沒提供。10-06 OpenAI 與 Ironclad 在合約工作流程上訓練並評測 computer use agent，任務設計與成績都沒有。10-02 ServiceNow-AI 的 AutoSynthData 只確定在處理企業場景缺訓練資料的問題。09-29 OpenAI 的 Dots 只有標題與連結。09-28 的 Holo4 是 H company 的通用電腦操作 agent，單一來源。
    next: 看 Hugging Face 那篇有沒有公開 ML intern 的程式碼或模型連結；看 NVIDIA 是否公布具名客戶或開發時間對比；看 Oracle 或第三方有沒有公開工時節省的量測方式；看 Agent Lightning 的程式碼與接入範例，以及微軟以外的團隊有沒有跑出訓練結果；看 OpenAI 是否公布 Ironclad 合約任務的評測結果；看 AutoSynthData 有沒有同步釋出資料集或基準測試；看 Dots 是否有官方文件公布功能與限制；看 Holo4 有沒有第三方的電腦操作評測。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增一則：OpenAI 發文說它瓦解了兩個利用假記者與一個智庫當門面的 AI 影響力行動，用來散布地緣政治訊息。來源摘要只有這一句，行動來自哪裡、規模多大、封鎖多少帳號都沒有交代，歸屬與成效都是 OpenAI 單方的說法。先前的觀察仍在：阿布達比的 Technology Innovation Institute 在 Hugging Face 發表 Falcon-Emirati，標題把方言、文化與語氣細微差異列為目標，模型規格與評測沒有。Sam Altman 09-23 在聯合國安全理事會的談話偏原則性表態，沒有具體承諾；Daybreak 開放給烏克蘭政府與 Grab 東南亞技能培訓也還沒有成效數字。
    next: 看有沒有獨立研究機構或其他平台公開同一批假身分的分析，能對照 OpenAI 的說法；看 Falcon-Emirati 的權重是否釋出、授權條款，以及有沒有在阿拉伯語方言基準上的公開評測；觀察後續是否有具體政策文件、多邊協議或聯合國層級的 AI 治理提案跟進；沿用上一輪對烏克蘭 Daybreak 成效與 Grab 完訓人數的觀察。
    lenses: []
