# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述/口吻」，是全系統唯一准 LLM 動手處：由排程 Cowork 任務（非 0-LLM 自動抓取鏈）
# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-09-18'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 這一輪新增四則，全部來自 NVIDIA，兩天內連成一條線。9/15 先是電網需量反應示範（Silicon Valley Power 對一座 AI 工廠發出調整用電訊號，Emerald AI 團隊在場觀看）與副總裁 Ian Buck 在 AI Infra Summit 上談 Vera Rubin／DSX 平台的每瓦 token 效率；9/16 這則示範升級成正式聯盟——Emerald AI、Google、NVIDIA 三方宣布成立 AI Energy Management Alliance（AEMA），部落格原文明白把聯盟接續在前一天的示範案例之後；同一天 Vera Rubin NVL72 在 MLPerf Inference v6.1 首度亮相就拿下領先成績。四則合起來，NVIDIA 這週把「把每一塊錢算力壓低」的主軸，具體拆成電網協調與效能基準兩條腿走路，跟先前機器人、邊緣、實體模擬的延伸方向並列。
    next: 觀察 AEMA 是否公布具體成員擴張或量化的用電協調目標，以及 MLPerf Inference v6.1 完整榜單與其他廠商的對比成績；同時持續追蹤 HF 非同步訓練做法、OpenAI Habitat 儲存架構、d-Matrix／Skild AI／robotaxi 生態系後續案例是否兌現。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這一輪新增兩則，都不是模型發布本身。OpenAI 9/16 公開一套處理模型失準的通報框架，說明如何追蹤、調查、揭露非預期或令人擔憂的模型行為，並隨框架公開六份案例報告；隔天 Anthropic 發布「生命科學驗證計畫」，內容因授權限制我們只留標題與連結，無法判斷具體驗證機制。兩則談的都是治理與信任機制，不是模型能力本身的迭代，跟既有「小而專、成本導向」主軸關聯不大；主軸判斷維持不變。
    next: 觀察 OpenAI 那套失準通報框架是否在後續事故中被實際引用、外界有沒有跟進查證六份案例報告；Anthropic 生命科學驗證計畫則要查原文才知道具體驗證的是什麼。「小而專」模型迭代這條主軸，要看下一輪有沒有新的模型發布訊號進來。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這一輪新增五則。OpenAI 三則圍繞企業與垂直產業推進：ChatGPT Work／Codex 新增用量分析功能，讓企業掌握 AI 支出與訓練缺口；同時發布「Astra for Law」，把前沿模型能力、客製化律所工作流程與法律級控管包成一套產品；並公布法律事務所 Cooley 用 ChatGPT Work 打造 IPO 準備工具 GO Public 的案例。NVIDIA 這邊是 GeForce NOW 的例行雲端遊戲週更公告（新遊戲《Aniimo》上線），屬於消費娛樂範疇，跟 AI 產品化主軸關聯不大。xAI 發布「Grok Voice Transcribe 2.0」，站方與授權雙重限制下我們只留標題與連結，無法評估實際改動。五則沒有改變上一輪 Google DeepMind 能力接產品入口的格局；比較值得注意的是 OpenAI 這週把法律與資本市場（IPO）這類高風險專業服務場域推得更深，跟同期公開的模型失準通報框架擺在一起看，形成一個「先立安全治理敘事、再往高風險場景擴張」的觀察角度。
    next: 留意 Astra for Law 與 GO Public 上線後是否有具名客戶公開採用成效，以及是否有第三方對其「法律級控管」做安全或合規審視；持續觀察 Anthropic 顧問夥伴公告與 Google DeepMind 產品化案例的後續採用情況。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 這條線上一輪已經涵蓋 Genesis Mission、500 億美元基礎設施投資、微軟／NVIDIA 三方合作、收購 Bun 與 Claude Code 十億美元里程碑等大額資本訊號，這一輪新增五則，規模更直接觸及公司估值本身：Anthropic 完成新一輪 Series F 募資，投後估值來到 1,830 億美元，同一批公告裡還有 Rahul Patil 加入公司、企業業務的 Managing Director 人事任命 Chris Ciauri（完整職稱在我們手上的紀錄裡被截斷）、消費者服務條款更新、以及未支援地區銷售限制的調整，五則全部只留標題與連結，無法從標題本身判斷 Series F 相對上一輪的漲幅、也看不出兩位人事任命各自對應的組織調整規模。把募資與人事擴編放在同一天發布，跟上一輪 500 億美元基礎設施投資、Genesis Mission 加入的節奏連在一起看，這條線目前呈現的是資本到位（估值墊高）與組織擴編（人事、企業業務布局）同步發生的模式。
    next: 留意 Series F 的投資人名單是否揭露、這輪估值與 OpenAI 等競爭對手最新估值的相對位置；也留意《Confidential Draft S1 SEC》這則先前提到的疑似機密 IPO 申報，原文內容是否進一步被證實或澄清。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這條線上一輪的訊號集中在 agent 工具鏈的治理與整合層（MCP 捐贈基金會、Claude Agent SDK 進駐 Xcode、Gradio 重建 AUTOMATIC1111），這一輪新增兩則，把主軸往「agent 本身怎麼被產品化與驗證」推進一步。OpenAI 推出 Agents API，把 Codex harness 包裝成受管服務，開發者能直接呼叫編排、長時間執行的 session 與工具呼叫能力，不必自己搭底層基礎設施；同一批發布裡，OpenAI 也發表案例文章，說明 Cognition 如何用新模型 GPT-6 Astra，讓編碼 agent Devin 具備自我測試能力，能自行驗證程式碼可行，藉此壓低工程師人工審查的份量。這兩則都有完整內容可查，跟先前那三則只留標題的公告形成對比——這條線目前呈現的是「治理層只給標題、能力與產品層給得出細節」的落差。
    next: 留意 Agents API 的定價與計費模式公布後，是否進一步壓低中小型開發者建置 agent 的門檻；也留意 Devin 的自我測試通過率或誤判率是否有第三方或使用者端的具體數字佐證，那會比案例文章本身更能驗證這項能力的實際可靠度。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增一則：曼徹斯特大學採用 NVIDIA Earth-2 預測英國各地空氣污染，NVIDIA 部落格以英國去年約 3 萬人死於空氣污染的公衛數字帶出這個案例，但沒有給出這套模型的準確度或與傳統化學模型的對比數字。這則跟上一輪 Anthropic 密集的區域據點與政策布局性質不同，是單一學術／公衛應用案例，不改變「業者同時在據點、信任建設、政策論述三條戰線加速布局」的主軸判斷。
    next: 觀察曼徹斯特大學這套模型是否有論文發表，或跟官方監測數據的對比結果；同時留意上一輪那批只留標題的政策與安全公告是否有第三方回應。
    lenses: []
