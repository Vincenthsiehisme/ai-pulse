# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述/口吻」，是全系統唯一准 LLM 動手處：由排程 Cowork 任務（非 0-LLM 自動抓取鏈）
# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-10-20'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 這一輪新增 10-20 的三則 Hugging Face 文章，AnyLanguageModel 1.0（Apple 平台本地模型）、PyTorch 2.15 的 MPS 後端、TorchTPU（TPU 上原生跑 PyTorch），三則都只有標題與通用站點描述，沒有支援範圍或效能數字。10-19 Anthropic 對擴散規則的立場文，依授權只收標題與連結，具體主張不明。10-19 的 Hugging Face TorchNeuron 讓 HF 模型更容易跑在 AWS Trainium，只有標題與一句簡介，沒有模型清單或成本。10-18 的 vLLM v0.32.0 有 814 個 commit、363 位貢獻者，新增 /v1/systemone 端點，摘要沒有效能數字。10-17 的 RTX Spark 筆電起價 2,399 美元、最高 128GB 統一記憶體，全是廠商自述。10-15 的北歐與歐洲科學界兩則 NVIDIA 文章、10-14 的歐洲市政 agent、10-13 的〈All Systems Go〉、10-12 的 Vera Rubin 開放架構、10-09 Ai2 的 GPU 排程文章，仍缺金額、名單或前後數字。
    next: 看 AnyLanguageModel、MPS 與 TorchTPU 三則是否附支援的後端、算子覆蓋與效能數據；看 Anthropic 擴散規則立場文列了哪些具體修改建議；看 HF 或 AWS 是否公布 TorchNeuron 支援的模型清單與相對 GPU 的效能與成本，社群是否有第三方實測；看 RTX Spark 筆電的獨立評測，尤其是本機大模型推論速度與 128GB 機種實際售價；看 vLLM v0.32.0 完整 release notes 與 /v1/systemone 文件；看歐洲科學界取用計畫的算力配額與首批機構；看北歐文章是否列各國專案與金額；看市政 agent 文章是否點名城市與合約；看 Vera Rubin 開放規格文件是否釋出；看 Ai2 那篇有沒有叢集利用率的前後數字。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這一輪新增 10-19 的兩則 Anthropic 與 10-15 的三則，全是新聞頁的標題與連結，依授權沒有內文：Responsible Scaling Policy v3、Building Safeguards For Claude、100k Context Windows、前沿威脅紅隊測試，其中 RSP v3 與前一版差在哪，我們比對不了。另有 10-20 的 Ai2 FairStress，標題稱是更深入的 LLM 決策公平性評測，與 NVIDIA 的 Cosmos3-H-Dreams 手術場景生成式模擬，兩則都只有署名摘要，沒有分數或規格。更早的 NVIDIA 印度語系資料、Beam 501B、Granite Switch 4.1、Nemotron 3.5 Super VL 與邊緣模型、Apertus 1.5、Muse Spark Open、FLUX.3 Image Klein、DeepMind 抗菌肽、Ai2 HiRO-ACEv2、Gemini 4 Argon、LFM2.5-24B-A2B 與 GPT-6.1 Sol，仍停在標題與一兩行說明，沒有獨立評測數字。
    next: 讀 RSP v3 原文，與 v2 比對能力門檻與防護等級有沒有變；看 FairStress 是否公開評測集與各模型結果；看 Cosmos3-H-Dreams 的權重、授權與臨床驗證說明；看 Beam 的權重是否真的可下載與授權寬不寬；看 NVIDIA 印度語系資料集有沒有附連結與授權；看 Granite Switch 4.1 內文有沒有列模型大小與評測；看 Nemotron 3.5 Super VL 與 Bolt 的第三方基準；看 Apertus 1.5、Muse Spark Open 與 FLUX.3 Image Klein 原文有沒有列參數量、授權與基準；看 Gemini 4 Argon 公布的基準與開放日期；看 LFM2.5-24B-A2B 模型卡的基準與每秒 token 數；看 GPT-6.1 Sol 的獨立實測與價格。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這一輪新增 10-20 的 OpenAI 加盟主案例：一位 Schlotzsky's 與 Cinnabon 加盟主用 ChatGPT Work 縮短對帳與調價時間，數字出自 OpenAI 自己發的客戶案例，只有一個樣本。10-19 的 Anthropic Claude Gov 模型針對美國國家安全客戶，依授權只收標題與連結，部署範圍不明。10-19 NVIDIA 柏林媒體活動，歐洲廣播聯盟與 NVIDIA 合作擴充主權 AI，只有開頭摘要，沒有範圍與時程。10-16 的 Itaú 案例，ia.i 對話介面與 IARA 治理平台，沒有用戶數與成效。前一輪 10-15 的 Rosalind 學術方案、Sullivan & Cromwell 的 Agreement Analyzer、Anthropic 政府三分支使用範圍、Block 與 SentinelOne 資安案例、NVIDIA RTX Spark 預告與 GeForce NOW 的 DLSS 4.5、xAI Grok Voice 3，仍多為官方自述或只有標題與連結，沒有第三方數字。
    next: 看 OpenAI 是否發出更多不同規模客戶的量化案例，單一加盟主不能代表一般企業；看 Claude Gov 原文有沒有列客戶範圍、部署環境與使用限制；看 EBU 或 Adobe、Bertelsmann、UFA 是否另行發布合作內容；看 Itaú 或監理端是否公布 ia.i 的使用者數、處理量與申訴率；看 Anthropic 政府公告原文有沒有列具體機關與採購管道；看 Rosalind 方案公布的資格條件與首批實驗室；看 Sullivan & Cromwell 是否公布 Agreement Analyzer 的使用範圍或錯誤率；看 Block、SentinelOne 或第三方是否公布樣本數、準確率與測量方式；看 Grok Voice 3 原文有沒有延遲、語言與開放對象；看 RTX Spark 的規格、價格與出貨時程。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 這一輪新增 10-20 的 OpenAI 收購 Orchestra Bio，目標是把 AI 營運能力帶進生命科學研發，摘要沒有收購金額、交割時程與整合安排，單一來源。先前 10-18 的 Anthropic〈Public Benefit Fund〉與 10-14 的新加坡辦公室，依授權只收標題與連結，基金規模、用途與辦公室人數都不明。10-13 NVIDIA 對法國新創的新投資，金額與名單沒有給，只有 NVIDIA 單一來源。10-08 Anthropic 的 Genesis Mission Commitment 與 Cyber Mission 也只收標題與連結。09-30 的 NVIDIA 研究生獎學金最高 6 萬美元與 09-28 OpenAI 對 Lenfest 計畫出資 500 萬美元，仍是最近有金額的資金類訊號。
    next: 看 OpenAI 與 Orchestra Bio 是否公布交易條件，以及 Orchestra Bio 的產品會不會併入 OpenAI 的產品線；讀 Public Benefit Fund 原文，確認基金規模、出資方式與受益對象；看新加坡辦公室原文有沒有給人數與合作對象；看 NVIDIA 或被投資新創是否公布法國投資的金額與名單；讀 Genesis Mission Commitment 與 Cyber Mission 原文，確認承諾項目與是否涉及資金；看 Lenfest 計畫的參與機構與資金分配。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增兩則，都出自 OpenAI 10-16 的客戶案例，數字都是廠商自述。Stack Overflow for Agents 說兩位工程師用 Codex 幾週內做完，ChatGPT 外掛帶動代理建立數最高成長 10 倍，摘要沒有基期與統計區間。Benefit Street Partners 的 Anant Kumar 自己做放款估值比較與信貸合約分析工具，用 Codex 做程式碼審查，標題稱回答更快，沒有量化。再往前，10-14 的 Third Moment Research 標題給的是規模：10,000 個 agent 連跑 36 小時以上，沒有任務類型、完成率或成本。Amp 主張 agent 用到程式碼以外的工作，沒寫實際任務。10-08 Hugging Face 的 ML intern 文章只有通用介紹，Oracle 案例只有「數天縮到數分鐘」的標題，10-07 微軟研究院的 Agent Lightning v1.0 沒有效果數據，10-06 OpenAI 與 Ironclad 的合約 agent 沒有成績。
    next: 看 Stack Overflow 或第三方是否公布代理建立數與註冊數的絕對值和期間；看 Benefit Street Partners 是否把工具擴到其他團隊並公布節省的時間；看 OpenAI 或 Third Moment Research 是否公開任務完成率、單位成本，或第三方複現；看 Amp 是否公布非程式碼任務的類型與使用量；看 Hugging Face 那篇有沒有公開 ML intern 的程式碼或模型連結；看 Oracle 或第三方有沒有公開工時節省的量測方式；看 Agent Lightning 的程式碼與接入範例，以及微軟以外的團隊有沒有跑出訓練結果；看 OpenAI 是否公布 Ironclad 合約任務的評測結果；看 Holo4 有沒有第三方的電腦操作評測。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增 10-20 的巴塞隆納超算中心 AI Factory 新創計畫，從試辦轉為全面運作，提供新創主權運算、技術支援與培訓，出自 NVIDIA 自家部落格，只有摘要，沒有參與新創名單或運算配額。10-19 Anthropic 的選舉相關風險測試與緩解，依授權只收標題與連結，結果不明。10-19 的德國工業 AI 對談，NVIDIA 官方部落格記述梅爾茲與黃仁勳在柏林討論德國 AI 路線，焦點是工業應用，沒有投資金額或政策措施。10-14 的 DeepMind 與新加坡 GovTech 合作，用裝置端 Gemma 小模型攔截聊天詐騙，偵測率與誤報率沒公布。10-14 的 OpenAI 歐盟 agentic AI 採用分析是 OpenAI 自己的分析，沒有採用率。先前的觀察仍在：OpenAI 瓦解兩個假身分影響力行動、TII 的 Falcon-Emirati、Altman 在聯合國安理會的談話、Daybreak 開放給烏克蘭與 Grab 東南亞技能培訓，都還沒有成效數字。
    next: 看 BSC 是否公布參與新創數量與運算配額；看 Anthropic 選舉風險原文是否公開測試方法與緩解規則；看德國政府或 NVIDIA 是否公布工業 AI 的算力部署、資金規模或合作企業名單，以及德媒的獨立報導；看 DeepMind 與 GovTech 是否公布偵測率、誤報率與部署範圍；看 OpenAI 歐盟分析完整版有沒有公布方法、樣本與採用率；看有沒有獨立機構公開同一批假身分的分析，對照 OpenAI 的說法；看 Falcon-Emirati 的權重、授權與阿拉伯語方言的公開評測；看後續是否有具體政策文件或多邊協議跟進；沿用對烏克蘭 Daybreak 成效與 Grab 完訓人數的觀察。
    lenses: []
