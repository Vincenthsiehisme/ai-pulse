# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述/口吻」，是全系統唯一准 LLM 動手處：由排程 Cowork 任務（非 0-LLM 自動抓取鏈）
# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-09-24'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 這一輪新增五則，把上一輪把每一塊錢算力壓低、並從資料中心往機器人、邊緣延伸的主軸再往外擴一圈。NVIDIA 09-21 連發兩則：DSX Ready 認證計畫替 AI 工廠篩選相容的電力與散熱產品，以及主張物理 AI（自駕車、工業機器人）大規模部署必須在每一層做好安全；vLLM 09-22 發布 v0.30.0，重點是接住 DeepSeek-V4.1-Flash 並把 KV cache 改用 MXFP8 儲存；NVIDIA 09-23 再發一篇 Warp／MjWarp 教學，示範加速機器人模擬訓練；同一天 Google DeepMind 則是唯一非 NVIDIA、vLLM 的訊號，替 Private AI Compute 加入伺服器端安全記憶體。五則合起來，NVIDIA 這一輪的重心從電網協調、效能基準延伸到供應鏈認證、物理 AI 安全、機器人模擬加速，持續往資料中心以外的場景擴張；vLLM 則是這條線少見的非 NVIDIA 訊號，顯示開源推論引擎生態仍在獨立跟進模型廠商的發布節奏。
    next: 觀察 DSX Ready 計畫公布的合作廠商規模、vLLM v0.30.0 的 MXFP8 KV cache 在實際部署的精度表現，以及 Google DeepMind Private AI Compute 伺服器端記憶體的技術細節是否公開；同時持續追蹤 AEMA 成員擴張與 MLPerf Inference v6.1 完整榜單。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這一輪新增四則，同樣不是模型發布本身，延續上一輪的走向。Anthropic 09-23 宣布 Claude 協助發現新型酵素系統，但正文因授權政策我們只留標題與連結，無法判斷這是通過驗證的發現還是待驗證的計算假說。同一批裡，OpenAI 09-21 成立獨立數學顧問小組、09-22 發布第三方安全評估的原則性主張，兩則都在談怎麼查核 AI 產出的可信度，而不是新增了什麼能力。唯一偏工程面的是 Hugging Face 09-22 讓 Transformers 函式庫能直接執行 llama.cpp 的量化格式，屬於工具鏈整合，同樣不是模型能力的躍升。連續兩輪，這條主線收到的訊號都在講信任機制而非模型變強，跟「小而專、成本導向」的既有主軸關聯持續薄弱。
    next: 觀察 Anthropic 的酵素發現是否有同行評審論文或第三方媒體報導佐證；OpenAI 的數學顧問小組是否公開成員與審核案例；第三方安全評估原則是否真的有機構依循並發布報告。若接下來幾輪都是這類治理與信任機制的訊號，可能要考慮這條主線的既有主軸描述需要更新，而不只是無新模型發布可歸類。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這一輪新增六則，其中兩則延續用真實客戶案例證明模型能落地賺錢的既有套路，而且集中在同一款模型上：Parallel（09-22）用 GPT-6 Astra 把 agent 研究勞動市場數據的時間與成本都砍半，隔天 invideo（09-23）用同一款模型把調色效率提三倍、一天內產出 50 種客製特效，兩者跟前一輪的 Hex、Astra for Law、GO Public 案例合起來，GPT-6 Astra 上市以來的客戶案例已經連續好幾週幾乎每週端出一則。同一批裡還有 OpenAI 客戶案例 V7（09-21，用 GPT-5.6 而非 Astra，給 agent 制度性記憶）、Ringg（09-23，客服 agent 解決率與成本數字）；NVIDIA 則發了一篇氣候週潔淨能源案例集（09-21）；xAI 發布 Grok Bot 客服公告（09-22）但正文因站方政策 withheld，內容不明。整體上這條線這一輪的重心更明確地落在拿數字說話的客戶案例，而且案例密度集中在 OpenAI 一家，Google DeepMind 上一輪能力接產品入口的定位持續沒有新訊號補上。
    next: 觀察是否有獨立第三方驗證這些倍數效率數字（Parallel 減半、invideo 三倍、Ringg 65% 解決率），或這些數字始終只停留在廠商自己測算的案例稿層級；同時留意 Grok Bot 客服功能的具體內容是否有其他管道可查證，以及 Google DeepMind 是否有新的能力接產品訊號補上目前的空缺。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 這一輪新增兩則，規模跟上一輪的 Series F 募資、大額基礎設施投資完全不同量級。NVIDIA 09-23 刊出一篇驗證工程師 Sakeena Fiza 的人物專訪，性質是雇主品牌與企業文化內容；Hugging Face 09-22 則是 oMLX 創建者暨維護者 Jun Kim 加入公司、支援 MLX 社群，延續 Hugging Face 近幾個月持續延攬各開源框架關鍵維護者的模式。兩則都屬於人事與組織經營層級的小訊號，跟上一輪資本到位（估值墊高）與組織擴編同步發生的觀察比起來，這一輪沒有新的資本規模訊號進來，只有零星的人事動態。
    next: 留意是否有新的估值、募資或併購訊號進來，補上這一輪缺席的資本規模動態；同時觀察 Hugging Face 收攏開源框架維護者的模式是否有具體整合成果，例如 oMLX／MLX 工具鏈是否被收進 Transformers 或 Hub。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增兩則，都來自 NVIDIA，把主軸從「agent 怎麼被產品化」延伸到「agent 疊層本身要怎麼蓋」。NVIDIA 09-21 發文主張 AI 安全該當工程問題處理，要有明確的安全需求、可執行的管控機制、指定負責人與可驗證的防護證據，鎖定的正是 agent stack 這整條疊層；隔天 09-22 發布 Isaac ROS 5.0，一套建構在開放機器人框架 ROS 之上的 GPU 加速套件，把「agentic」這個詞從純軟體 agent 延伸套用到機器人身上。兩則合起來看，這條線除了先前 OpenAI／Cognition 那組把 agent 包裝成受管服務、讓 agent 自我測試的產品化路線之外，現在多了 NVIDIA 這組 agent 疊層的安全框架與硬體加速工具的基礎建設路線，兩條路線目前分頭並進，尚未看到交會的訊號。
    next: 觀察 NVIDIA 這套安全需求、管控、負責人、證據框架是否轉成具體工具或標準規格，以及 Isaac ROS 5.0 的實際開發者採用度；同時持續追蹤 Agents API 定價公布後的採用情況、Devin 自我測試的第三方驗證數字，看兩條路線之後是否開始互相引用。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增七則，延續業者同時在據點、信任建設、政策論述三條戰線加速布局的既有觀察，這次訊號更密集也更分散。OpenAI 這一批動作最多：09-21 發文倡議建立全球 AI 標準、同日擴充 OpenAI Academy 學習路徑，09-23 一口氣發了三則──Academy 兩週年回顧、把 Daybreak 網路防禦計畫開放給烏克蘭政府、與 Grab 合推東南亞技能培訓計畫「GO Forward with AI」，觸及地緣政治、教育普及與區域夥伴三個不同性質的政策動作；NVIDIA 則是 09-21 報導埃及 AI 生態系活動、09-23 報導新加坡 AI Day，兩則都是區域生態系經營的公關稿形式，具體技術或商業進展的細節都被我們手上的證據截斷。整體上，OpenAI 這一輪把政策論述與教育普及兩條戰線同時加碼，NVIDIA 則持續複製區域活動的固定公式，兩家公司在這條主線上的操作模式跟上一輪相比沒有本質變化，只是密度更高。
    next: 觀察 OpenAI 的全球標準倡議是否有具體內容或合作對象公布、烏克蘭政府使用 Daybreak 的實際成效、Grab 培訓計畫的完訓人數；同時留意 NVIDIA 埃及與新加坡這兩場活動是否有更完整的報導補上具體參與者與展示項目，以及澳洲監理機關對青少年安全藍圖的回應進度。
    lenses: []
