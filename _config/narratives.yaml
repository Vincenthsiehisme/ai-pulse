version: 1
updated: '2026-10-18'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 這一輪新增 10-18 的 vLLM v0.32.0 與 10-17 的 NVIDIA RTX Spark 筆電開賣。v0.32.0 有 814 個 commit、363 位貢獻者，新增預設啟用的 POST /v1/systemone 端點，摘要沒有效能數字。RTX Spark 筆電起價 2,399 美元、最高 128GB 統一記憶體，ASUS、Dell、HP、Lenovo、Microsoft、MSI 都有機種，全是廠商自述，沒有第三方實測。10-15 的北歐與歐洲科學界兩則 NVIDIA 文章、10-14 的歐洲市政 agent 文章，仍缺算力金額、專案名稱與成效數字。10-13 的〈All Systems Go〉、10-12 的 Vera Rubin 開放架構、10-09 Ai2 的 GPU 排程文章，同樣是單一來源或缺對照數字。
    next: 看 RTX Spark 筆電的獨立評測，尤其是本機大模型推論速度與 128GB 機種的實際售價；看 vLLM v0.32.0 的完整 release notes 與 /v1/systemone 的文件及後續 issue；看歐洲科學界取用計畫公布的算力配額與首批合作機構；看北歐文章是否列出各國專案與金額；看市政 agent 文章是否點名城市與合約；看 Vera Rubin 的開放規格文件有沒有釋出；看 Ai2 那篇有沒有給叢集利用率的前後數字。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這一輪新增 10-15 到 10-16 的三則，都只有標題與 Hugging Face 的一句通用介紹。NVIDIA 的印度語系預訓練資料標題寫 2.8 兆 token 加開放的資料生成流程，授權與涵蓋語言未知。Beam 標題稱是 501B 的開放模型，網址帶 reflection-beam，規格與授權沒有。IBM 的 Granite Switch 4.1 標題稱一個端點處理對話、決策與語音，模型大小與評測沒有。前一輪的 NVIDIA Nemotron 3.5 Super VL 與兩款邊緣模型，「最快」「最準」是官方自述，沒有第三方基準。Apertus 1.5、Meta 的 Muse Spark Open、FLUX.3 Image Klein 進入 Diffusers、DeepMind 的抗菌肽、Ai2 HiRO-ACEv2、Gemini 4 Argon（只收標題與連結）、Liquid AI 的 LFM2.5-24B-A2B 與 GPT-6.1 Sol，仍停在標題與一兩行說明，沒有獨立評測數字。
    next: 看 Beam 的權重是否真的可下載、授權寬不寬，以及第三方評測；看 NVIDIA 印度語系資料集與生成程式碼有沒有附連結與授權，有沒有人用它訓出模型；看 Granite Switch 4.1 內文有沒有列模型大小與語音、決策兩項的評測；看 Nemotron 3.5 Super VL 與 Bolt 的第三方基準，以及 Bolt 在 24GB 裝置上的實測吞吐量；看 Apertus 1.5、Muse Spark Open 與 FLUX.3 Image Klein 原文有沒有列參數量、授權與基準；看 Gemini 4 Argon 原文公布的基準與開放日期，以及第三方評測；看 LFM2.5-24B-A2B 的模型卡有沒有列基準、授權與每秒 token 數；看 GPT-6.1 Sol 的獨立實測與價格。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這一輪新增 10-16 的 Itaú 案例：OpenAI 說這家巴西銀行對客戶推出對話介面 ia.i，內部用 IARA 治理平台管理，放在 AI First 策略下，摘要沒有用戶數、上線時間或成效。前一輪 10-15 的三則是把產品交給特定對象。OpenAI 的 Rosalind 學術方案讓符合資格的學術實驗室申請贊助存取 GPT-Rosalind，限生命科學，資格與額度摘要沒有。Sullivan & Cromwell 與 OpenAI 做出 Agreement Analyzer 找合約草稿的問題，沒有成效數字。Anthropic 擴大 Claude 在政府三個分支的使用範圍，依授權只收標題與連結。OpenAI 的 Block 案例稱資安團隊調查威脅更快，沒有基準線。SentinelOne 稱惡意程式分析從數週縮到數小時，是少數有前後對比的案例，但樣本數與比較基準摘要沒有交代。NVIDIA 的 RTX Spark 預告與 GeForce NOW 的 DLSS 4.5 控制是活動與功能預告，沒有技術細節。xAI 的 Grok Voice 3 因站方宣告 ai-input=no 只收標題與連結。
    next: 看 Itaú 或監理端是否公布 ia.i 的使用者數、處理量與申訴率；看 Anthropic 政府公告原文有沒有列具體機關、定價或採購管道；看 Rosalind 方案公布的資格條件、贊助額度與首批實驗室；看 Sullivan & Cromwell 是否公布 Agreement Analyzer 的使用範圍或錯誤率；看 Block、SentinelOne 或第三方是否公布樣本數、準確率、誤判率與測量方式；看 Grok Voice 3 原文有沒有語音延遲、語言支援與開放對象；看 Study Mode 是否擴大語言與國家，並公布教育端使用數據；看 RTX Spark 發表後公布的規格、價格與出貨時程；看 Higgsfield 是否公開長片樣本與定價。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 這一輪新增 10-18 的 Anthropic〈Public Benefit Fund〉，依授權只收標題與連結，基金規模、用途與對象要讀原文，單看標題無從判斷。10-14 的 Anthropic 新加坡辦公室同樣只有標題與連結，只能確定在亞太增加據點。10-13 NVIDIA 對法國新創的新投資，投資金額與名單摘要沒有給，目前只有 NVIDIA 單一來源。10-08 Anthropic 的 Genesis Mission Commitment 與 Cyber Mission 也只收標題與連結。09-30 的 NVIDIA 研究生獎學金最高 6 萬美元與 09-28 OpenAI 對 Lenfest 計畫出資 500 萬美元，仍是最近有金額的資金類訊號。
    next: 讀 Public Benefit Fund 原文，確認基金規模、出資方式與受益對象；看 Anthropic 新加坡辦公室原文有沒有給人數與合作對象；看 NVIDIA 或被投資新創是否公布法國投資的金額與名單；讀 Genesis Mission Commitment 與 Cyber Mission 原文，確認承諾項目、時程與是否涉及資金；看 Lenfest 計畫的參與機構與資金分配。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增兩則，都出自 OpenAI 10-16 的客戶案例，數字都是廠商自述。Stack Overflow for Agents 說兩位工程師用 Codex 幾週內做完，ChatGPT 外掛帶動代理建立數最高成長 10 倍，摘要沒有基期與統計區間。Benefit Street Partners 的 Anant Kumar 自己做放款估值比較與信貸合約分析工具，用 Codex 做程式碼審查，標題稱回答更快，沒有量化。再往前，10-14 的 Third Moment Research 標題給的是規模：10,000 個 agent 連跑 36 小時以上，沒有任務類型、完成率或成本。Amp 主張 agent 用到程式碼以外的工作，沒寫實際任務。10-08 Hugging Face 的 ML intern 文章只有通用介紹，Oracle 案例只有「數天縮到數分鐘」的標題，10-07 微軟研究院的 Agent Lightning v1.0 沒有效果數據，10-06 OpenAI 與 Ironclad 的合約 agent 沒有成績。
    next: 看 Stack Overflow 或第三方是否公布代理建立數與註冊數的絕對值和期間；看 Benefit Street Partners 是否把工具擴到其他團隊並公布節省的時間；看 OpenAI 或 Third Moment Research 是否公開任務完成率、單位成本，或第三方複現；看 Amp 是否公布非程式碼任務的類型與使用量；看 Hugging Face 那篇有沒有公開 ML intern 的程式碼或模型連結；看 Oracle 或第三方有沒有公開工時節省的量測方式；看 Agent Lightning 的程式碼與接入範例，以及微軟以外的團隊有沒有跑出訓練結果；看 OpenAI 是否公布 Ironclad 合約任務的評測結果；看 Holo4 有沒有第三方的電腦操作評測。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增兩則。Google DeepMind 與新加坡 GovTech 合作，用裝置端的 Gemma 小模型攔截私人聊天中的對話式詐騙，依摘要沒有資料送到雲端，偵測率與誤報率沒有公布。OpenAI 發表歐盟 agentic AI 採用分析，說企業與小型企業的採用在成長，更深入的使用還有價值可挖，是 OpenAI 自己的分析，沒有給採用率。先前的觀察仍在：OpenAI 瓦解兩個利用假記者與智庫當門面的 AI 影響力行動，歸屬與成效都是單方說法；阿布達比 TII 在 Hugging Face 發表 Falcon-Emirati，模型規格與評測沒有；Sam Altman 09-23 在聯合國安理會的談話偏原則性表態；Daybreak 開放給烏克蘭政府與 Grab 東南亞技能培訓還沒有成效數字。
    next: 看 DeepMind 與 GovTech 是否公布偵測率、誤報率與部署的裝置範圍；看 OpenAI 歐盟分析的完整版有沒有公布方法、樣本與採用率，以及歐盟政策討論是否引用；看有沒有獨立研究機構公開同一批假身分的分析，對照 OpenAI 的說法；看 Falcon-Emirati 的權重是否釋出、授權條款，以及阿拉伯語方言基準上的公開評測；觀察後續是否有具體政策文件、多邊協議或聯合國層級的 AI 治理提案跟進；沿用上一輪對烏克蘭 Daybreak 成效與 Grab 完訓人數的觀察。
    lenses: []
