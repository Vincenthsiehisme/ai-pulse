tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 這條線這一輪新增七則，除了延續「資料中心算力往機器人、邊緣、實體模擬延伸」的主軸，也首次出現規模衝上 10 億使用者等級的儲存基礎設施案例：OpenAI 發表技術文章，說明儲存平台 Habitat 如何從一個 Python 函式庫演進成全球分散式儲存系統，目前支撐超過 10 億 ChatGPT 使用者、每秒處理 2,200 萬次請求，文章標題點出這是系列的 Part One，後續應該還有更多架構細節。訊號依然集中在 NVIDIA：Skild AI 用 NVIDIA 的物理 AI 技術，訓練機器人基礎模型 S1 學習沒見過的長跨度任務；NVIDIA 另外發文談 robotaxi 生態系，宣稱 2035 年市場上看 4,000 億美元、超過 600 萬輛商用車，但這是官方自己的預測數字，不是已實現的規模；晶片新創 d-Matrix 則宣布採用 NVIDIA NVLink Fusion 互連技術，把自家 Raptor XPU 接進 NVIDIA 的資料中心生態系，是 NVIDIA 持續拉攏第三方晶片商鞏固互連標準地位的又一例。這一輪也出現了非 NVIDIA 的算力訊號：Anthropic 發布擴大使用 Google 雲端 TPU 與服務的公告，只留標題與連結，看不出擴大的具體規模；另外還有一則社區關係性質的「承擔電價上漲」公告，同樣只有標題。vLLM 發布 v0.29.0，Model Runner V2 正式成為所有模型的預設執行路徑，是推論引擎工程層面的迭代，不是算力採購訊號。
    next: 留意 d-Matrix Raptor XPU 的實際出貨時間表與客戶案例、Skild AI S1 是否有真實產線部署數據、Anthropic 擴大採用 Google TPU 的具體算力規模是否被揭露，以及 Habitat 系列文章後續是否公布儲存架構的具體取捨（例如一致性模型、資料分片策略）與成本表現。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這條線這一輪新增五則，跟既有『小而專、成本導向模型迭代』主軸關聯都不算直接。IBM Research 在 Hugging Face 發布新一代時間序列基礎模型 Granite Time Series PatchTST-FM-r2，採用商用友善授權，官方稱達到 SOTA，但沒有第三方基準數字佐證，是這五則裡唯一有實質技術描述可查的一則。Anthropic 同一時段另外發了三則公告：《Fable Safeguards Jailbreak Framework》從標題看是防範模型被越獄攻擊的防護框架、《Redeploying Fable 5》從標題看是把代號 Fable 5 的系統重新部署、以及一項罕見疾病研究補助計畫，三則都只留標題與連結，具體內容看不到。OpenAI 則分享了一個應用案例：賓大實驗室用 Codex 與 ChatGPT 篩選抗藥性感染的候選抗菌分子，屬於既有模型的應用展示，不是新模型發布。這一輪沒有新的『小而專』模型迭代訊號進來，主軸判斷不變。
    next: 留意 Anthropic 是否進一步說明 Fable 5 重新部署的原因，以及 IBM 的 SOTA 宣稱有沒有第三方基準測試跟進驗證；『小而專』模型迭代這條主軸則要看下一輪有沒有新的模型發布訊號。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這條線這一輪新增訊號量最大，主軸從 Google DeepMind 的產品化訊號，暫時被 Anthropic 一波集中發布的企業顧問夥伴公告蓋過。同一兩天內，Anthropic 陸續發布與 DXC、KPMG、TCS、UST、PwC 等多家全球性 IT 顧問與會計師事務所的合作或結盟公告，還開出一個給夥伴使用的「Services Track Partner Hub」入口，這批公告全部只留標題與連結，看不出各自合作的實際範圍與規模，但同一時間集中出現這麼多家顧問公司具名，本身就是訊號：Anthropic 正把企業導入的通路，從直接銷售延伸到透過顧問業者的間接管道。同一批裡，Anthropic 也發布了金融服務產業的專屬產品進展、Claude 上架微軟 Foundry 平台、加拿大亞伯達省政府採用 Claude 做資安相關工作，以及一則高等教育計畫公告，鎖定校園市場，具體適用對象與規模同樣只留標題與連結。OpenAI 則發布了 ChatGPT Work 的資料代理功能與全雙工語音 API GPT-Live-1，兩者都鎖定企業與開發者場景。NVIDIA 的 GeForce NOW 遊戲片單更新與這條主軸關聯較弱，只是消費端業務的例行消息。
    next: 留意這批顧問夥伴公告是否有具體客戶導入案例或成效數字跟進公布，目前全部停在宣布合作的層級，看不出實際落地規模；高等教育計畫是否公布具體學校名單或使用規模，也是判斷這條產品線觸及廣度的關鍵；同時留意 Google DeepMind 這條產品化主軸下一輪還有沒有新進展。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 這條線這一輪新增訊號量最大，且多則直接觸及先前主軸提到的 Genesis Mission：Anthropic 加入這項由美國政府主導、先前 Google 已投入 4,000 萬美元的科學研究合作計畫，公告同樣只留標題，看不出 Anthropic 投入的規模是否比得上 Google。同一批裡還有幾則規模明顯更大的資本訊號：Anthropic 宣布在美國 AI 基礎設施投資 500 億美元、與微軟及 NVIDIA 同時宣布三方策略合作、收購開發工具鏈公司 Bun 並同時宣布旗下編碼 agent 產品 Claude Code 達到 10 億美元里程碑，三則全部只留標題與連結，具體條款、資金結構、10 億美元的統計口徑都看不到，需要看原文才能確認。另外還有 ServiceNow 合作、與 Cognizant／馬里蘭州政府的合作、收購 API 工具公司 Stainless 等規模較小的資本動作。人事與治理層面，Anthropic 這一輪也發布 Rahul Patil 加入公司的公告，同樣只留標題與連結，看不出他實際負責的職位層級；長期利益信託（Long-Term Benefit Trust）出現人事異動；還有一則只留標題、光看題名判斷可能與「機密遞交 S-1 註冊申報表」有關的公告，如果屬實會是 IPO 進程的重大訊號，但目前只有標題可查，無法確認。OpenAI 這邊則是 Paul Christiano 加入其基金會董事會與安全委員會。整體上，這一輪的資本動作規模明顯超過先前『Google 40M 是唯一資本訊號』的主軸描述，需要更新既有判斷。
    next: 留意《Confidential Draft S1 SEC》這則的原文內容，如果真的是機密遞交 S-1，會是這條線目前最重要的待驗證訊號；也留意 500 億美元投資與微軟／NVIDIA 合作的具體資金結構與條款是否被進一步揭露，以及 Rahul Patil 到職後是否公開具體職責範圍。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這條線這一輪新增四則，除了先前提到的 Anthropic MCP 捐贈案、Claude Agent SDK 進駐 Xcode、Hugging Face 重建 AUTOMATIC1111，現在又加入 OpenAI 發布的 Agents API：一套用 Codex harness 打造的代管服務，讓開發者能直接建立並執行雲端代理，內建任務編排、長時間運行的工作階段與工具調用，不必自己拼湊基礎設施。四則放在一起看，這條線的訊號依然集中在 agent 工具鏈的治理與代管層：Anthropic 捐出協定治理權、OpenAI 把代管服務做成產品，兩家用不同方式在搶佔 agent 基礎設施的入口，不是在比拼模型本身的能力。
    next: 留意 Agentic AI Foundation 的創始成員名單裡有沒有其他主要 agent 廠商，那是判斷治理是否真的中立的關鍵訊號；也留意 OpenAI Agents API 正式上線後的計費規則，以及開發者拿它跟自架框架相比的實際選擇。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這條線先前的判斷是尚無足夠已發布事件可支撐判斷，這一輪事件數已經足夠支撐初步判斷，訊號集中在 Anthropic 密集的區域擴張與政策定位，而且是在 Anthropic 公布 Series F 估值來到 1,830 億美元的同一天，密集發布一整批政策與信任建構型公告。辦公室同時在巴黎、慕尼黑開設，首爾與米蘭稍早也才開；印度與南韓分別任命了董事總經理與代表理事，這一輪再加上 Chris Ciauri 出任企業 AI 業務的另一位區域董事總經理，區域布局正從單一人事任命，往實體據點同步鋪開。政策與信任建構層面，除了先前提到的 Dario Amodei 就美國 AI 領先地位發表聲明、政治中立性說明、保護使用者身心健康的公告、SB53 合規框架與對外捐款，這一輪又新增四則同類訊號：更新消費者服務條款、調整銷售的地區限制、成立聚焦國家安全與公部門事務的顧問委員會、與美國 CAISI 及英國 AISI 合作強化模型安全防護、以及與公私部門合作開發 AI 的核能安全防護機制，全部只留標題與連結，具體條款、成員名單與工作項目都要讀者自己查證。把這批公告跟同一天的估值公告放在一起看，一個解讀是 Anthropic 在拉高估值的同時，也同步鋪了一份說給政府與監理單位聽的信譽清單；但也可能只是各團隊各自的例行發稿節奏剛好撞期。OpenAI 這邊除了呼籲政策窗口正在開啟的表態文章，也宣布擴大聯邦、州、地方與部落政府的 AI 存取優惠。較特別的一則是 Anthropic 把可解釋性研究員 Chris Olah 與教宗良的一份通諭連結在一起的公告，具體關聯同樣只留標題看不出來。
    next: 留意這批只留標題的政策與信任建構公告（消費者條款、地區銷售限制、國安顧問委員會、CAISI／UK AISI 合作、核能安全夥伴關係、政治中立性、使用者身心健康保護、SB53 合規框架）是否有第三方媒體或監管機關的後續回應，那會比公告數量本身更能判斷這波發稿是不是真的在對沖估值帶來的審視壓力；也留意 Chris Olah 與教宗通諭的公告原文究竟在講什麼。
    lenses: []
