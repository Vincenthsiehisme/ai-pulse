# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述」，人為維護、可過 speak-human-tw，刻意獨立於 0-LLM 抓取管線；
# 夜間鏈只在某主線有新事件時重寫該條 now / next（thesis、lenses 不動）。
version: 1
updated: '2026-07-24'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 這條線八則事件全是 NVIDIA。主軸還是 Vera Rubin，用每 token 成本、每瓦效能、每塊錢智慧三個角度輪流打，鎖定 agent 時代的後訓練。往外延伸的有三塊：網通（Spectrum-6 補大規模連線的瓶頸）、供應鏈在地化（緯創德州開廠、在美國造的表態），以及實體與醫療（開源醫療物理模擬降低機器人訓練門檻）。落地案例則有 BMS 的製藥 AI 工廠、海軍研究院的 DGX GB300。方向一致：供給端在替 agent 工作負載重新定價，戰線同時鋪到實體 AI 和產地。
    next: 要驗證這不只是單一廠商的行銷敘事，得看第二個獨立來源，也就是雲廠、對手晶片或實際部署者，是否印證「每 token 成本最低」的說法。可查的硬事有幾件可追：緯創福和市廠的產能爬坡、BMS 那套算力跑出什麼研發成果，以及開源醫療模擬框架有沒有外部團隊真的採用。目前八則全是單一來源、標待證實。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；四則皆單源、heat 偏低（8–14），還沒跨來源共振。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這一輪訊號集中在 Google：一次端出 Gemini 3.6 Flash、3.5 Flash-Lite 和 3.5 Flash Cyber，把輕量線再往下切一層。方向延續「小而專、成本導向」，不過這批只有 Google 這端在動，另一端沒有對應的新訊號進來。
    next: 看這三個 Flash 變體是各有定位，還是命名在膨脹；也看有沒有第二來源的獨立評測，能驗證輕量線的品質與成本主張。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這批三則裡，兩則是 NVIDIA 的產品面動作：SIGGRAPH 上把 agentic 與實體 AI 綁進繪圖和模擬，還有 GeForce NOW 的例行遊戲上架（後者與 AI 主線關聯低）。第三則才是 thesis 講的那類，Google 的 Gemini 3.5 Flash Cyber，把模型能力包成找漏洞、修漏洞的資安產品。整體看，能力落地成產品的訊號在，但這輪主要來自 NVIDIA 的展示，不是純 Google 入口。
    next: 看這些功能有沒有離開發布稿的實際採用數字，尤其 Flash Cyber 有沒有真的用在修漏洞的案例；也看 NVIDIA 在 SIGGRAPH 那批工具的實際釋出與開發者採用。GeForce NOW 這類遊戲營運訊號可以先放一邊。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，heat 8–10 偏低；當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: Google 的 Genesis Mission 承諾形式是 token 與額度而非直接資金，摘要自評『象徵大於實質』。單一事件，還談不上趨勢。
    next: 看是否出現第二筆同類『算力當資本』的案例，才能判斷這是模式還是個案。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
