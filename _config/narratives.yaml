# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-10-27'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 今天新增兩則。OpenAI 講 Habitat 儲存層撐住逾 10 億 ChatGPT 使用者，用多租戶、全球快取與 Azure Cosmos DB，讀取快 12 倍，基準沒說。Hugging Face 發文教人查模型能否在 AWS Trainium 上跑，指向 torch-neuronx 的模型支援，沒有支援清單或效能數字。10-22 NVIDIA 的 Minerva 是 AIOps 平台，價格、授權與支援範圍沒給；DSX 案例稱電力是目前基礎設施最大瓶頸，採用公司與規模被截斷。10-21 GTC Berlin 同期消息：Google Cloud 與 NVIDIA 稱 Vera Rubin 基礎設施下個月 GA，之後擴到歐洲，價格沒給；cuDSS GA 與機密運算擴充皆為廠商自述，沒有效能與價格數字。Amazon 的 TorchNeuron 剖析系列第一篇摘要無內文。10-20 Nebius、Nscale 轉向 Vera CPU 只有廠商說法。
    next: 看 OpenAI 全文是否交代 12 倍的比較基準與延遲分位數；看 Trainium 支援模型的涵蓋與實測價格比；看 Minerva 的上市時程與具名客戶；看 DSX 採用者是否公布併網時間或電力利用率；看 Vera Rubin 下月是否如期開通與定價；看 Nebius、Nscale 是否公布 Vera CPU 部署規模；看 cuDSS 的實測加速倍率與機密運算的效能損耗。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 今天新增三則。Genie 4 是 DeepMind 的世界模擬模型，自稱即時模擬的擬真度大幅提高，同一篇也上了 Hacker News 首頁，規格與延遲沒有數字。OpenAI 發文列出模型在 Kakeya 猜想、Exponential Time Hypothesis 與量子色動力學上的結果，並說明研究者如何驗證，結果內容我們手上只有摘要。Liquid AI 的 LFM3 在 Hugging Face 發文，主打特化的多模態模型，摘要只有一行來源說明。10-26 OpenAI 的 GPT-6.1 Terra 來源授權只收標題與連結，規格、價格與評測我們不轉述，原文在 openai.com/index/introducing-gpt-6-1-terra。10-23 OpenAI 的訓練環境安全文章說加強了訓練與評測的隔離，沒有具體事件或成效數字。10-22 NVIDIA Cosmos 擴充了訓練工具、模擬檢查點與資料工廠藍圖，排名由 NVIDIA 自述。10-19 的 Anthropic Responsible Scaling Policy v3 仍只有標題與連結，與前一版的差異我們比對不了。更早的 Beam 501B、Apertus 1.5、Muse Spark Open、Gemini 4 Argon 等，一樣停在標題與一兩行說明，沒有獨立評測數字。
    next: 看 Genie 4 是否開放外部試用或發布技術報告；看 OpenAI 學術合作那篇的結果有沒有學界公開複驗；看 LFM3 的權重釋出方式、授權與基準測試；讀 GPT-6.1 Terra 原文，看價格、可用日期與第三方基準是否在一週內跟上；讀 RSP v3 原文，與前一版比對能力門檻與防護等級有沒有變；看 Gemini 4 Argon 公布的基準與開放日期。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 今天新增兩則。xAI 的 Grok Bot Sales 頁面，站方宣告 ai-input=no，我們不取內文也不轉述，原文在 x.ai/news/grok-bot-sales。OpenAI 的 Check Point 案例說，分析師用 Daybreak 把漏洞情資更快轉成客戶防護，沒有節省時間的數字。10-26 兩則 OpenAI：ChatGPT 工作用途的 Signals 資料涵蓋 165 項工作活動、近 100 個國家，摘要沒有占比，樣本與分類由 OpenAI 定義；Fanatics 的 Shop the Look 在約 30,000 件 MLB 商品上測試，互動率高 10%，對照組與指標定義沒寫，也沒有轉換率。10-22 有五則：Uber 把 ChatGPT Work 推給超過 3 萬名員工，OpenAI 官方與 TechCrunch 都有報導，合約金額與使用率沒有。OpenAI 發表 Decisions API，摘要只有「快、專注、低成本的決策」一句。OpenAI 另發文談前線部署工程（FDE），內文未取得。NVIDIA 列出歐洲零售案例，其中一個商務平台推論成本降 90%，基準沒說明。GeForce NOW 上架新遊戲，與 AI 主線關聯弱。10-21 ChatGPT Ads 擴到 26 個新國家，稱超過 10 萬名廣告主使用，沒有附營收或成效。
    next: 讀 Grok Bot Sales 原文，看有沒有價格或產品細節；看 Check Point 是否公布使用 Daybreak 後的時間節省；看 Signals 原文是否公開各類工作活動的占比與逐期變化；看 Fanatics 是否公布轉換率或營收指標；看 Decisions API 文件公布的價格、延遲與可用模型；看 Uber 或 OpenAI 是否公布使用率與節省工時；看 OpenAI 是否公布廣告營收與各國上線清單。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 今天新增兩則。NVIDIA 在 GTC Berlin 展示歐洲金融業在自家基礎設施跑開放權重模型，Revolut 的部分被截斷，規模與成本數字沒有。xAI 發布標題為 Partnernetworkannouncement 的公告，該站宣告 ai-input=no，我們依此不取內文，夥伴是誰與條件為何看不到，原文在 https://x.ai/news/partnernetworkannouncement 。10-21 OpenAI 模型將上 Google Cloud，Ars Technica 稱未來幾週提供 GPT 6.1 的 Astra、Sol、Luna，價格與合約條件不明，單一媒體來源。OpenAI 發表〈前沿 AI 的民主治理〉第二部，是政策藍圖，沒有具體資源承諾。Anthropic 宣布 Christopher Stubbs 加入 Long Term Benefit Trust，內文未取得。10-20 OpenAI 收購 Orchestra Bio，金額與交割時程仍不明。
    next: 讀 xAI 公告原文，確認夥伴名單與條件；看 Revolut 等業者是否公布實際上線範圍；看 OpenAI 或 Google Cloud 官方公告的上線日期與價格；看 OpenAI 與 Orchestra Bio 是否公布交易條件；看 Anthropic 是否公布 Trust 成員名單與任期。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 今天新增兩則 OpenAI 案例。Oracle 擴大合作，把商業應用與 AI 代理帶進 ChatGPT，合作範圍與上線時程沒有給。Greptile 用 GPT-6 Astra 測使用者工作流程，並搭配 Daybreak 與 Codex，摘要沒有偵測率或誤報率。10-26 OpenAI 的 Codex Ultrafast 事故調查案例，工程師自述調查時間從數小時縮到數分鐘，沒有案例數與實測數字。10-22 Anthropic 把 Agent Skills 標準捐給 Linux 基金會旗下的 Agentic AI Foundation，聲明稱要保持開放、不綁定單一廠商，官方公告依授權只收標題與連結，治理細節證據裡沒有。10-21 Cloudflare 用 OpenAI Daybreak 找漏洞並提出修補建議交人審查，沒有量化結果。同日 NVIDIA Agent Toolkit 擴充，官方稱企業可用公司資料客製並控制代理，採用者沒有給，屬廠商自述。10-16 OpenAI 的兩個客戶案例數字出自廠商，10-14 Third Moment Research 的 10,000 個 agent 連跑 36 小時以上，沒有完成率與成本。
    next: 看 Oracle 首批進 ChatGPT 的應用清單與上線日期；看 Greptile 是否自行公布偵測率或誤報率；看 OpenAI 是否公開 Ultrafast 的具體事故排查過程與準確率；看 OpenAI、Google 等是否宣布支援 Agent Skills 或加入 AAIF 工作組；看 Cloudflare 或 OpenAI 是否公布 Daybreak 找到的漏洞數與修補時間；看 NVIDIA 是否點名採用 Agent Toolkit 的企業。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 今天新增兩則。OpenAI 與波蘭 NASK 合作做 AI 安全與資安研究，沒有金額、期程或具體專案。NVIDIA 稱哈薩克的 AI 生態系正從基礎設施規劃走向部署，與黃仁勳訪問阿斯塔納同步發布公告，摘要沒有 GPU 數量或投資金額。10-22 NVIDIA 歐洲系列兩則：公部門那篇指出政府希望敏感資訊留在自己控制的基礎設施，用開放模型自行評估並套用自己的防護機制，沒有點名機關與預算；Earth-2 那篇談歐洲業者部署開放模型做天氣與氣候預測，具體部署單位被截斷。10-21 歐洲工業大廠在工程與製造流程用 CUDA-X、Omniverse、Cosmos、Nemotron，沒有點名客戶與數字。歐洲雲端夥伴擴張，夥伴名單與容量沒給。10-20 巴塞隆納 AI Factory 新創計畫仍沒有金額或配額。
    next: 看 OpenAI 與 NASK 公布的聯合研究或評測成果；看哈薩克方公布的機房規模、GPU 採購量與啟用時程；看有沒有具名的歐洲政府機關公開採用，以及使用的模型與語言；看 Earth-2 業者的預測準確度比較；看歐洲雲端夥伴公布的容量與客戶；看 BSC 是否公布參與新創數量與運算配額。
    lenses: []
