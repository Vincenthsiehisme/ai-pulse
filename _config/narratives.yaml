# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述/口吻」，是全系統唯一准 LLM 動手處：由排程 Cowork 任務（非 0-LLM 自動抓取鏈）
# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-11-16'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 今天新增七則，五則來自 NVIDIA 的 SC26 週。Rubin HPC 是 Vera Rubin 平台裡針對模擬與資料處理的新 GPU，規格與時程證據裡沒有；DGX Spark HPC 開發套件是四台 DGX Spark 環狀直連的桌面叢集；Slurm 擴充要把量子處理器排進超算排程，稿件自述近 30 個中心正在部署逾 50 顆量子處理器；NVIDIA 稱 Vera Rubin 首次參賽就拿下 MLPerf Training v6.1 全部項目，是廠商自述，其他廠商是否送件沒交代；Lambda 用 Photonics CPO 交換器串接 GB300 NVL72，功耗與故障率沒有數字。另有供應鏈主管專訪。非 NVIDIA 的一則是 vLLM v0.34.0，新增 10 個模型支援，KV cache 預設改成依暖機後實際剩餘記憶體配置。前一輪：ggml-org 宣布 llama.cpp 進入 v1.0.0，變更內容證據不足。11-09 NVIDIA 為四款韓國開放模型釋出 Dynamo 部署配方，沒有吞吐量或延遲數字。
    next: 看 Rubin HPC 的雙精度規格與出貨時間；看 MLPerf Training v6.1 其他廠商的送件情形，以及 Endpoints 的 10 倍是跟誰比；看 Lambda 公布的 CPO 部署規模、故障率與功耗；看 Slurm 量子擴充是否合入上游、有哪些量子廠商接上；看 vLLM 新模型支援的實測吞吐，以及 KV cache 預設改動有沒有引發記憶體回報；看 llama.cpp v1.0.0 有沒有穩定承諾；看 Dynamo 配方公布的實測吞吐量。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 今天新增一則。OpenAI 開始「嵌入式評估」，找 Apollo Research、METR、Transluce 與 Goodfire 獨立檢驗對齊、防護與監控系統，評估範圍、取得的權限與結果公開方式證據裡都沒有。前一輪：11-13 Anthropic 四篇新聞頁文章（前沿 AI 透明度、ASL-3 保護措施、AI 危害處理方法、Responsible Scaling Policy 回顧）依授權只放標題與連結；Ai2 的 XYBench 主題是處理問題背後真正的問題，基準設計與結果手上沒有。11-12 IBM 說 Granite 4.1 的 3B 與 8B 已內建 LLMON，Anthropic 的〈Claude 4〉同樣只放標題與連結。11-11 DeepMind 的 AlphaGenome 2 預測 DNA 序列與變異對特定人類細胞類型和疾病的影響，摘要沒有基準數字。
    next: 看 OpenAI 嵌入式評估的第一批報告何時發布，以及評估方能否自行署名公開；看 Anthropic 那幾篇原文有沒有可驗證的具體措施與觸發條件；看 XYBench 是否公開資料集與評分程式；看 LLMON 的模型卡或論文有沒有公布對比 JSON 與 XML 的準確率和 token 用量；看 Claude 4 原文有沒有可驗證的能力與價格資訊，以及獨立評測；看 AlphaGenome 2 是否釋出論文與基準對比。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 今天新增四則。OpenAI 擴大 ChatGPT for Academic Researchers，讓全球 20 萬名研究者免費使用前沿模型，資格條件與額度沒給；同時開了科學專屬部落格。Hugging Face 與 OpenRouter 合作，目標是讓開放權重模型更容易跑起來，整合方式與定價證據只有通用簡介，待補。另有一篇 OpenAI 兒少安全文章依來源政策只放標題與連結。前一輪：NVIDIA 部落格盤點醫療團隊如何用 AI 縮短病患等到適當照護的時間，沒有可比較的成效數字；Anthropic 的〈模型停用承諾〉只放標題與連結。11-12 OpenAI 的 Gondola 案例說 Codex 讓主力工程師產出提高 50%，沒有第三方查證。11-11 OpenAI 說逾 20,000 名退伍軍人與轉職軍人領了一年免費 ChatGPT Plus，是領取數不是續用數。
    next: 看學術研究者方案的申請條件與每人額度，以及校級合作是否同步出現；看 Hub 模型頁是否出現 OpenRouter 的呼叫入口，以及開放模型在 OpenRouter 上的用量變化；看 OpenAI 科學部落格接下來的發文量與外部研究者署名；看 Anthropic 〈模型停用承諾〉原文列出的通知期限；看 OpenAI 是否公開 Gondola 案例的衡量方式；看免費方案的續訂情況。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 今天新增兩則。LVMH 旗下媒體部門與 OpenAI 宣布策略合作，要用 AI 支援新聞業並讓刊物能透過 ChatGPT 取得，金額、期限與授權範圍證據裡都沒有。NVIDIA 在 SC26 紀念 CUDA 二十週年，是紀念稿，沒有新產品或新數字。前一輪：Anthropic 三篇新聞頁文章（美國選舉準備、支持 SB 53、對美國 AI 行動計畫的看法）依授權只放標題與連結。11-09 NVIDIA 與韓國科學技術資訊通訊部宣布對韓國新創的新投資計畫，投資對象與金額證據不足。11-05 Anthropic 發表〈The Long Term Benefit Trust〉，同樣只有標題與連結。11-04 OpenAI 宣布收購 Pierre Computer Company, Inc.，金額與業務目前看不到。
    next: 看 ChatGPT 內出現 LVMH 刊物的呈現方式，以及雙方是否公布授權與分潤條件；看 SB 53 的後續立法進度與其他業者是否表態；看那三篇 Anthropic 原文的具體建議；看 NVIDIA 或被投資新創公開具體投資對象與金額；看 OpenAI 或 Pierre 是否公布交易金額與交割時間。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 今天新增四則。OpenAI 的 ChatGPT for Healthcare 加上 computer-use agent、更好的臨床問答與跨醫療軟體的外掛，沒有功能細節與價格；同日另一篇談醫療團隊 computer-use agent 的文章依來源政策只放標題與連結。OpenAI 的 Holiday Extras 客戶案例說 dots 會在沒人要求時主動交出上線報告並提醒問題，dots 的產品形式證據沒有定義。NVIDIA 擴充 CUDA-X 函式庫，新增 cuPhoton、cuPotential、cuSpa，各函式庫的加速倍數不在證據內。前一輪：11-16 之前 OpenAI 客戶案例說 Shield 用 Forge 代理人替 IT 技術人員接手舊版入口網站的操作，Amplitude 的 Wave 標題稱改善 1 到 2 天上線，都沒有基準數字。11-10 DeepMind 的 AlphaProof Code 用 Lean 寫了三百萬行證明來驗證 Signal 的核心加密，涵蓋範圍摘要沒寫。
    next: 看哪些醫療機構或軟體廠商公開採用 computer-use agent，以及有沒有臨床準確度的量化數字；看 dots 是否成為正式產品名稱、Holiday Extras 是否補上成效數據；看 CUDA-X 各函式庫的基準數字，以及有沒有 agent 框架官方整合；看 Shield 或 OpenAI 是否公布 Forge 的處理量與節省工時；看 Signal 或第三方是否獨立確認 AlphaProof Code 的證明結果。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 今天新增三則。NVIDIA 的 AI Day Seoul 在 COEX 兩天吸引逾 2,000 人，主題是實體 AI 與 AI agent，沒有具體合作案或金額。The King’s Trust 與 OpenAI 推出 100 萬英鎊合作，協助英國最多 25,000 名年輕人學 AI 技能，課程與期程證據沒有。Anthropic 一篇標題為「Canadian AI Research」的新聞稿依授權只放標題與連結，內容請看原文。前一輪：Anthropic 的〈Statement Comments Secretary War〉與〈Election Safeguards Update〉同樣只放標題與連結。11-12 OpenAI 宣布出資 200 萬美元投入 AI 與兒童安全研究，受款單位與期程沒給。11-09 NVIDIA 與韓國科學技術資訊通訊部擴大主權 AI 合作，摘要沒有時程與金額。11-06 Open ASR Leaderboard 加入埃及與奈及利亞口音的英語，資料集規模沒有證據。
    next: 看韓國業者後續是否公布與 NVIDIA 的機器人或實體 AI 專案；看 King’s Trust 課程是否開跑、首批受訓人數與就業追蹤；看 Anthropic 加拿大那篇原文是投資、合作還是據點；看 OpenAI 200 萬美元的受款團隊；看韓國合作公布 NPU 與 XPU 共同開發的時程；看 Open ASR Leaderboard 新增資料的規模與各模型錯誤率。
    lenses: []
