# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-10-14'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 這一輪新增 10-14 的 NVIDIA 部落格，說 EMEA 的城市與在地夥伴用 NVIDIA 加速運算建 physical AI agent，處理道路維修時機、能源效率等市政決策。證據摘要在句中截斷，沒有具名城市、合約或成效數字，是廠商的生態系說法。10-13 的 NVIDIA〈All Systems Go〉稱 RTX Spark 最高 128GB 統一記憶體、1 petaflop 的 AI 算力，各家 PC 應用軟體已完成更新，這些是廠商自述，沒有第三方實測，應用名單與出貨日期摘要沒有列。10-12 的 Vera Rubin 開放架構、10-08 LegalOn 的 Codex 成本降 65%、10-09 Ai2 的 GPU 排程文章與 10-05 vLLM v0.31.0，細節與前一輪相同，仍是單一來源或缺對照數字。
    next: 看 NVIDIA 市政文章是否點名具體城市與合約，以及上線後的成效數據；看搭載 RTX Spark 的筆電上市日期與定價，以及第三方實測的本地模型推論速度；看 Surface Laptop Ultra 的出貨日期與售價，以及其他 OEM 是否推出 RTX Spark 機種；看 OCP 或 NVIDIA 有沒有釋出 Vera Rubin 的開放規格文件；看其他 Codex 客戶有沒有公布類似的成本數字與 65% 的比較基準；看 Ai2 那篇有沒有給叢集利用率的前後數字；看 vLLM 或社群公布 DeepSeek-V4.1-Flash 的吞吐與延遲對照；看 DGX Spark 64GB 版的定價與開賣日。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這一輪新增 10-14 的 Ai2 HiRO-ACEv2，標題主張以一小部分成本模擬 3 公里解析度的極端天氣，來源摘要只有「Hugging Face 上的部落格文章」，沒有成本對照或驗證結果。10-13 的 Gemini 4 Argon 依授權只收標題與連結，Liquid AI 的 LFM2.5-24B-A2B 主打裝置端私密 agent，證據只有一句話，沒有基準、速度或授權。10-07 的 Falcon ASR、Liquid AI d1、NVIDIA Nemotron 在 IOI 與 IMO 達金牌等級，以及 10-06 的 OpenAI 數學進展與 EmbeddingGemma 2，仍只有標題與一兩行說明。09-29 的 GPT-6.1 Sol 是廠商自述的比較，沒有獨立評測數字。
    next: 看 HiRO-ACEv2 有沒有公布與既有方法的成本對照與驗證結果；看 Gemini 4 Argon 原文公布的基準與開放日期，以及第三方評測；看 LFM2.5-24B-A2B 的模型卡有沒有列基準、授權與裝置上的每秒 token 數；看 Falcon ASR 的授權與字詞錯誤率；看 NVIDIA Nemotron 文章公布的 IOI、IMO 分數與評測方式；看 d1 的參數量、授權與邊緣硬體延遲；看 EmbeddingGemma 2 的權重釋出平台與多模態檢索基準；看 GPT-6.1 Sol 的獨立實測與價格。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這一輪新增 10-14 的三則。SentinelOne 案例是 OpenAI 稱用 Daybreak 把惡意程式分析從數週縮到數小時，是同一天幾篇案例裡唯一有前後對比的，但樣本數與比較基準摘要沒有交代。Anthropic「2026 Us Midterms」依授權只收標題與連結，內容請讀原文。xAI 的 Grok Voice 3 因站方宣告 ai-input=no，我們只收標題與連結。10-13 的 Higgsfield 案例把 AI 影片從 1 分鐘拉到 10 分鐘以上，長度數字出自標題，畫質、成本與成功率都沒有。10-09 的 Sophos 案例稱威脅調查時間縮短 96%、MDR 案件 52% 自動化，96% 的比較基準沒有交代。其餘 10-08 的使用政策更新、Pollo AI，10-07 的 ChatGPT for Teens、Radisson 外掛，10-06 的 Atlassian 擴大合作，仍是廠商自述。
    next: 看 SentinelOne 或第三方是否公布分析樣本數、準確率與測量方式；看 Anthropic 選舉文章原文有沒有列出可驗證的措施；看 Grok Voice 3 原文有沒有語音延遲、語言支援與開放對象；看 Higgsfield 是否公開長片樣本與定價；看 Sophos 或第三方是否公布自動化案件的誤判率與複查比例；看 2026 使用政策更新原文公布的生效日期與條款差異；看 Radisson 外掛的預訂占比；看 Atlassian 整合的功能、可用方案與上線日期。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 這一輪新增 10-14 的 Anthropic「Singapore Office Opening」，依授權只收標題與連結，人員規模、時程與業務範圍要讀原文，單看標題只能確定 Anthropic 在亞太增加一個據點。10-13 NVIDIA 宣布對法國新創的新投資，文中說法國企業已把 agentic computing 用在太空、金融服務、公共部門與科學研究，投資金額與被投資名單摘要沒有給，目前只有 NVIDIA 單一來源。其餘延續上一輪：10-08 Anthropic 的 Genesis Mission Commitment 與 Cyber Mission 依授權只收標題與連結，我們無從判斷是否涉及資金；09-30 的 NVIDIA 研究生獎學金最高 6 萬美元與 09-28 OpenAI 對 Lenfest 計畫出資 500 萬美元，仍是最近的資金類訊號。
    next: 看 Anthropic 新加坡辦公室原文有沒有給人數、客戶或合作對象，以及後續是否有在地合作公告；看 NVIDIA 或被投資新創是否公布投資金額與名單；讀 Genesis Mission Commitment 原文，確認承諾項目、時程與是否涉及資金；讀 Anthropic Cyber Mission 原文，確認它是新團隊、新產品還是對外承諾；看 Lenfest 計畫的參與機構與資金分配。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增兩則，都出自 OpenAI 10-14 的客戶案例，都沒有成果數字。Third Moment Research 的標題給的是規模：10,000 個 agent、連跑 36 小時以上，用 GPT-6 Astra、GPT-6.1 Sol、Codex 與 Daybreak，摘要沒有任務類型、完成率或成本。Amp 的案例點名 GPT-6 Astra、Ultrafast、GPT-Live-1 與 Sign in with ChatGPT，主張 agent 用到程式碼以外的工作，沒寫實際做了哪些任務。前一輪的觀察仍在：10-08 Hugging Face 的 ML intern 文章只有通用介紹，NVIDIA Omniverse 系列文摘要截斷、沒有具名客戶，Oracle 案例只有「數天縮到數分鐘」的標題，10-07 微軟研究院的 Agent Lightning v1.0 沒有效果數據，10-06 OpenAI 與 Ironclad 的合約 agent 沒有成績。
    next: 看 OpenAI 或 Third Moment Research 是否公開任務完成率、單位成本，或第三方複現；看 Amp 是否公布非程式碼任務的類型與使用量；看 Hugging Face 那篇有沒有公開 ML intern 的程式碼或模型連結；看 NVIDIA 是否公布具名客戶或開發時間對比；看 Oracle 或第三方有沒有公開工時節省的量測方式；看 Agent Lightning 的程式碼與接入範例，以及微軟以外的團隊有沒有跑出訓練結果；看 OpenAI 是否公布 Ironclad 合約任務的評測結果；看 Holo4 有沒有第三方的電腦操作評測。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增兩則。Google DeepMind 與新加坡 GovTech 合作，用裝置端的 Gemma 小模型攔截私人聊天中的對話式詐騙，依摘要沒有資料送到雲端，偵測率與誤報率沒有公布。OpenAI 發表歐盟 agentic AI 採用分析，說企業與小型企業的採用在成長，更深入的使用還有價值可挖，是 OpenAI 自己的分析，沒有給採用率。先前的觀察仍在：OpenAI 瓦解兩個利用假記者與智庫當門面的 AI 影響力行動，歸屬與成效都是單方說法；阿布達比 TII 在 Hugging Face 發表 Falcon-Emirati，模型規格與評測沒有；Sam Altman 09-23 在聯合國安理會的談話偏原則性表態；Daybreak 開放給烏克蘭政府與 Grab 東南亞技能培訓還沒有成效數字。
    next: 看 DeepMind 與 GovTech 是否公布偵測率、誤報率與部署的裝置範圍；看 OpenAI 歐盟分析的完整版有沒有公布方法、樣本與採用率，以及歐盟政策討論是否引用；看有沒有獨立研究機構公開同一批假身分的分析，對照 OpenAI 的說法；看 Falcon-Emirati 的權重是否釋出、授權條款，以及阿拉伯語方言基準上的公開評測；觀察後續是否有具體政策文件、多邊協議或聯合國層級的 AI 治理提案跟進；沿用上一輪對烏克蘭 Daybreak 成效與 Grab 完訓人數的觀察。
    lenses: []
