# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述/口吻」，是全系統唯一准 LLM 動手處：由排程 Cowork 任務（非 0-LLM 自動抓取鏈）
# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-09-30'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 這一輪新增一則：NVIDIA 官方部落格與 CoreWeave 的合作稿，稱雙方合作近十年，CoreWeave 要引進下一代 NVIDIA 基礎設施，主打代理式 AI。稿中說這套架構橫跨多代部署仍有投資報酬，出處是 NVIDIA 自己，沒有第三方數字。網址含 Vera Rubin，但摘要被截斷，新機型的上線時程與價格手上沒有。這條線的訊號仍然幾乎都來自 NVIDIA，vLLM 與 DeepMind Private AI Compute 是 09-22、09-23 的少數例外。
    next: 看 CoreWeave 公布新一代機型的上線日期與客戶名單；看後續財報裡的資本支出與折舊數字能否印證「多代部署仍有報酬」；DSX Ready 的合作廠商規模與 vLLM v0.30.0 MXFP8 KV cache 的實際精度表現，上一輪的待查項目仍然有效。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這一輪新增三則，都在 09-30。Gemini 4 Argon 是重頭：Ars Technica 的標題說 Google 宣布了新模型但使用者暫時還不能用，官方兩篇公告我們只收標題與連結，規格與跑分手上沒有。DeepMind 的 SynthID Bio 是概念驗證，替 AI 生成的蛋白質加浮水印，摘要沒給偵測率。Hugging Face 的 Open TTS Leaderboard 要評測多語言語音合成與聲音複製，方法與收錄模型未見。前一天的 GPT-6.1 Sol 仍是廠商自述的比較，沒有獨立評測數字。
    next: 看 Gemini 4 Argon 對外開放的日期，以及官方公布的基準測試與 API 定價；看 SynthID Bio 有沒有論文公布偵測率與對蛋白質功能的影響；看 Open TTS Leaderboard 的評測方法是人評還是自動指標；GPT-6.1 Sol 的獨立實測與價格是否對得上「約五分之一」的說法。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這一輪新增兩則，都是 OpenAI 自家部落格，各只有標題與一句摘要。一則說 OpenAI 中斷了一起針對受保護推理內容的蒸餾行動並強化防禦，行動規模、涉事方與手法都沒寫。另一則是與美國 SBDC 合作，替小型企業做 AI 實作訓練與在地支援，並附一份小團隊使用 AI 的報告，內容未見。兩則都沒有第二個獨立來源。09-29 的 DevDay 2026 與澳洲事件的後續仍停在上一輪的狀態。
    next: 看 OpenAI 是否公布蒸餾事件的涉事帳號數量，或調整 API 條款與用量偵測；看 SBDC 合作實際涵蓋的據點數與報告的樣本；DevDay 宣布的產品與 API 變更是否有獨立媒體或官方文件交叉證實。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 這一輪新增一則：NVIDIA 開放 2027–2028 年度研究生獎學金申請，標題載明獎助最高 6 萬美元，內容另有導師與技術支援。錄取人數、截止日與研究領域限制，摘要沒有。這是例行的人才管道動作，不含估值、募資或併購。09-28 的 OpenAI 對 Lenfest 計畫出資，以及 Anthropic 與 Infosys 的公告（內文依授權只收標題與連結）仍是這條線最近的資本訊號。
    next: 看 NVIDIA 獎學金官方頁面公布的截止日與得獎名單；Lenfest 計畫的參與機構與資金分配；讀 Anthropic 與 Infosys 原文確認合作範圍與是否涉及資金；持續留意估值、募資或併購這類實際的資本動態。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: '這一輪新增一則：OpenAI 09-29 發布 Dots，頁面標題是「Dots: Always-on agents」，主打常駐運行的代理。官方頁面授權限標題與連結，我們沒取內文，功能、價格、開放範圍都不知道，也沒有第二個來源可對照。放在這條線上，前面 Agents API 是把 Codex harness 包成雲端服務，Dots 從標題看是往「一直開著」走，但形態要看原文才能確認。'
    next: 看 Dots 是否有官方文件公布可驗證的功能與使用限制，以及獨立開發者的實測；延續前面的觀察點：Agents API 定價公布後的採用情況、NVIDIA 安全框架是否變成具體工具。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增一則。OpenAI執行長Sam Altman 09-23在聯合國安全理事會發表談話，圍繞AI安全、維持人類對AI的控制、以及國際合作三個主題，跟同一批的Academy兩週年回顧、Daybreak開放給烏克蘭政府、Grab東南亞技能培訓合起來看，OpenAI這週把政策論述的層級又拉高一階——從產業自律與區域培訓，延伸到聯合國安理會這個級別的公開露出。內容本身偏原則性表態，沒有具體承諾或可量化的政策內容，跟上一輪「論述先於落地」的觀察一致。
    next: 觀察後續是否有具體政策文件、多邊協議、或聯合國層級的AI治理提案跟進，讓這次露出從表態變成可查證的政策動作；沿用上一輪對烏克蘭Daybreak成效與Grab完訓人數的觀察。
    lenses: []
