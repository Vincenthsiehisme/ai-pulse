version: 1
updated: '2026-11-05'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 今天新增三則。NVIDIA 說模型變大、上下文變長、代理應用增加，推高 GPU 記憶體壓力，同時供給吃緊、價格上升，預期近期持續，並主張靠軟硬體協同設計提高每個位元組的效能，具體數據摘要沒給（證據不足，待補）。另一篇 NVIDIA 稱 Vera CPU 同時拿到最高吞吐與最快的代理執行，理由是代理的每一步都靠 CPU，比較對象與數字都沒有。OpenAI 發表 National Community Compact 與 Compute Campus Policy Blueprint，主張保護在地資源並創造就業，只有原則層級的說明，沒有承諾數字。11-04 Daybreak Red 上架 AWS GovCloud（US-East），核准客戶可經 Amazon Bedrock 使用 GPT-5.6 Cyber，價格沒有證據。11-02 OpenAI 的 Pando、Grid Protectors 與賞金調整都沒有金額或效能數字。
    next: 看 NVIDIA 公布的記憶體效率具體數據，以及記憶體供應商的報價走向；看第三方在代理工作負載上對 Vera 的實測，以及雲端業者的採用公告；看具體園區是否引用 OpenAI 的社區公約，以及地方政府的回應；看 AWS 是否公布 GPT-5.6 Cyber 在 Bedrock 的定價與可用區域；看 Pando 是否開源或公布吞吐與延遲；看 Grid Protectors 是否出現具名電力夥伴與可量測承諾。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 今天新增三則。Google DeepMind 發布 Gemini Omni 1.2 Flash，標題稱更快、更省、可處理更長片段，來源只允許標題與連結，規格不轉述，原文在 deepmind.google/blog/gemini-omni-12-flash-fast-and-cost-effective-with-longer-clips/。NVIDIA 在 Hugging Face 發表 Cosmos 3 開放模型，用於互動式世界模擬，證據只有一句通用介紹（證據不足，待補）。另有一篇 NVIDIA 工程師 Chris Alexiuk 的人物專訪，談開放模型，沒有技術揭露。11-03 Ai2 的 StateBench 測長文件的狀態追蹤，題數與各模型成績摘要都沒給。11-02 OpenAI 的 LifeVal 基準，出題方與受測方同為 OpenAI，鑑別度待證實。10-28 Gemini 4 Carbon 的榜首說法與外界反應不一致，官方原文只收標題與連結。更早的 Genie 4、LFM3、Mistral Large 4 等，都停在標題與一兩行說明，沒有獨立評測數字。
    next: 看 Gemini Omni 1.2 Flash 原文公布的價格與片段長度上限，以及第三方實測；看 Cosmos 3 模型卡的授權、規模與下載量；看 StateBench 的資料集與排行榜是否公開，有沒有納入非 Ai2 的模型；看 LifeVal 是否公開題目與評分程式；看 Gemini 4 Carbon 何時開放使用，以及第三方對榜首與領先幅度的驗證；看 Genie 4 是否開放試用或發布技術報告；看 Mistral Large 4 的模型卡是否公布授權與第三方基準。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 今天新增兩則。11-04 OpenAI 推出 Images 2.6，內容是更快的圖像生成、GIF 製作、更精準的編輯，以及新的 API 控制項，涵蓋 ChatGPT、Codex 與 API，速度數字與價格摘要沒給，看起來是功能迭代。11-05 NVIDIA 宣布《Hogwarts Legacy》在 GeForce NOW 取得 DLSS 5 的 3D-Guided Neural Rendering 升級，畫質說法只來自官方，與 AI 主線關聯弱。11-03 起的客戶案例有 NVIDIA 的城市實體 AI、Cisco 資安、OpenAI 的 CAD 與 PCB 設計、Heimstaden 物業管理，成效數字都沒有，全是廠商一方的說法。10-30 DeepMind 與英國政府的規劃審查合作，縮短多少沒有證據。
    next: 看 Images 2.6 的 API 定價與延遲實測，以及開發者對新控制項的回饋；看 DLSS 5 支援的遊戲數量與第三方畫質評測；看 Cisco 與 Heimstaden 是否公布量化成效；看 DeepMind 與英國政府是否公布試行範圍與處理時間的前後對照；看 Credit Saison 的 ROI 算法；看 OpenAI 下一份安全報告的時間與涵蓋指標。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 今天新增一則。Anthropic 發表〈The Long Term Benefit Trust〉，來源宣告不允許取用內文，我們只有標題與連結，不轉述內容，原文在 anthropic.com/news/the-long-term-benefit-trust，影響判斷需讀原文後補。11-04 OpenAI 宣布收購 Pierre Computer Company, Inc.，金額、條件與業務目前看不到（證據不足，待補）。11-03 與 11-02 是兩則 OpenAI 人事公告，Jill Hazelbaker 任首席企業事務長，Dan Driscoll 任國家安全現代化資深顧問，都沒有金額或合約。
    next: 讀 Long Term Benefit Trust 原文，看治理安排是否有後續公告；看 OpenAI 或 Pierre 是否公布交易金額、交割時間與團隊整併；看 OpenAI 的對外溝通是否隨新任命調整；看是否出現與政府或盟友的具體合作案；看 OpenAI 與 Orchestra Bio 是否公布交易條件。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 今天新增兩則，都是 OpenAI 的資安代理。11-05 發表 GPT‑6 Cyber，用途是找出可被利用的漏洞並開發修補，官方說訓練目標包含只在授權範圍內行動，存取條件與外部評測摘要沒給。11-04 發表自動化流程，在 Linux 核心找到、驗證並產生修補 948 個本機提權漏洞，誤報率與修補被上游採納的數量沒有。兩則都是單一來源、廠商自述。11-04 另有 Dharma-AI 的 Dharma Field Extractor，主打文件進、結構化 JSON 欄位出，證據只有標題。11-03 Hugging Face 的 Transformers 模型整合規範、DeepMind 的 Antigravity 化學資訊學展示，以及 11-02 Qodo 與 Codex 的整合，都沒有實驗或量化成效。
    next: 看 Linux 核心上游是否合併那批修補，以及 OpenAI 是否公開驗證方法與誤報率；看 GPT‑6 Cyber 的存取條件、外部評測與第三方紅隊對越權行為的測試；看 Dharma Field Extractor 是否釋出權重與公開基準；看 DeepMind 提出的分子有沒有實驗驗證；看 Qodo 是否公布 Codex 外掛的誤報率；看 OpenAI、Google 等是否宣布支援 Agent Skills 或加入 AAIF。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 今天新增一則。NVIDIA 部落格介紹 AI 代理用在外星智慧搜尋（SETI）的研究，摘要被截斷，專案、機構與技術細節都沒有證據，屬於廠商科普文。 前一輪新增的部分：Hugging Face 宣布 Project ProtoStar，目標是讓公共資助的科學資料能被 AI 使用，我們只有標題，合作單位、資料範圍與時程都沒有證據。10-28 前後：OpenAI 與波蘭 NASK 合作做 AI 安全與資安研究，沒有金額、期程或具體專案。NVIDIA 稱哈薩克的 AI 生態系正從基礎設施規劃走向部署，與黃仁勳訪問阿斯塔納同步發布公告，摘要沒有 GPU 數量或投資金額。10-22 NVIDIA 歐洲系列兩則：公部門那篇指出政府希望敏感資訊留在自己控制的基礎設施，用開放模型自行評估並套用自己的防護機制，沒有點名機關與預算；Earth-2 那篇談歐洲業者部署開放模型做天氣與氣候預測，具體部署單位被截斷。10-21 歐洲工業大廠在工程與製造流程用 CUDA-X、Omniverse、Cosmos、Nemotron，沒有點名客戶與數字。歐洲雲端夥伴擴張，夥伴名單與容量沒給。10-20 巴塞隆納 AI Factory 新創計畫仍沒有金額或配額。
    next: 看 SETI 那篇提到的研究團隊是否發表論文或公開資料集；看 ProtoStar 的首批資料集上線時間、合作機構名單與授權方式；看 OpenAI 與 NASK 公布的聯合研究或評測成果；看哈薩克方公布的機房規模、GPU 採購量與啟用時程；看有沒有具名的歐洲政府機關公開採用，以及使用的模型與語言；看 Earth-2 業者的預測準確度比較；看歐洲雲端夥伴公布的容量與客戶；看 BSC 是否公布參與新創數量與運算配額。
    lenses: []
