# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述/口吻」，是全系統唯一准 LLM 動手處：由排程 Cowork 任務（非 0-LLM 自動抓取鏈）
# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-08-26'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 這條線這一輪新增一則：vLLM 發布 v0.28.0，收錄 584 次提交、270 位貢獻者，重點是針對 Kimi-K3 的效能優化，包含 Decode Context Parallel 支援與融合 FlashKDA kernel。這是例行版本更新，跟這條線既有的「把每一塊錢算力壓低」主軸關聯不大，但持續顯示 vLLM 生態圈的開發動能與新模型的跟進速度。既有主軸不變：OpenAI 公布自研推論晶片 Jalapeño 的第一批結果，宣稱吞吐量更高、延遲更低、更省電，但沒有跟現有商用晶片的直接效能對比；訊號幾乎全來自 NVIDIA 一家，圍繞 agent 工作負載比一般查詢貴、要換更省電更開放的基礎設施；Vera Rubin NVL72 每瓦工作量提升 30 倍、Groq 3 LPX 全面量產、NVLink Fusion 接第三方 XPU 這三則的效率倍數與整合細節都還只有官方說法；OpenAI 持續在美國多州把資料中心投資跟社區關係、地方政策綁在一起發布。
    next: Kimi-K3 在 vLLM 上的實測效能數字，或下一個 minor 版本是否有更大幅度的架構調整。其餘沿用既有訊號：OpenAI 是否公布 Jalapeño 與現有商用晶片的直接效能或成本對比，或量產與部署時程；NVIDIA 有沒有補上可驗證的每瓦效能第三方基準測試、Groq 3 LPX 與 Vera Rubin 具體怎麼整合、有沒有實際第三方 XPU 廠商透過 NVLink Fusion 出貨；Dharma-AI 那則 33 個百分點的數字是否補上方法細節；PORTS-Pike 專案是否有俄亥俄州當地媒體或官方獨立報導佐證就業數字。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這條線這一輪新增一則。Hugging Face 發部落格教學，講怎麼用 Sentence Transformers 訓練與微調多向量（multi-vector）嵌入模型；不過來源摘要只帶到 Hugging Face 官方部落格的固定簡介文字，沒有文章本身的技術內容可看，跟這條線既有的「小而專、成本導向」走向沒有直接關聯，比較像是嵌入模型訓練工具鏈的補齊。既有主軸不變：IBM Granite 4.2 與 Multiverse Computing 的量化方法都還停在廠商自己的一句話宣稱，沒有第三方或跨模型驗證；模型往小而專走（Gemini 3.7 Flash、Nemotron 3.5 Lightning、LFM2.5 系列端側模型），效率端敘事持續累積（GPT-5.6 把賣點從更強移到更省），Anthropic 那兩則安全公告仍只留標題。
    next: 這篇教學實際涵蓋的訓練細節與效能比較要看原文才知道，值不值得放進主線敘事還得看內容補上來之後。其餘沿用既有訊號：Multiverse Computing「4-bit 打贏全精度」的宣稱有沒有第三方在其他模型或任務上重現；IBM Granite 4.2 是否補上可對照的 benchmark 分數或架構論文；Anthropic 那兩則安全公告的正文我們選擇不轉述，只能盯原文連結有沒有被第三方引用；LFM2.5-DSpark 宣稱的 3.2 倍推論加速有沒有獨立測試；GPT-5.6 每 token 成本要對前代與對手；ARC-AGI-3 三倍分數看是否有第三方複現。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這條線這一輪新增兩則，都是 OpenAI 同一天發的稿：Admin plugin 幫 ChatGPT Work 與 Codex 補後台管理，讓管理者能分析工作區使用量、管理成員與權限、調整額度；同一天的客戶案例則說旅遊業者 loveholidays 靠 Codex 讓非工程背景的員工也能參與軟體開發。兩則放在一起看，是「擴大誰能用」跟「管理者管不管得住」同時出現，跟這條線既有的「能力已經做得到，看怎麼真的用上」走向同一個方向，只是這次兩件事同一天一起發。既有主軸不變：GPT-5.6 進 Kiro 主打價格效能比，沒有具體定價數字；NVIDIA 在 Gamescom 的 RTX 遊戲陣容宣傳屬消費顯卡業務，跟 AI 產業核心進展關聯不大；Stampli 那兩篇官方案例仍沒有第三方驗證；GeForce NOW 開放 Firefox 補的是安裝權限這道門檻；OpenAI 重申零資料留存並預告 Private Safety Processing，技術細節未交代；xAI 的《Grok 4.6 Amazon Bedrock》站方政策不開放內文。
    next: OpenAI 是否會把 Admin plugin 這類管理功能擴展到更多產品線，或揭露企業客戶的實際採用數字；loveholidays 或其他企業是否公開具體的採用數字，或有獨立媒體報導佐證「非工程師也能用 Codex」的說法。其餘沿用既有訊號：Kiro 或 OpenAI 是否公布 GPT-5.6 相較前代的具體定價或 token 成本差異；NVIDIA RTX Spark 這批遊戲上市後的實測評價；Stampli 案例有沒有客戶方自己或第三方獨立證實六十八個百分點；Private Safety Processing 有沒有公布技術細節；ChatGPT Ads 擴到歐洲後歐盟監理機關是否展開審查；Grok 4.6 Amazon Bedrock 等原文能取用時再確認實際形式。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 這條線這一輪新增一則：OpenAI 財務長 Sarah Friar 發文說明晶片、運算、模型與產品四層進展會彼此疊加，讓 OpenAI 能以更大規模、更低成本提供智慧服務，但沒有給出具體的成本曲線或數字。由財務長出面談整條技術堆疊，訴求對象比較像投資人與合作夥伴，跟這條線既有的「找金融背景的人補強公司架構」走向呼應，只是這次是敘事層面，不是人事或資金動作。既有主軸不變：OpenAI 任命 Dali Rajic 為首席營收長；NVIDIA 找上六家資產管理與投行建融資平台，目標動員逾 5,000 億美元第三方資本，目前只是宣布合作平台；OpenAI 在 ChatGPT 測試廣告，作為支撐免費版的營收來源；Google 的 Genesis Mission 用 4,000 萬美元的 token 與額度綁科研；OpenAI 董事會補進 David Vélez 與 Robin Vince；OpenAI 公開反駁 Apple 的訴訟；Anthropic 那則以「Tino Cuellar」為題的消息內容仍證據不足。
    next: OpenAI 後續是否用具體定價下修或財報數字佐證這篇談的成本下降。其餘沿用既有訊號：Dali Rajic 上任後 OpenAI 的營收策略有沒有具體調整；NVIDIA 的融資平台有沒有第一筆實際資金到位；廣告測試看擴大速度與是否影響回答中立性；有沒有第二筆「算力當資本」的同類案例；OpenAI 董事變動後有沒有大型融資或財務揭露對得上；Apple 訴訟看 Apple 回應與法院動作；Tino Cuellar 那則等抓到內文再判斷是不是治理或人事訊號。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這條線這一輪新增一則：Hugging Face 在部落格介紹 Gradio 的 AI workflow 功能，說明如何串接、執行並部署 AI 工作流程，但摘要只有標題等級的資訊，看不出是全新功能還是既有能力的整理說明。這是這條線第一次出現 Hugging Face 自家工具的訊號，之前的素材集中在 OpenAI（Codex／GPT-5.6 落地）、xAI（Grok Build）與少數平台整合（Amazon、微軟、NVIDIA）。既有主軸不變：xAI 的 Grok Build 上一輪開放給所有使用者，站方政策不開放內文，實際功能仍待原文確認；Replit Free Mode 與 Asana 用 Codex 兩週做完五年工程量仍是這條線裡少數帶了具體金額的案例；部署端 OpenAI 用 Presence 做企業客服 agent 平台、微軟開源 Orchard；治理端 Open Secure AI Alliance 的 SAFE 準則還在提案階段。
    next: Gradio 這篇看官方文件有沒有補上對應的版本號或 API，判斷是新功能還是既有能力的重新包裝。其餘沿用既有訊號：xAI 的 Grok Build 開放有沒有第三方或使用者實測貼出具體功能範圍；Replit Free Mode 是否設有隱藏的速率限制；Asana 案例是否有第三方或 Asana 自己揭露這次重構的實際範圍；GitHub Copilot 官方文件有沒有列出 Grok 4.6 為可選模型；Amazon 的 Strands Agents 整合有沒有實際機器人團隊公開採用；部署端看 Orchard 有沒有微軟以外的採用、Presence 有沒有具名客戶；治理端看 SAFE 準則會不會收斂成正式規範。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這條線這一輪新增四則。OpenAI 表示已封鎖一批源自俄羅斯的帳號，這些帳號用 AI 生成內容冒充一個以色列智庫身分，並推廣一份吹捧俄羅斯、批評西方的「主權指數」，具體規模這篇沒有給。Anthropic 同一天發了三則公告：《Economic Futures Research Fund Agenda》《Economic Futures Uk Europe》《Wellbeing Research Grants》，這三則我們的來源政策都只留標題與連結，看標題是研究基金議程、基金在英國歐洲的落地、以及一批福祉研究補助，內容細節要看原文才知道。這是這條線第一次出現 Anthropic 的訊號，跟既有的 OpenAI 一系列教育、政策、國安公共領域布局（AI Futures 專欄、國安民主監督計畫、CodeAI 教育合作、政策構想資助）放在一起看，是同一種把影響力擴散到非產品面公共領域的訊號，只是這次換 Anthropic 用資助研究的形式做；OpenAI 這次反而是資安執法動作，跟先前的公共領域布局性質不同。既有主軸不變：這幾週集中出現的公告全部停在宣布層級，沒有一則附上具體的執行細節或第三方查證。
    next: OpenAI 封鎖的這批帳號規模、觸及人數，是否有獨立研究單位交叉驗證。Anthropic 這三則的研究基金規模、資助對象或審核標準是否在原文或後續公告中補上。其餘沿用既有訊號：AI Futures 系列接下來會放哪些具體文章；國安民主監督計畫是否有政府機構具名參與；CodeAI 合作的具體課程內容或覆蓋規模；OpenAI 資助的十四個政策研究專案具體名單與成果何時公布；印尼 AI 中心、NSF AI 中心計畫、APA 合作案這幾則是否有更具體的執行細節公布。
    lenses: []
