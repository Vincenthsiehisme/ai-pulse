# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述/口吻」，是全系統唯一准 LLM 動手處：由排程 Cowork 任務（非 0-LLM 自動抓取鏈）
# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-10-05'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 今天新增一則：vLLM 發布 v0.31.0，717 個 commit、307 位貢獻者，亮點第一條是 DeepSeek-V4.1-Flash 的效能，FlashMLA mega attention 搭配 NVFP4 壓縮 KV cache 成為 SM100 的預設路徑。改動編號可在 release 頁面核對，但頁面沒有附吞吐或延遲對照。這是這條線少見的非 NVIDIA 訊號。10-02 的 DGX Spark 64GB 版與 10-01 的每兆瓦約 6,000 萬美元，仍是 NVIDIA 單一來源的官方說法，沒有第三方數字。
    next: 看 vLLM 或社群是否公布 DeepSeek-V4.1-Flash 在 SM100 上新舊預設路徑的吞吐與延遲對照；看 NVIDIA 公布 DGX Spark 64GB 版的定價與開賣日，以及第三方的本機推論實測；看其他業者公布的每兆瓦成本是否落在同一量級；看 CoreWeave 新一代機型的上線日期與客戶名單。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 今天新增一則：Ai2 在 Hugging Face 開源 AstaBrief，標題說它是 Asta 裡的快速報告生成模型。來源摘要只有一句，模型大小、授權與評測都沒寫。10-01 的 Olmo-core 3 同樣只有標題與一句話，Ai2 連兩天在這條線上出現，但我們都沒拿到內文。09-30 的 Gemini 4 Argon 仍只有媒體說還不能用，官方兩篇我們只收標題與連結；SynthID Bio 是蛋白質浮水印的概念驗證，沒給偵測率；Open TTS Leaderboard 的評測方法未見。09-29 的 GPT-6.1 Sol 仍是廠商自述的比較，沒有獨立評測數字。
    next: 看 AstaBrief 的模型卡有沒有列出授權、參數量與評測數字；看 Olmo-core 3 的原文或程式碼庫有沒有給出支援的 MoE 規模與訓練效率；看 Gemini 4 Argon 對外開放的日期與官方基準測試；看 SynthID Bio 有沒有論文公布偵測率；GPT-6.1 Sol 的獨立實測與價格是否對得上「約五分之一」的說法。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 今天新增兩則。OpenAI 宣布 ChatGPT 推出新的視覺化廣告格式，並擴充成效衡量、歸因合作夥伴與品牌適用性工具，證據只有官方一句摘要，格式長相與開放範圍都沒有。NVIDIA 部落格以乳癌篩檢到治療規劃為題，介紹旗下 AI 新創，是廠商案例文章，沒有臨床成效數字。10-02 的 Chatham Financial 案例稱交易驗證從 30 分鐘壓到 4 分鐘以內，10-01 的 The Den 稱每週省 10 到 15 小時，這些數字都是 OpenAI 自己發的。Claude Frontier Academy 與 Barclays 兩則依授權只收標題與連結，內容請讀原文。
    next: 看 OpenAI 是否公布新廣告格式的開放範圍與第一批歸因合作夥伴；看 NVIDIA 那篇提到的新創有沒有公開臨床驗證或監管核可資料；看 Chatham 是否補上驗證準確率與人工覆核比例；看 The Den 之外有沒有第三方客戶給出同類數字；看 Albertsons 與 Barclays 是否揭露部署範圍。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 這一輪新增一則：OpenAI 發表〈Our approach to EU text provenance rules〉，談它對歐盟文字來源標示規則的做法。這個來源的授權只允許標題加連結，所以我們沒有取內文，也不轉述內容，細節請讀原文。它放在這條線，只是因為涉及合規與公司對外立場，不含估值、募資或併購。09-30 的 NVIDIA 研究生獎學金（最高 6 萬美元）與 09-28 的 OpenAI 對 Lenfest 計畫出資 500 萬美元，仍是這條線最近的資金類訊號。
    next: 讀 OpenAI 歐盟文字來源標示那篇原文，確認它講的規則與時程，並看是否有其他來源或監管機關佐證；看 Lenfest 計畫的參與機構與資金分配；讀 Anthropic 與 Infosys 原文確認合作範圍與是否涉及資金；持續留意估值、募資或併購這類實際的資本動態。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 今天新增一則：ServiceNow-AI 在 Hugging Face 發表 AutoSynthData，標題指向替企業 agent 生成訓練資料。來源摘要只有「一篇部落格文章」這一句，方法、資料規模與評測都沒有，只能確定有人在處理企業場景缺訓練資料的問題。09-29 OpenAI 的 Dots（標題為常駐型代理）仍只有標題與連結，功能、價格與開放範圍不明。09-28 的 Holo4 是 H company 的通用電腦操作 agent，同樣是單一來源。
    next: 看 AutoSynthData 有沒有同步釋出資料集、程式碼或基準測試，並被其他團隊引用；看 Dots 是否有官方文件公布可驗證的功能與使用限制；看 Holo4 有沒有第三方的電腦操作評測；延續前面的觀察點：Agents API 定價公布後的採用情況、NVIDIA 安全框架是否變成具體工具。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增一則。OpenAI執行長Sam Altman 09-23在聯合國安全理事會發表談話，圍繞AI安全、維持人類對AI的控制、以及國際合作三個主題，跟同一批的Academy兩週年回顧、Daybreak開放給烏克蘭政府、Grab東南亞技能培訓合起來看，OpenAI這週把政策論述的層級又拉高一階——從產業自律與區域培訓，延伸到聯合國安理會這個級別的公開露出。內容本身偏原則性表態，沒有具體承諾或可量化的政策內容，跟上一輪「論述先於落地」的觀察一致。
    next: 觀察後續是否有具體政策文件、多邊協議、或聯合國層級的AI治理提案跟進，讓這次露出從表態變成可查證的政策動作；沿用上一輪對烏克蘭Daybreak成效與Grab完訓人數的觀察。
    lenses: []
