# 這一層是「敘述/口吻」，是全系統唯一准 LLM 動手處：由排程 Cowork 任務（非 0-LLM 自動抓取鏈）
# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-09-01'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 這條線這一輪新增一則：Hugging Face 發布 @huggingface/kernels，提供超過兩百個 WebGPU 運算核心，目標是讓模型能在瀏覽器等本地端環境跑推論，但來源摘要本身只是網站通用標語，沒有更多技術細節，只能靠標題確認核心規模與定位。這是這條線第一次出現瀏覽器端本地推論的訊號，跟既有「把每一塊錢算力壓低」的主軸方向一致，只是切入點從資料中心的晶片效率換成了終端裝置的推論成本。既有主軸不變：Model Hardware Standard 的規格範圍仍看不到；NVIDIA Vera CPU 出貨沒有出貨量或客戶名單這類可查證的數字；vLLM v0.28.0 針對 Kimi-K3 的效能優化屬例行版本更新；OpenAI 自研推論晶片 Jalapeño 的第一批結果沒有跟現有商用晶片的直接效能對比；Vera Rubin NVL72 每瓦工作量提升 30 倍、Groq 3 LPX 全面量產、NVLink Fusion 接第三方 XPU 這三則的效率倍數與整合細節都還只有官方說法。
    next: '@huggingface/kernels 是否被 transformers.js 或其他瀏覽器推論框架採用為預設後端，能檢驗它是不是真的補上開發者要自己寫 WebGPU shader 的成本。其餘沿用既有訊號：Model Hardware Standard 的技術規格是否公開，以及是否有硬體廠商公開表態採用；Vera CPU 首批客戶名單與實際出貨量是否公布；Kimi-K3 在 vLLM 上的實測效能數字；OpenAI 是否公布 Jalapeño 與現有商用晶片的直接效能或成本對比；NVIDIA 有沒有補上可驗證的每瓦效能第三方基準測試、Groq 3 LPX 與 Vera Rubin 具體怎麼整合、有沒有實際第三方 XPU 廠商透過 NVLink Fusion 出貨。'
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這條線這一輪新增兩則，都只留標題：Anthropic《Improving Alignment Security Efforts》談對齊安全工作的改善，xAI《Biosafety At The Frontier》談生物安全防護，兩份來源都只開放標題與連結，實際做了什麼、有沒有具體測試數字看不到。這兩則都是既有安全工作的迭代說明，不是新模型或新能力發表，跟這條線「小而專、成本導向」的模型迭代主軸沒有直接關聯，單純是安全揭露這條支線又多了兩筆。既有主軸不變：Open ASR Leaderboard 新增的語言與分數仍未公布；Gemini Omni 1.1 Flash 強調更多建構控制權，具體新增了哪些控制項仍看不到；Hugging Face 那篇多向量嵌入模型教學的技術內容仍未補上；IBM Granite 4.2 與 Multiverse Computing 的量化方法都還停在廠商自己的一句話宣稱；模型往小而專走的訊號持續累積（Gemini 3.7 Flash、Nemotron 3.5 Lightning、LFM2.5 系列端側模型），GPT-5.6 把賣點從更強移到更省。
    next: Anthropic 與 xAI 這兩則安全公告的原文是否公布具體的紅隊測試方法、量化結果或第三方稽核，而不只是政策聲明。其餘沿用既有訊號：Open ASR Leaderboard 新增的語言到底是哪一個、有沒有模型跑出分數；Gemini Omni 1.1 Flash 實際新增的控制項與功能清單是否公開；Hugging Face 那篇教學實際涵蓋的訓練細節與效能比較；Multiverse Computing「4-bit 打贏全精度」的宣稱有沒有第三方在其他模型或任務上重現；IBM Granite 4.2 是否補上可對照的 benchmark 分數或架構論文；LFM2.5-DSpark 宣稱的 3.2 倍推論加速有沒有獨立測試；GPT-5.6 每 token 成本要對前代與對手；ARC-AGI-3 三倍分數看是否有第三方複現。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這條線這一輪新增三則：Anthropic 又發了兩則產品公告——《Enterprise Frontier Safeguards》與《Claude Text Watermark》，同樣只留標題與連結，延續這批公告內容密度低的模式；OpenAI 則宣布 ChatGPT 現在可以串接醫療機構的電子病歷與其他產業資料，讓臨床人員能在對話中存取病患背景資訊，這篇有具體內容，但沒有講清楚誰簽署合規協議、資料留存規則怎麼定。跟這條線既有的「能力已經做得到，看怎麼真的用上」走向一致，只是 Anthropic 那批只留標題的公告又多了兩筆，OpenAI 這次選的垂直領域換成了醫療。既有主軸不變：Anthropic 教育與科學那批公告是否會補上具體功能、定價或客戶採用數字；ChatGPT for Teachers 擴大到 55 個美國學區、批判性思考隨機對照研究、學習持續性報告這三篇都附上具體數字或研究設計；NVIDIA 在 Gamescom 公布 GeForce NOW 新增 DLSS 4.5；xAI 的 Grok Bot 與 Grok 4.6 上架 Microsoft Foundry 兩則同樣只留標題。
    next: Anthropic 這兩則新公告是否會補上具體功能規格；ChatGPT 醫療資料串接是否補上合規細節說明，以及是否有具名醫療機構公開宣布已經串接使用。其餘沿用既有訊號：Anthropic 教育與科學那批公告是否會補上具體功能、定價或客戶採用數字，讓讀者判斷這是真的產品擴張還是批次公關發布；OpenAI 是否會把 Admin plugin 這類管理功能擴展到更多產品線，或揭露企業客戶的實際採用數字；loveholidays 或其他企業是否公開具體的採用數字；GPT-5.6 進 Kiro 是否補上具體定價；Stampli 案例有沒有客戶方自己或第三方獨立證實；Grok 4.6 Amazon Bedrock 與 Microsoft Foundry 這兩則原文能取用時再確認實際形式。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 這條線這一輪新增一則：OpenAI 公布 ChatGPT 內建廣告業務的年化營收站上十億美元，同步把服務擴大到更多市場，這是這條線第一則附上具體營收數字的資本訊號，比起 Cursor 合約終止那則的因果動作，這次是直接拿出財務數字。跟這條線既有的「找金融背景的人補強公司架構」走向不完全同方向，更像是 OpenAI 開始願意揭露變現管道的實際規模，只是這個數字比起 OpenAI 傳出的整體營收只是零頭。既有主軸不變：Cursor 遭 SpaceX 收購後 OpenAI 終止供模型合約，是這條線少數寫得出明確因果的資本／公司邊界動作；Anthropic 跟蓋茲基金會、艾倫研究所與霍華休斯醫學研究所、SK 電訊、埃森哲與 AWS、Google Cloud 的五則合作公告全部只留標題；OpenAI 財務長談晶片、算力、模型、產品四層進展彼此疊加，沒有具體成本曲線；OpenAI 任命 Dali Rajic 為首席營收長；NVIDIA 找六家資產管理與投行建融資平台，目標動員逾 5,000 億美元第三方資本；Google 的 Genesis Mission 用 4,000 萬美元的 token 與額度綁科研；OpenAI 董事會補進 David Vélez 與 Robin Vince；OpenAI 公開反駁 Apple 的訴訟。
    next: OpenAI 是否揭露廣告在總營收裡的占比、以及是否有用戶回報廣告內容影響到 ChatGPT 的回答傾向。其餘沿用既有訊號：Cursor 後續是否公開說明替代的模型供應方案，以及其他仰賴 OpenAI 模型的編碼工具是否也重新檢視合約條款；這五則夥伴關係公告是否會補上合作金額、具體項目或執行時程；Dali Rajic 上任後 OpenAI 的營收策略有沒有具體調整；NVIDIA 的融資平台有沒有第一筆實際資金到位；OpenAI 董事變動後有沒有大型融資或財務揭露對得上；Apple 訴訟看 Apple 回應與法院動作。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這條線這一輪新增兩則：Google DeepMind 發布《Introducing agentic video understanding with Gemini》，只留標題與連結，沒有寫清楚具體是哪種自主分析能力；OpenAI 則整理 Basis、Clay、Exa Labs 三家公司用 agent 改善新人上手、帳戶管理與開發者整合流程的案例，這篇有具體內容，但案例是 OpenAI 自己篩選發布，篩選角度必然偏向對自家產品有利的成功故事。兩則放在一起，一則是能力端的新公告、一則是應用端的案例整理，都在延續這條線「能力做出來、看誰真的把它嵌進工作流程」的走向。既有主軸不變：Gradio 那篇 AI workflow 功能是新功能還是既有能力整理仍待確認；xAI 的 Grok Build 開放後實際功能範圍仍待原文確認；Replit Free Mode 與 Asana 用 Codex 兩週做完五年工程量仍是這條線裡少數帶了具體金額的案例；部署端 OpenAI 用 Presence 做企業客服 agent 平台、微軟開源 Orchard；治理端 Open Secure AI Alliance 的 SAFE 準則還在提案階段。
    next: DeepMind 這則 agentic video 公告的原文是否附上具體評測數據或使用案例，能否驗證「主動式」不是行銷用詞；OpenAI 這三家案例公司是否自己發布更詳細的技術落地細節或量化成效數字。其餘沿用既有訊號：Gradio 這篇看官方文件有沒有補上對應的版本號或 API；xAI 的 Grok Build 開放有沒有第三方或使用者實測貼出具體功能範圍；Replit Free Mode 是否設有隱藏的速率限制；Asana 案例是否有第三方或 Asana 自己揭露這次重構的實際範圍；GitHub Copilot 官方文件有沒有列出 Grok 4.6 為可選模型；Amazon 的 Strands Agents 整合有沒有實際機器人團隊公開採用；部署端看 Orchard 有沒有微軟以外的採用、Presence 有沒有具名客戶；治理端看 SAFE 準則會不會收斂成正式規範。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這條線這一輪新增兩則：OpenAI 發布聲明支持加州 SB 1119，內容是為青少年使用 AI 產品訂出分齡防護規範，同時公布日本新創公司 Polimill 採用其 GPT 模型與 Codex，協助日本地方政府檢索行政知識、加快系統開發。前者是政策表態，後者是靠在地新創當中間層滲透公部門市場的案例，兩則都延續這條線「把影響力擴散到非產品面公共領域」的走向，只是這次一個是監管關係經營、一個是市場滲透。既有主軸不變：泰國八週加速器結業後 10 家新創是否公開產品成果仍待確認；Anthropic 過去幾天內至少十一則公告集中在教育與治理兩個主題，跟盧安達政府的 AI 教育合作與 MOU、跟 Teach For All 的合作、跟冰島的國家級 AI 教育試點、跟 CodePath 的合作，加上使用政策更新、偵測反制 Claude 遭惡意使用的報告，沒有一則附上原文；OpenAI 發布 Hugging Face 資安事件的調查說明與擴大巴西市場布局，內容都附上具體說明。
    next: SB 1119 是否通過表決、以及 OpenAI 屆時公布的年齡驗證機制長什麼樣子；Polimill 是否公布實際採用的地方政府數量、或使用後的效率提升數據。其餘沿用既有訊號：泰國加速器結業後這 10 家新創是否公開產品成果或拿到後續融資；盧安達與冰島這兩則國家級教育合作的具體規模是否會補上；Detecting And Countering Malicious Uses Of Claude 這篇報告的具體案例內容是否釋出；OpenAI 封鎖的俄羅斯帳號規模、觸及人數，是否有獨立研究單位交叉驗證；Anthropic 那三則經濟未來與福祉研究補助的資助對象或審核標準是否補上；AI Futures 系列接下來會放哪些具體文章；國安民主監督計畫是否有政府機構具名參與；CodeAI 合作的具體課程內容或覆蓋規模；OpenAI 資助的十四個政策研究專案具體名單與成果何時公布。
    lenses: []
