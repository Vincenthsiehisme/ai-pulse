# narratives.yaml —— 每條主線的編輯性敘事層（thesis / now / next + 決策鏡）。
# 這一層是「敘述/口吻」，是全系統唯一准 LLM 動手處：由排程 Cowork 任務（非 0-LLM 自動抓取鏈）
# 依 speak-human-tw 重寫，且夾在兩道確定性關卡之間——prep 用事件簽章變化決定「哪條要重寫」（不由 LLM 判斷），
# apply 過 voice_clean 機械清理、不新增語意。thesis、lenses 不由此流程動。
version: 1
updated: '2026-09-22'
tracks:
  infra-cost:
    thesis: 本週這條線的訊號幾乎全來自 NVIDIA 一家——主軸是把 agent 與後訓練時代的『每一塊錢算力』壓低，並從資料中心往機器人、邊緣、實體模擬延伸。
    now: 這一輪新增一則：NVIDIA 發布「DSX Ready」計畫，替 AI 工廠所需的電力與散熱產品做資格認證，主張建置者要選對跟整體工廠設計相容的產品，才能把算力真正轉成有用的運算產出。上一輪這條線把壓低每一塊錢算力拆成電網協調（AEMA 聯盟）與效能基準（Vera Rubin NVL72 的 MLPerf 成績）兩條腿；這一則補上第三條腿，供應鏈端的產品認證，把怎麼選電源與散熱設備變成有規格可循的事，跟先前的電網示範、效能基準一樣，都是把「每一塊錢算力」這個抽象目標拆成可以具體執行的動作。
    next: 觀察有哪些電源與散熱廠商實際拿到 DSX Ready 認證、認證規格是否對外公開，以及是否跟 AEMA 聯盟或 MLPerf 基準這兩條線有具體串接；同時持續追蹤 AEMA 成員擴張與 MLPerf 完整榜單對比。
    lenses:
    - role: 經營者
      question: 算力成本下降會改變我哪個經營控制點？
      answer: 若後訓練／推論單價真的下降，agent 類產品的毛利假設要重算；但現在只有 NVIDIA 自述，先別把成本曲線寫進財測。
      watch: 獨立部署者的實測成本，而非發布稿數字。
    - role: 投資人
      question: 這是硬體週期，還是敘事擴張？
      answer: NVIDIA 把 CPU、機器人、實體模擬全講成 agent 基礎設施，是在放大 TAM 敘事；這條線目前每一則事件都只掛得住單一來源，還沒有第二個獨立聲音跟上。傳播熱度這一項現在量不到（社群訊號沒接線，所有事件的 heat 都是未量測），所以「這批訊號很冷」講不出口——講得出口的只有「沒有人轉述」。
      watch: 對手（AMD、雲自研晶片）是否跟進同樣的定價語言。
    - role: 技術主管
      question: 要不要現在押 Jetson Thor 或 Nemotron？
      answer: Nemotron 綁 LangChain 主打接近閉源、成本更低，對自建 agent 有吸引力，但 benchmark 由廠商自測；先在非關鍵路徑做 POC，別換主力。
      watch: 第三方 harness 的複現結果。
  model-research:
    thesis: 訊號集中在 Google DeepMind 的 Gemini Flash 輕量線快速分化，NVIDIA Nemotron 從另一端逼近——主軸是『小而專、成本導向』的模型迭代，而非追單一最強模型。
    now: 這一輪新增三則，同樣不是模型發布本身。OpenAI 成立「數學與人工智慧諮詢小組」，內容因授權限制我們只留標題與連結；Multiverse Computing 在 Hugging Face 發文，把 LLM 剪枝問題改寫成物理學的 Ising 最佳化問題來求解；Hugging Face 自家的 tokenizers 函式庫則推上 v1，強調做過編碼、解碼與規模化的量測。三則合起來看，重點都落在把既有模型或既有工具做得更精簡、更可驗證，跟先前 OpenAI 失準通報框架、Anthropic 生命科學驗證計畫一樣，是治理與效率工具層的動作，不是新模型本身；跟既有「小而專、成本導向」的模型迭代主軸沾得上邊（剪枝、tokenizer 效能都指向省算力），但主角換成了研究方法與基礎工具，不是模型版本迭代，主軸判斷維持不變。
    next: 查 OpenAI 數學諮詢小組原文的成員與職掌；查 Multiverse Computing 剪枝方法的實際壓縮率與 benchmark 數字，看是否比既有剪枝方法更有效；查 tokenizers v1 的量測數字，以及是否伴隨破壞性 API 變更。三者都要等原文或後續數據才能判斷是否真的支撐「小而專」這條主軸，還是各自獨立的技術動作。
    lenses:
    - role: 產品
      question: 該選哪個輕量模型接進產品？
      answer: Flash 線切得細代表要按任務挑（Cyber 找漏洞、Lite 省成本），別預設一個通吃；Nemotron 若複現成立可當 self-host 選項。
      watch: 各變體的實際延遲與成本對照。
    - role: 技術主管
      question: 命名分化要不要跟？
      answer: 先看每個變體的真實能力邊界再決定綁定，避免被廠商的命名節奏牽著走。
      watch: 獨立評測是否支持廠商宣稱的定位差異。
  product-market:
    thesis: 本週產品訊號都是 Google DeepMind 把 Gemini 能力『接進具體產品入口』——資安（Flash Cyber 找修漏洞）與即時語音翻譯（接進 Meet、翻譯、AI Studio）。主軸是能力落地成可用功能，而非發表新模型。
    now: 這一輪新增三則。NVIDIA 這邊兩則都是案例集錦：一則引用 ABI Research、Omdia 的產業預測數字，主張實體 AI（自駕車、工業機器人）大規模部署必須把安全做進每一層；另一則在紐約氣候週點名五家用 NVIDIA AI 做清潔能源的公司，但摘要在列出名單前被截斷，看不到具體案例。OpenAI 這邊則是擴大 OpenAI Academy，新增針對員工、開發者、教育者等不同身分的學習路徑，屬於教育與技能產品，不是模型落地案例。三則都不是 Google DeepMind「接產品入口」那條主軸的延伸，也不是先前 OpenAI 用具名客戶（Hex、Cooley、Legora）證明模型能落地賺錢的同一種案例——這一輪反而是 NVIDIA 用集錦式報導鋪陳規模敘事、OpenAI 往教育端補位，Google DeepMind 這條主軸連續第二輪沒有新訊號補上。
    next: 查 NVIDIA 清潔能源那五家公司的具體名單與應用內容，判斷是既有客戶重複曝光還是新簽約案例；查實體 AI 安全主張是否有具體認證機制（同樣可跟 DSX Ready 對照）；留意 OpenAI Academy 是否有企業或教育機構公開採用的數據；同時持續等 Google DeepMind「能力接產品入口」這條主軸下一次有沒有新訊號進來。
    lenses:
    - role: 經營者
      question: 這會不會動到我的產品入口？
      answer: 即時翻譯進 Meet、資安模型自動找修漏洞，都是把 AI 塞進既有工作流的入口；若你在同賽道，威脅是入口被綁定而非模型落後。
      watch: 採用數據與第三方評測。
    - role: 投資人
      question: 發布稿，還是真需求？
      answer: 目前只有官方發布、無採用數字，而且每一則都是單一來源；傳播熱度量不到（社群訊號沒接線），所以只能說「沒有第二個聲音」，不能說「熱度低」。當市場驗證訊號看，別當商業拐點。
      watch: 第二季後的留存或採用揭露。
  capital-evolution:
    thesis: 唯一一則資本訊號是 Google 以 4,000 萬美元 token 與額度綁 Genesis Mission——象徵意義大於金額，代表雲廠開始用『算力額度』而非現金當投資工具。
    now: 這條線上一輪已經涵蓋 Genesis Mission、500 億美元基礎設施投資、微軟／NVIDIA 三方合作、收購 Bun 與 Claude Code 十億美元里程碑等大額資本訊號，這一輪新增五則，規模更直接觸及公司估值本身：Anthropic 完成新一輪 Series F 募資，投後估值來到 1,830 億美元，同一批公告裡還有 Rahul Patil 加入公司、企業業務的 Managing Director 人事任命 Chris Ciauri（完整職稱在我們手上的紀錄裡被截斷）、消費者服務條款更新、以及未支援地區銷售限制的調整，五則全部只留標題與連結，無法從標題本身判斷 Series F 相對上一輪的漲幅、也看不出兩位人事任命各自對應的組織調整規模。把募資與人事擴編放在同一天發布，跟上一輪 500 億美元基礎設施投資、Genesis Mission 加入的節奏連在一起看，這條線目前呈現的是資本到位（估值墊高）與組織擴編（人事、企業業務布局）同步發生的模式。
    next: 留意 Series F 的投資人名單是否揭露、這輪估值與 OpenAI 等競爭對手最新估值的相對位置；也留意《Confidential Draft S1 SEC》這則先前提到的疑似機密 IPO 申報，原文內容是否進一步被證實或澄清。
    lenses:
    - role: 投資人
      question: 算力額度當投資，意味什麼？
      answer: 雲廠用額度綁生態、鎖定未來用量，成本低於現金投資；但目前只有單一案例，先當觀察點。
      watch: 其他雲廠是否跟進同樣的形式。
  agent-refactor:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增兩則。NVIDIA 發文主張 AI 安全該做成工程紀律，明確要求安全需求、可執行的控管機制、指定負責人，以及能證明防護確實有效的證據，範圍明講是整個 agent stack 的每一層；同一批稿裡另一則是 OpenAI 客戶案例，V7 用 GPT-5.6 把企業內部散落的檔案整理成 agent 可調用的上下文，讓 agent 完成的工作能回溯連到原始出處。上一輪這條線在講 agent 怎麼被產品化與驗證（Agents API、Devin 自我測試），這一輪加進來的兩則往前後各補了一塊：V7 補的是 agent 要能用、得先有記憶這個產品層的缺口；NVIDIA 補的是 agent 一旦真的動手做事、安全誰來把關這個治理層的呼籲，兩者都還沒有具體的驗證數字或機制細節，維持這條線目前治理層只給呼籲、產品層給案例但缺乏量化成效的落差格局。
    next: 留意 NVIDIA 這套安全工程主張是否具體落成產品或認證機制，可跟同一批稿裡 DSX Ready 那種做法對照；留意 V7 案例是否有導入規模或成效數字補上，或是否有其他企業跟進用類似方式解決 agent 記憶問題；持續追蹤 Agents API 定價與 Devin 自我測試通過率是否有第三方數字佐證。
    lenses: []
  global-map:
    thesis: 尚無足夠已發布事件可支撐判斷——等抓取鏈在這條主線收斂出事件後補上。
    now: 這一輪新增兩則。OpenAI 這次不是像上一輪的澳洲青少年安全藍圖鎖定單一法域，而是直接發文呼籲各國協調出一套共同的 AI 評測、通報與治理標準，把政策論述從區域級拉高到全球級；同一批稿裡 NVIDIA 則在開羅辦了一場酒會，點名埃及的 AI 生態系從賦能走到執行，涵蓋 AI 原生公司、開發者、研究者、新創與企業，是另一個區域布局案例，跟先前曼徹斯特大學用 Earth-2 做空污預測的公衛應用案例性質不同，屬於生態系與產業規模敘事。兩則合起來看，這條線目前呈現的仍是業者同時在據點、政策論述、區域生態系三條戰線加速布局，這次分別是 OpenAI 把論述拉高到全球層級、NVIDIA 把生態系敘事擴張到中東地區。
    next: 查 OpenAI 這份全球標準呼籲是否有具體標準草案、時間表，或哪些政府機構已表態要一起協調；查埃及那場活動公布的具體數字（新創數量、投資金額、簽約案），判斷「production scale」是否有數據支持；同時留意澳洲監理機關對青少年安全藍圖的回應，以及曼徹斯特大學 Earth-2 模型是否有論文發表。
    lenses: []
