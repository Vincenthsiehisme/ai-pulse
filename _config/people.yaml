- id: person-jack-clark
  name: Jack Clark
  sources: [src-kol-importai]
  aliases: ["Jack Clark"]
  # 該來源目前 lifecycle: dormant（待重驗）。仍然收錄：條目在這裡不代表
  # 來源在跑，來源狀態一律以 sources.yaml 為準，這裡不複製狀態。
  measured_as: "（語料中無此來源的資料：來源為 dormant）"

- id: person-sebastian-raschka
