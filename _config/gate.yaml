# _config/gate.yaml — 所有可調門檻集中管理（改門檻不改碼；改動要 docs-first）
#
# 讀之前先看這行：**這個檔裡有相當一部分 key 沒有任何程式碼讀它**。
# 未接線不是 bug（好幾個是還沒做的功能的預留規格），沒標出來才是——
# 一個寫著正常數字的假欄位，會讓下一個人把它改掉、重跑、然後懷疑資料壞了。
#
# 所以規矩是：**每一個 leaf key 都要帶標記**，標在自己那一行、或任何一層祖先上。
#   ⚠ …未接線     → 沒有消費者。旁邊要寫清楚實際由什麼決定那個行為。
#   消費者：<路徑> → 有人讀它，讀它的是這支腳本。
# 兩種都沒有 → selftest 紅。列舉是機械的（scripts/lib/gate_keys.py 掃這個檔），
# 標記是人寫的，測試比對兩者。對照表與理由見 references/gate-config-status.md。
#
# 這裡刻意不寫「有幾個未接線」。上一版寫「13 個」，那個 13 是手工數的，而它漏了
# quality.weights 整塊與 readiness.require_primary_evidence。
# 一個沒有人在維護的數字，比沒有數字更容易讓人放心。

quality:
  # 消費者：scripts/pulse-score.py
  discard_below: 40          # total < 此值直接丟棄，不進聚類
  # 消費者：scripts/pulse-score.py
  grade_thresholds:          # A/B/C/D/F
    A: 85
    B: 70
    C: 55
    D: 40
  # ⚠ 整塊未接線（2026-07-26 機械列舉才發現，在此之前它從來沒進過未接線清單）。
  # 五個上限全部硬寫在 lib/quality.py 的五支函式裡——`min(25, …)`、`min(15, …)`、
  # _freshness() 的階梯。沒有任何一行碼讀 weights。
  # quality.py 開頭的 docstring 還寫著「各自上限見 gate.yaml.quality.weights」，
  # 指向這裡；這裡是一組沒有人讀的數字。
  #
  # 它是這個檔裡**最像旋鈕的東西**：五個數、加起來剛好 100、名字對得上五個維度。
  # 改任何一個，分數一分都不會變。要真的能調，得先把 lib/quality.py 的五支函式
  # 改成讀這裡——那是 P4 剩下的工，不是改一行註解能了的事。
  weights:                   # 五維上限（總和 100）⚠ 未接線
    authority: 25
    richness: 25
    freshness: 20
    originality: 15
    completeness: 15
  # ⚠ 未接線。lib/quality.py:_freshness() 用的是硬寫階梯，不讀這兩個值：
  #   ≤1h→20（滿分） ≤6h→18 ≤24h→15 ≤72h→10 ≤168h→6 ≤720h→3 其餘→1
  # 也就是「24 小時內給滿分」與「30 天後給 0」兩句話目前都**不成立**。
  freshness_full_hours: 24   # ⚠ 未接線（實際：≤24h 給 15，不是滿分）
  freshness_zero_days: 30    # ⚠ 未接線（實際：>30 天給 1，永遠不歸零）
  # 消費者：scripts/pulse-score.py（判歷史存檔）、scripts/pulse-gate.py（同一個值，
  # 兩支各自讀一次；改這裡兩邊都會動）
  recency_max_lead_days: 7   # 首次觀測距 published > 此天數 → 判為歷史存檔，不進事件/來源更新（0=關閉）

# ⚠ 整塊未接線。實際的近似重複與事件窗口都在 lib/cluster.py 裡硬寫：
#   相似度 = title_similarity() 的 **token Jaccard**（不是 MinHash，也沒有 char n-gram）
#   窗口   = 一般 96h／incident 類 7 天／同 facet 21 天（沒有一個是 72）
# 把下面任何一個數字改掉，聚類結果一個字都不會變。
dedup:
  minhash_jaccard: 0.80      # ⚠ 未接線
  ngram: 4                   # ⚠ 未接線（沒有任何地方做 char n-gram）
  event_window_hours: 72     # ⚠ 未接線（實際 96h / 7d / 21d）

# ---------------------------------------------------------------------------
# clustering — 字典的「執行控制層」。entities.yaml 只管實體是什麼；
# 這一段管實體在聚類時怎麼用。M0 決議固化於此。
# ---------------------------------------------------------------------------
clustering:
  # 各 term_type 能不能單獨作為聚類主鍵
  #   standalone         = 可單獨當主鍵
  #   co_occurrence_only = 必須與 requires 清單中的型別共現才成立
  #   never              = 永不當主鍵，只作標籤與檢索
  # ⚠ 未接線。technology 的 co_occurrence_only 限制目前不存在，
  # 技術詞（agent / RAG / MCP）現在可以單獨當主鍵。
  key_eligibility:
    company:        standalone
    product_line:   standalone
    product:        standalone
    infrastructure: standalone
    framework:      standalone
    policy:         standalone
    technology:
      mode: co_occurrence_only
      requires: [company, product_line, product]
      # 理由：技術概念（agent / RAG / MCP）跨廠商高頻出現，單獨當主鍵會把
      # 不同公司的無關消息併成一個 Event。

  # 版本實體衍生：產品線手工維護，版本由 pattern 自動產生，避免每週手改字典
  # ⚠ 整塊未接線。claude@opus-4.8 這種衍生實體目前不會產生。
  version_derivation:
    enabled: true   # ⚠ 未接線（這個 true 沒有開啟任何東西）
    id_format: "{line_id}@{version_slug}"   # 例：claude@opus-4.8
    parent_field: line_id
    # 衍生實體優先於產品線本身作為主鍵；辨識不出版本時退回產品線
    prefer_derived_as_key: true
    # 版本號正規化：小寫、空白轉連字號、去除前綴 v
    slug_rules: [lowercase, space_to_hyphen, strip_leading_v]
    # 同一產品線的不同版本視為不同實體，不互相聚類
    versions_are_distinct: true

  # 未知實體：命中不到任何字典條目的訊號怎麼辦。
  # 2026-07-27：report_to 與兩個晉升門檻接上了。規格 references/vault-pages.md。
  unknown_entity:
    # ⚠ 未接線（**刻意**，C 類）。它描述的是既有行為：候選詞照收、不丟。
    # 接成開關只會生出一個「把未知實體丟掉」的設定，而那個能力我們不想要——
    # 字典補漏的唯一輸入就是這些沒命中的詞，關掉它等於關掉字典的成長路徑，
    # 然後 selftest 全綠，因為每一條測試都是拿預設值跑的。
    action: retain_as_observed
    # ⚠ 未接線（**刻意**，C 類）。同樣是既有行為的描述：辨識不出 fingerprint 時
    # Event id 走標題雜湊（pulse-cluster.py 的 hkey）。接成開關會讓人有辦法讓
    # 那些訊號不產生穩定 id，而 id 不穩定 = 跨日 attach 整條壞掉。
    key_from_title_hash: true
    # 累積版字典補漏清單寫到哪。消費者：scripts/pulse-dictionary-gaps.py
    # （2026-07-27 之前這個路徑指著一個不存在的檔案，也沒有任何碼會產生它）
    report_to: _dashboards/dictionary-gaps.md
    # 晉升門檻。兩個消費者讀同一份：scripts/lib/dictgaps.py 是判準，
    # _probe/<日>/report.md 的當班區塊與上面那一頁的累積版都走它。
    # 讀不到就退回預設 3 / 2——設定檔壞掉不可以讓門檻自己打開。
    promote_min_hits: 3      # 消費者：scripts/lib/dictgaps.py
    promote_min_sources: 2   # 消費者：scripts/lib/dictgaps.py

  # 已知的跨語言限制（去AI化下無法解，記錄在案）
  # ⚠ 未接線。這塊本來就是「聲明」不是開關，但仍要標——
  # 否則讀者會以為 supported: false 是某處讀到之後關掉了什麼。
  cross_language:
    supported: false
    mitigation: aliases_only     # 只靠字典別名部分覆蓋
    # 副作用防護：見下方 evidence.translation_chain

# 事件發布硬門禁。消費者：scripts/pulse-gate.py（下面每一個門檻都在那支裡讀，
# require_primary_evidence 除外——那一個刻意不接，理由寫在它自己那一段）。
readiness:
  thin_fact_min_chars: 20
  min_confidence: 60
  # 下面三個是另一種病：**接線了但走不到**（2026-07-26 更新，規格：
  # references/readiness-gate.md）。
  #
  # 舊的說法是「heat 理論上限 48，所以 70 這道門跨不過去」。那個描述沒有錯，
  # 但它接受了一個更大的錯誤：heat 當時**永遠算得出一個數字**，而那個數字量的
  # 不是傳播熱度。公式六項裡有四項要社群訊號（作者/推文/平台/地域，合計 63 分），
  # 那四項恆為 0——因為 pulse-cluster.py 呼叫時直接寫死 metrics=[]，不是資料
  # 還沒到。剩下會動的只有獨立來源數與新鮮度。敘述層已經拿那個數字寫過
  # 「heat 偏低、還沒跨來源共振」這種句子（_config/narratives.yaml）。
  #
  # 現在：一項傳播訊號都沒量到時 scoring.py 回 **null**，不編一個低分（紅線 8）。
  # score_factors.propagationSignals 記下四項裡有幾項非零；有 heat 數字卻是 0 的
  # Event 會被新的 unmeasured_heat 擋下來。
  #
  # 下面三個門檻**刻意不動**：
  #   降 70 → 讓一條跟傳播無關的數字去觸發熱度防線，那個反應是假的（紅線 4）。
  #   重算權重把值域填滿 → 0–100 的假數字比 8–32 的假數字更難被發現。
  # selftest 釘住兩件事：metrics=[] 時 heat 是 None，以及四項餵滿時 heat 跨得過
  # 70——第二條紅了才表示這個門檻該重談。
  heat_threshold: 70         # 接線了但走不到（要等社群線 M3；不是廢設定）
  heat_min_independent_sources: 2   # 同上
  heat_min_platform_breadth: 2      # 同上

  # ⚠ 未接線（**刻意**）。跟上面那些「還沒做」不一樣，這一個是「不要做」。
  #
  # 真正在擋的是 pulse-gate.py 的 missing_primary_evidence：primary_evidence 為 0
  # 就掛 blocker，無條件。它不看這個值——把它改成 false，什麼都不會發生。
  #
  # 接上去只要一行（`if r.get("require_primary_evidence", True): …`），而那一行
  # 不能寫。假開關的傷害是：有人改了它、發現沒效果、開始不信任這個檔案。真開關的
  # 傷害是：有人改了它、**很有效果**，然後整個 vault 開始發布沒有一手證據的東西，
  # 而 selftest 全綠——因為每一條測試都是拿預設值跑的。紅線 2 唯一的執法點，
  # 不該有一個設定檔層級的關閉開關。
  #
  # 所以它留在這裡的身分是**聲明**：這條規則存在、值是 true、而且不可調。
  # 要放寬得改 pulse-gate.py 並改 references/readiness-gate.md，讓它進 diff 被看見。
  require_primary_evidence: true   # ⚠ 未接線（刻意；見上）

# ---------------------------------------------------------------------------
# 聚類：一則新聞什麼時候算「同一件事」
# 消費者：scripts/pulse-cluster.py（讀設定並傳給 belongs_to_event）。
# 判準本身的消費者：scripts/lib/cluster.py（belongs_to_event）。
# 完整規格與 2026-08-11 的實測數字見 references/attach-rule.md。
cluster:
  # 路徑 B（沒有共同 fingerprint 時）的標題相似度門檻。
  #
  # 2026-08-11 之前這個數字寫死在 belongs_to_event() 的預設參數裡。P0-e 拿 14 篇
  # 真實的第三方後續實測：0.46 只黏得上 2 篇，而那 2 篇都是逐字轉載——真的重寫過
  # 的 12 篇一篇都沒進來。降到 0.30 是 7/14，而且對 85 則負對照零誤黏。
  #
  # 為什麼不再低：0.25 以下開始出現誤黏（Muse Glimmer 黏到 Orchard，共同詞只有
  # open / agentic / ai）。代價不對稱——漏一篇只是少一個聲音，黏錯一篇會讓
  # independent_sources 記一個不存在的獨立來源，而那個數字會進 frontmatter、
  # 進看板、進 KPI，事後分不出哪些是虛的。0.30 是「還沒開始付代價」的最後一格。
  #
  # 時間窗刻意不動：實測窗口從 96 小時放寬到 21 天，各門檻下的命中數完全不變。
  # 守門的是門檻不是窗口。
  title_similarity_min: 0.30

evidence:                    # 發布證據門檻
  # ⚠ 兩個都未接線。真正在擋的是 pulse-gate.py 的 missing_primary_evidence
  # （primary_evidence 欄位為 0 就擋），那個欄位由 pulse-cluster.rescore() 的
  # `tier == 1 and role != "aggregator"` 算出來，跟下面這兩個數字無關。
  # 尤其 need_independent_tier2：目前**沒有**「兩個獨立 Tier-2 也可以」這條路，
  # primary 缺席就是擋，補幾個獨立來源都沒用。
  need_tier1_primary: 1      # ⚠ 未接線（數字碰巧一致，不是被讀進去的）
  need_independent_tier2: 2  # ⚠ 未接線（這條替代路徑不存在）

  # 轉載鏈防護：一篇英文原文＋一篇中文改寫會被算成兩個獨立來源，虛增
  # independent_sources 與 heat，把「heat ≥70 需 ≥2 獨立來源」那道門打開。
  # 2026-07-27 接上。消費者：scripts/pulse-cluster.py（讀設定、標記、扣獨立性）；
  # 判準本身的消費者：scripts/lib/cluster.py（suspected_reposts）。
  # 兩個都要各自寫一次「消費者：」——同一行用「與」串第二個路徑的話，
  # gate_keys 的正則只認得前面那一個，第二個等於沒寫。
  # 完整判準與它管不到的那一格見 references/evidence-tiers.md。
  #
  # 判準：語言不同 + 發布時間差 ≤ window_hours + 標題實體集合 Jaccard ≥
  # entity_overlap_min，三個同時成立；兩邊都有 fingerprint 且不相等則否決。
  # 缺任何一項資料就不判——往「維持原本算法」倒，不往「猜它是轉載」倒。
  # 同語言逐字轉載：一篇原文＋一篇一字不差的複製貼上，也會被算成兩個獨立來源。
  # 2026-08-11 實測，這正是現行 attach 規則**唯一收得到**的那種「第二個來源」——
  # P0-e 的 14 篇真實第三方後續裡只有 2 篇黏得上，兩篇的標題相似度都是 1.00。
  # 上面 translation_chain 攔不到它：那一支的第一個條件是「語言不同」。
  #
  # 消費者：scripts/pulse-cluster.py（讀設定、標記、扣獨立性）。
  # 判準本身的消費者：scripts/lib/cluster.py（verbatim_reposts）。
  # 完整判準與量到的數字見 references/attach-rule.md。
  #
  # 判準只有兩條：標題相似度 ≥ title_similarity_min 且時間差 ≤ window_hours。
  # 不做實體 Jaccard——0.95 以上的兩個標題實體必然幾乎相同，再算一次是把
  # 同一件事量兩遍。缺標題或缺時間一律不判。
  verbatim_repost:
    enabled: true
    # 0.95：留一點餘裕給轉載時被加上的前後綴（「| Medium」「- 中譯」之類）。
    # 再低就會開始碰到同一家媒體的系列標題，那些是不同的事件。
    title_similarity_min: 0.95
    # 168 小時（7 天）。比 translation_chain 的 48 小時寬很多是刻意的：
    # 翻譯有時效壓力，複製貼上沒有——實測那兩篇一篇差 47 小時、一篇差 17 小時，
    # 而 47 已經貼著 48 的邊。逐字轉載晚一週出現，它還是逐字轉載。
    window_hours: 168
    # 跟 translation_chain 同一份清單語意：被判成轉載的那一條不進獨立性計算。
    excluded_from: [independent_sources, heat]

  translation_chain:
    # 真開關。關掉＝完全不判、不標記，獨立性回到 2026-07-27 之前的算法。
    # 這跟 readiness.require_primary_evidence 那種假開關不同：它關掉的是一個
    # 額外的保守判定，不是紅線的執法點。消費者：scripts/lib/cluster.py
    enabled: true
    # 標題實體集合的 Jaccard 門檻。實體走命名實體字典（lib/entities.py），
    # 不走 token 交集——中英文標題的 token 交集趨近於零，字典的 aliases 兩種
    # 語言都收，所以「OpenAI 发布 GPT-5.2」與 "OpenAI launches GPT-5.2" 都命中
    # {openai, gpt}。消費者：scripts/lib/cluster.py
    entity_overlap_min: 0.80
    # 兩條證據發布時間差的上限（小時）。消費者：scripts/lib/cluster.py
    window_hours: 48
    # 判成轉載之後，那一條被排除在哪些計算之外。真的被讀：
    # 消費者：scripts/pulse-cluster.py
    # 注意 heat 這一項今天是**由 independent_sources 承擔的**——heat 的證據面
    # 輸入只有獨立來源數（metrics 仍是 []），所以排除獨立性就等於排除 heat。
    # 社群線（M3）接上、heat 開始吃真的傳播訊號那天，要回來把它單獨接一次。
    excluded_from: [independent_sources, heat]

# 來源層健康分。消費者：scripts/pulse-source-health.py（2026-07-26 接上，
# 在此之前這整塊沒有任何一行碼讀它）。完整規格見 references/source-lifecycle.md。
#
# 「什麼算失敗」那張表在規格書裡，這裡只講一句最重要的：401/403/429/robots_*
# 一律**不記分**。量不到不等於壞掉，而自動關掉一條好來源是沒有自癒路徑的
# ——那正是 2026-07-24 漏抓 Claude Opus 5 的死法。
source_health:
  success_gain: 8
  not_modified_gain: 3
  failure_penalty: 15
  severe_failure_penalty: 25
  degrade_after_consecutive: 2
  quarantine_after_consecutive: 5   # 只列入報告的隔離候選，不自動寫 dormant
  recover_after_consecutive: 3      # 連續成功幾次 → 撤銷機器自己做的降級

# 鏈外死人開關的門檻。**跟 monitor.stale_after_days 是兩個 key，刻意的。**
# monitor 那個判的是「幾天沒抓到東西」，而且它自己就跑在被監看的那條鏈裡；
# 這一個判的是「那條鏈到底有沒有被排上」，跑在另一支 workflow 上。
# 共用一個 key 的話，哪天有人為了讓 monitor 安靜而調鬆它，會連鏈外那一支
# 一起調鬆——而那正是唯一還會叫的東西。
# 消費者：scripts/pulse-watchdog.py 的 --alert。
# 規格見 references/health-alarms.md〈鏈外的那一個〉。
watchdog:
  stale_after_days: 2

# ---------------------------------------------------------------------------
# 覆蓋缺口矩陣（需求 × 供給）
# 消費者：scripts/pulse-coverage-gap.py。規格 references/vault-pages.md
# 〈`_dashboards/coverage-gap.md`〉。
coverage_gap:
  # 少於這麼多筆人工裁決，整張表一律印「量不到」，不給任何燈號。
  # 這是這張表最重要的一個門檻：需求那一欄是人給的，而把「還沒有人回答過」
  # 印成 0，會讓 procurement（0 需求、0 來源）看起來跟一個真的沒問題的格子
  # 一樣綠——而它其實是這個系統最大的盲區之一。
  # 10 這個數字是保守的下限，不是統計上的充分樣本；執行計劃 P0-a 的目標是 26。
  min_answers: 10

  # 需求／供給的比值落在哪一段給什麼燈。供給是 0 而需求 > 0 一律紅（不看比值，
  # 除以 0 的那一格不該用一個大數字表達，它是另一種狀態）。
  amber_ratio: 1.0
  red_ratio: 3.0

  # `other` 佔 unanswerable 的比例超過這個值 → 頁面印提醒。
  # 它不是在說填的人偷懶，是在說**分類軸可能選錯了**：那 14 個值是在 n=0 的
  # 情況下猜出來的，`other` 就是這份猜測的死人開關。
  other_reason_warn: 0.3

monitor:
  # 消費者：scripts/pulse-monitor.py 的 --write-health / --alert-stale
  # （2026-07-26 接上。在此之前這個 key 沒有任何消費者，連註解裡講的
  # _dashboards/health.md 本身都不存在）。規格見 references/vault-pages.md。
  #
  # 判的是「幾天沒**抓到東西**」（_corpus/ 的最後一天），不是「幾天沒跑班」。
  # 排程死掉的時候這支腳本自己也不會被叫到，health.md 的 generated_day 會停住
  # ——那才是排程的死人開關，兩件事不要混在同一個門檻裡。
  stale_after_days: 2

  # 消費者：scripts/pulse-monitor.py 的 --alert-enrich-stale（2026-08-05 接上）。
  #
  # 判的是「半夜潤稿那條 Cowork 鏈最後一次成功推回 main 是幾天前」，量的是
  # `main` 上最近一個 `nightly: enrich` commit——**不是** narratives.yaml 的
  # `updated`。後者實測會出現合法的三天空窗（08-01、08-02 有 enrich commit
  # 但沒有主線要重寫），拿它當門檻要嘛太鬆要嘛誤報。規格 references/health-alarms.md。
  #
  # 為什麼要由 Actions 這一邊量：推不上去的那一邊沒辦法通報自己推不上去——
  # 它的通報也要推。2026-08-05 那次 push 被沙箱 proxy 擋掉，現有三個警報一條都沒叫。
  #
  # 2：跟上面同一個數字。日更的鏈，隔一天是誤點，隔兩天是壞了。
  # 實測 2026-07-25 ~ 08-04 連續 11 天每天至少一個 enrich commit，零空窗。
  enrich_stale_after_days: 2
