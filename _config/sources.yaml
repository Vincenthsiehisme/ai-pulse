# _config/sources.yaml — 來源清單（三軌：官方線 / KOL 線 / 聚合線）
# ---------------------------------------------------------------------------
# 分軌不是分類整齊，是因為兩條線在 gate 裡權利不同，且互為對照組：
#   官方線 = 事情何時被「承認」
#   KOL 線 = 事情何時被「談論」
#   兩者時間差 = lead_days，本系統唯一做得出、RSS 聚合器做不出的產物。
#   混在同一組抓 → 這個差值永遠算不出來。
#
# track 欄位是硬約束，不是標籤：
#   official   → 可滿足 require_primary_evidence
#   kol        → 永遠不可滿足 require_primary_evidence，只貢獻 heat 與領先訊號
#   aggregator → 只當候選來源，不作任何事實依據
#
# 新源一律 lifecycle: probing，通過 probe checklist（見檔末）才人為升 active。
# ---------------------------------------------------------------------------
#
# ✅ 已解：lifecycle 互鎖（原記載已過期，2026-07-25 更新）
#   原問題：規格寫「只跑 active/degraded」，但沒有一條是 active，過濾一上線就會
#   拿到 0 個來源、exit 0、心跳綠燈、報告全空；而升 active 又要求先被連續觀察七天。
#   已採解法 (a)：pulse-probe 的 RUN_LIFECYCLES = {active, degraded, probing}，
#   並加了「可跑來源為 0 就 exit 3」的硬防護。probing 會被抓，但不計入正式統計。
#
# ⚠ 真正該盯的是另一件事（2026-07-24 事故的教訓）
#   dormant 不會讓任何東西變紅。清單上 14 條、實際在跑 8 條，看起來都一樣正常。
#   來源被關掉是靜音的，而漏掉一整家公司也是靜音的——07-24 漏抓 Claude Opus 5
#   就是這樣發生的：鏈跑得很完美，只是它什麼都看不見。
#   對策：pulse-robots-recheck.py 定期重驗 robots_ok 並記錄異動；
#         每次改 lifecycle 都要在該源底下寫明原因與日期。
# ---------------------------------------------------------------------------

meta:
  version: "2.6.0"
  updated: "2026-07-26"
  note: >
    v2 引入 track 雙軌與 person_id 關聯。KOL 線的 author 必須能解析到
    people.yaml 的條目，否則獨立性求值退回 media_group 層級（見
    people-and-relations.md 保守預設對照表）。
    v2.1 增補六條官方線候選（公司發布 / 研究 / 政策三類），
    並新增 corpus_type 欄位以支撐「語料型態多樣性」的量測。
    v2.2 政策類拍板：arXiv 照字面停用（robots Disallow: /）；
    EC digital-strategy 判死（站台無 RSS）；改由 Council press（EU-Council）
    與 EP ITRE（EU-Parliament）兩條不同機構互為獨立佐證補齊 policy 類。
    2026-07-23 verify 實測：EP ITRE robots 允許（robots_ok: true, probing）；
    Council press robots 回 403 判拒（robots_ok: false, dormant）——policy 類實際剩 EP 一條 live，
    跨機構獨立佐證暫失，待另尋第二個不同機構的合規 policy 來源。
    v2.3 覆蓋率修補（起因：2026-07-24 漏抓 Claude Opus 5，根因是清單裡沒有 Anthropic）：
    新增 src-anthropic-news（sitemap adapter，官方站無 RSS，走 robots 宣告的 Sitemap）；
    src-openai-blog 由 dormant/robots_ok:false 更正為 probing/true（原判定是 403 造成的
    假陰性，robots 實為 Allow: /）；src-hn-frontpage 換掉 robots 全禁的 firebaseio 端點，
    改走 hn.algolia.com 並拉起為 probing。arXiv 維持停用（robots 確為 Disallow: /，已複驗）。
    v2.4 新增 coverage_watch（必盯清單，供 pulse-monitor 的覆蓋率看門狗使用），
    並開張 KOL 線——lead_days（事情被承認 vs 被談論的時間差）在 kol_sources 為空時
    恆為不可計算，那是本系統唯一做得出的產物，不能一直掛在範本狀態。
    v2.4 同時新增一個欄位 revive_when_allowed（bool，預設 false）：
    「本機量不到 robots，別把未知寫成拒絕，等真網路環境判。」
    robots_ok 從此有三個值：true 放行 / false 站方明文 Disallow / null 未知。
    只有 null + revive_when_allowed 的 dormant 來源，會被 pulse-robots-recheck --revive
    在確認放行後自動升為 probing。看 null 就復活是不行的——null 也可能只是漏填，
    靠推論復活等於把漏填當成授權。
    （version 欄先前停在 2.3.0 沒跟著 v2.4 一起動，2026-07-26 一併補正為 2.5.0。）
    v2.5 覆蓋率對稱化：entities.yaml 有 32 家 active 公司，coverage_watch 只列 12 家，
    其餘 20 家沒有來源也沒有被承認缺來源——那是盲點不是取捨。20 家一次補進
    must_watch（19 家 pending: true），並新增 src-amd-ir（硬體側第一條 NVIDIA 以外的
    官方線，robots 與 feed 都在本機實測過）。selftest 加一條反向一致性檢查，
    讓「字典有、清單沒有」這件事以後會直接讓測試紅掉，不再靠人去數。
    v2.6 人物層落地：新增 _config/people.yaml（8 人，全部來自 KOL 線，
    收錄條件是「已經有來源」而非「產業重要」），並把 8 條 KOL 的 person_id
    從 null 填實。person_id 自此**真的被 runtime 消費**——
    lib/cluster.independent_voices() 把獨立來源數改成連通分量，
    同 person_id 或同 media_group 就合併，同一個人換平台不再被算成兩個獨立聲音。
    在此之前 people.yaml 不存在、person_id 全空、pulse-cluster.py 也不讀它，
    設定檔上看起來人物層已建好、實際一行都沒有（紅線 8）。
    刻意不含 affiliation：任職會過期且無合規自動來源可驗，永不得驅動 gate。

# ---------------------------------------------------------------------------
# coverage_watch —— v2.4 新增。給 pulse-monitor 的覆蓋率看門狗吃。
#
# 為什麼需要它：2026-07-24 那晚 Claude Opus 5 發布，這條鏈的所有健康指標都是綠的
# （probe_lag_days: 0、來源全部回 200、事件照常產出），因為鏈確實跑得很順。
# 它只是從頭到尾沒有任何一條來源指向 Anthropic。**靜默死掉有死人開關，靜默瞎掉沒有。**
#
# 這份清單是一句白紙黑字的承諾：「這幾家公司的動靜，我們應該看得見。」
# 看門狗只做一件事——如果某家連續 max_silent_days 天沒在語料裡出現過，就叫。
# 它不判斷該不該發（那是 gate 的事），也不會自己去補來源（那是人的事）。
#
# 門檻怎麼定：按這家公司「安靜多久才算異常」抓，不是按重要性抓。
#   前沿實驗室（OpenAI / Anthropic / Google DeepMind）兩週不出聲＝幾乎必然是我們瞎了。
#   基礎設施與二線廠商本來就發得稀，門檻放寬，否則警報會變成背景雜訊被關掉。
# 語料期間短於門檻時不觸警（新 vault 第一天不該對著整份清單狂叫）。
# ---------------------------------------------------------------------------
coverage_watch:
  window_days: 30            # 統計窗口：近 N 天的 _corpus/
  max_silent_days: 14        # 預設沉默門檻，可被逐條覆寫
  must_watch:
  - {entity_id: openai, label: OpenAI, max_silent_days: 14}
  - {entity_id: anthropic, label: Anthropic, max_silent_days: 14}
  - {entity_id: google-deepmind, label: Google DeepMind, max_silent_days: 14}
  - {entity_id: google, label: Google, max_silent_days: 14}
  - {entity_id: meta, label: Meta, max_silent_days: 21}
  - {entity_id: microsoft, label: Microsoft, max_silent_days: 21}
  - {entity_id: nvidia, label: NVIDIA, max_silent_days: 21}
  - {entity_id: huggingface, label: Hugging Face, max_silent_days: 21}
    # pending: true ＝白紙黑字承認「這家我們還沒有任何來源在看」。
    # 照樣列在報表上（缺口要看得見），但不觸 exit code——待辦事項每晚讓 CI 紅一次，
    # 人只會學會忽略 CI，連帶忽略真正的回歸。補上來源後把這行 pending 拿掉即可。
    # 要把待辦逼到零時，跑 pulse-monitor --alert-no-source。
    # 2026-07-25：xAI / Mistral / Alibaba 三家補上來源了，pending 拿掉——留著等於
    # 對自己謊報「這家沒人在看」（紅線 8）。但**有來源 ≠ 有產能**：三條都還是
    # probing、feed 本體沒在本機驗過。拿掉 pending 之後，它們若真的一直不產出，
    # 30 天後 reason 會從 no_source 變成 silent 並且照樣觸警——那正是要的：
    # 「加了來源就當補完了」是這套系統最想防的那種假完成。
  - {entity_id: xai, label: xAI, max_silent_days: 30}
  - {entity_id: mistral, label: Mistral AI, max_silent_days: 30}
  - {entity_id: alibaba, label: Alibaba, max_silent_days: 30}
    # DeepSeek 維持 pending：唯一找得到的官方入口（api-docs sitemap）沒有 lastmod、
    # slug 是不透明日期碼，接了也是零實體命中。詳細退件理由寫在 official_sources
    # 末尾那段。這一格應該紅著，直到有帶標題的官方 feed。
  - {entity_id: deepseek, label: DeepSeek, max_silent_days: 30, pending: true}
    # ── 2026-07-26：把字典有、清單沒有的 20 家一次補齊 ──
    # 起因是一個問句：「為什麼只追 NVIDIA？」查下去發現這不是取捨，是漏填。
    # 實測 entities.yaml 有 32 家 status: active 的公司，這份清單只列了 12 家。
    # 剩下 20 家的狀態是**沒有來源、而且沒有承認自己沒有來源**——覆蓋率報表上
    # 連一格都不會出現，所以永遠不會紅。這比 pending 紅著糟：pending 是缺口，
    # 沒列是盲點，而這套系統整個 coverage_watch 就是為了 07-24 那種盲點才存在的。
    # （我上一輪口頭講的是 19 家，重數是 20——漏了 safe-superintelligence。
    #   以這裡的 python 重數為準，口頭那次是錯的。）
    #
    # 補進來之後這 20 格會一起紅（reason: no_source），但因為掛 pending 所以不觸
    # exit code——理由跟上面那段一樣：天天紅的燈等於沒有燈。要把待辦逼到零時跑
    # pulse-monitor --alert-no-source。AMD 是唯一不掛 pending 的，因為它這次真的
    # 接上了來源（src-amd-ir）。
    #
    # 門檻按「安靜多久才算異常」抓，不按重要性：二線與硬體廠本來就發得稀，
    # 一律 30；只有幾家真的高頻的抓 21。
    #
    # 已知假陽性風險（先寫下來，不在這個 PR 修）：scale-ai 的別名有 "Scale"，
    # `\bscale\b` 會命中 "at scale" 這種一般用字。目前不影響警報（沒有來源時
    # reason 恆為 no_source，corpus_hits 不參與判定），但等 Scale AI 真的補上
    # 來源那天，這個別名會讓它看起來永遠不沉默。修法是把別名收緊成 "Scale AI"，
    # 那要動 entities.yaml，是另一個 PR（會改到既有語料的實體命中結果）。
  - {entity_id: safe-superintelligence, label: Safe Superintelligence, max_silent_days: 30, pending: true}
  - {entity_id: thinking-machines, label: Thinking Machines Lab, max_silent_days: 30, pending: true}
  - {entity_id: cohere, label: Cohere, max_silent_days: 30, pending: true}
  - {entity_id: perplexity, label: Perplexity, max_silent_days: 21, pending: true}
  - {entity_id: anysphere, label: Anysphere (Cursor), max_silent_days: 21, pending: true}
  - {entity_id: cognition, label: Cognition, max_silent_days: 30, pending: true}
  - {entity_id: scale-ai, label: Scale AI, max_silent_days: 30, pending: true}
  - {entity_id: zhipu, label: Z.ai, max_silent_days: 30, pending: true}
  - {entity_id: moonshot, label: Moonshot AI, max_silent_days: 30, pending: true}
  - {entity_id: minimax, label: MiniMax, max_silent_days: 30, pending: true}
  - {entity_id: bytedance, label: ByteDance, max_silent_days: 21, pending: true}
  - {entity_id: baidu, label: Baidu, max_silent_days: 30, pending: true}
  - {entity_id: tencent, label: Tencent, max_silent_days: 30, pending: true}
  - {entity_id: amd, label: AMD, max_silent_days: 30}
  - {entity_id: tsmc, label: TSMC, max_silent_days: 30, pending: true}
  - {entity_id: broadcom, label: Broadcom, max_silent_days: 30, pending: true}
  - {entity_id: groq, label: Groq, max_silent_days: 30, pending: true}
  - {entity_id: cerebras, label: Cerebras, max_silent_days: 30, pending: true}
