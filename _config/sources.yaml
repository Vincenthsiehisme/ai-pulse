# _config/sources.yaml — 來源清單（三軌：官方線 / KOL 線 / 聚合線）
# ---------------------------------------------------------------------------
# 分軌不是分類整齊，是因為兩條線在 gate 裡權利不同，且互為對照組：
#   官方線 = 事情何時被「承認」
#   KOL 線 = 事情何時被「談論」
#   兩者時間差 = lead_days，本系統唯一做得出、RSS 聚合器做不出的產物。
#   混在同一組抓 → 這個差值永遠算不出來。
#
# track 欄位是硬約束，不是標籤：
#   official   → 可滿足 require_primary_evidence
#   kol        → 永遠不可滿足 require_primary_evidence，只貢獻 heat 與領先訊號
#   aggregator → 只當候選來源，不作任何事實依據
#
# 新源一律 lifecycle: probing，通過 probe checklist（見檔末）才人為升 active。
# ---------------------------------------------------------------------------
#
# ⚠ 已知互鎖（實作 lifecycle 過濾前務必先解）
#   SKILL.md 規格寫「probe 只跑 active/degraded」，但本檔目前沒有任何一條是
#   active。過濾一旦實作，probe 會拿到 0 個來源、exit 0、心跳正常、報告全空。
#   且 checklist 第 4 項要求「連續觀察 ≥7 天」才能升 active ——
#   不是 active 就不會被抓，不被抓就永遠滿足不了升級條件。
#   解法擇一：(a) 新增 probing 狀態（會被抓、產出不計入正式統計）
#             (b) 明確讓過濾放行 draft
#   在決定之前，不要合入 lifecycle 過濾。
# ---------------------------------------------------------------------------

meta:
  version: "2.2.0"
  updated: "2026-07-24"
  note: >
    v2 引入 track 雙軌與 person_id 關聯。KOL 線的 author 必須能解析到
    people.yaml 的條目，否則獨立性求值退回 media_group 層級（見
    people-and-relations.md 保守預設對照表）。
    v2.1 增補六條官方線候選（公司發布 / 研究 / 政策三類），
    並新增 corpus_type 欄位以支撐「語料型態多樣性」的量測。
    v2.2 政策類拍板：arXiv 照字面停用（robots Disallow: /）；
    EC digital-strategy 判死（站台無 RSS）；改由 Council press（EU-Council）
    與 EP ITRE（EU-Parliament）兩條不同機構互為獨立佐證補齊 policy 類。
    2026-07-23 verify 實測：EP ITRE robots 允許（robots_ok: true, probing）；
    Council press robots 回 403 判拒（robots_ok: false, dormant）——policy 類實際剩 EP 一條 live，
    跨機構獨立佐證暫失，待另尋第二個不同機構的合規 policy 來源。

# ---------------------------------------------------------------------------
# corpus_type —— v2.1 新增欄位
#   source_category 分的是「誰發的」（vendor / research / framework / regulator）
#   corpus_type 分的是「講的是什麼」。M1 的瓶頸診斷需要後者：
#   arXiv 是 research + research_paper，vLLM 是 framework + oss_release，
#   兩者 source_category 不同但語料型態同樣單一 —— 這是 M1 沒看出來的原因。
#   值域：company_release | research_paper | oss_release | policy | person_signal
#
#   若決定不採用此欄位，全域刪除 corpus_type 行即可，其餘不受影響。
# ---------------------------------------------------------------------------

