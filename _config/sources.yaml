  # 這一輪的誠實結論：原本點名要補的五家（AMD / Google AI blog / DeepSeek /
  # Moonshot / Zhipu），只有 AMD 過得了驗證。Moonshot 與 Zhipu 這次沒有找到任何
  # 官方機器可讀入口（連候選路徑都沒有），所以連退件理由都寫不出來，只能先列進
  # coverage_watch 掛 pending，讓那一格紅著。清單縮水要寫下來，不然下次會以為
  # 「上次補過了」。

  # ── 語料型態盤點（人工核對用，非設定；2026-07-25 更新）──
  #   corpus_type       來源數  獨立 media_group
  #   company_release      8    Google / HuggingFace / NVIDIA / Anthropic / OpenAI
  #                             / xAI / Mistral AI / Alibaba-Qwen              -> 8
  #                             ↑ 07-25 從 5 補到 8。地域也從「全美系」變成
  #                               US 6 / EU 1 / CN 1——但三條新的都還在 probing，
  #                               在它們真的產出東西之前，這行寫的是清單不是產能。
  #   research_paper       2    Microsoft / Meta                -> 2（Microsoft↔OpenAI 有投資關係，最薄一類）
  #   oss_release          1    vLLM                            -> 1
  #   policy               1    EU-Parliament(live) / EU-Council(dormant, robots 403)  -> 1 live
  #   person_signal        8    逐人一條，media_group 互不相同  -> 8（6 probing / 2 dormant 待重驗）
  #                             ↑ v2.4 從 0 開張。在此之前 lead_days 恆為不可計算。

# ===========================================================================
# KOL 線 — 具名個人的公開發表
#
# 收錄條件（三者皆須成立）：
#   1. 有穩定可解析的署名（能對到 people.yaml 的 person_id）
#   2. 有合法可抓的 feed（不繞 login / WAF / 付費牆）
#   3. 發表內容與 entities.yaml 的追蹤範圍有實質重疊
#
# 已知偏差（必須記錄，勿事後才發現）：
#   實際抓得到的只剩個人 blog RSS、Substack、YouTube channel feed、
#   GitHub 個人動態、Mastodon / Bluesky。
#   → KOL 線起手會嚴重偏向「寫長文的人」，漏掉純社群發言者。
#   → 任何以本線計算的 lead_days 都必須附註此偏差。
#
# X 的處置（2026-07-24 評估，M1 不接，M3 前不重議）：
#   1. 官方 API 於 2026-02 改為 pay-per-use，無免費 tier。
#      讀取約 $0.005/則，搜尋僅回溯 7 天，全檔案需 Enterprise（$42k/月起）。
#   2. 第三方轉售商（便宜 50–100 倍者）作法是爬取公開資料再轉賣。
#      若採用，等於在 OpenAI 已因 robots 標 dormant 的同時繞過另一家 ToS，
#      紅線變成看心情執行，整個 evidence 體系的可信度跟著鬆掉。不採用。
#   3. 語料型態為 person_signal，不在四類缺口內 ——
#      它補的不是多樣性，是人物層。
#
#   不可刪除此記錄：離職、內部風聲、模型提前流出，
#   最早只出現在 X 上的具名個人帳號。
#   lead_days / first_observed_at / watch / unverifiable_primary
#   這整套機制的主要適用對象就是它。
#
#   重議前置條件（兩者皆須成立）：
#     a. 七天觀測後判讀為「人物層值得建」
#     b. 找到不違反 ToS 且成本可接受的取用路徑
#
#   接入形態：以 person_id 為單位逐人建條目，不是建一條叫「X」的站台來源。
# ===========================================================================
# v2.4 開張。在此之前這一節是空的，於是 lead_days（事情被官方承認 vs 被個人談論
# 的時間差）恆為不可計算——那是本系統唯一做得出來、別處抄不到的產物，不能一直
# 掛在範本狀態。紅線 8：以下每一條的驗證程度都白紙黑字寫在該條的註解裡。
#
# 本機能驗到什麼、驗不到什麼（2026-07-25，寫下來免得日後誤以為都驗過）：
#   robots.txt 讀得到 → 下面標 robots_ok: true 的，是真的逐條讀過該站 robots.txt，
#                       確認 /feed 或 /atom/ 沒有被 Disallow。
#   feed 本體讀不到   → 本容器的抓取工具無法解碼 application/rss+xml，一律回
#                       [binary data]。除 Karpathy 外，沒有任何一條的 feed 內容
#                       在本機被解析過。**這不是「驗過沒問題」，是「沒驗過」。**
#                       所以全部起手 lifecycle: probing，由 Actions 端用真網路驗。
#   紅線 7            → 不換 User-Agent、不用 curl/python 繞過抓取工具的限制。
#                       量不到就寫量不到。
#
# person_id（2026-07-26 從 null 變成真的）：
#   在此之前 people.yaml 不存在、8 條全 null、pulse-cluster.py 也不讀它——
#   設定檔上看起來人物層已經建好，實際一行都沒有。現在 _config/people.yaml
#   落地、person_id 逐條填上，且**真的被 runtime 消費**：
#   lib/cluster.independent_voices() 把獨立來源數改成連通分量，
#   同 person_id 或同 media_group 就合併。
#   → 同一個人在 blog 與 YouTube 各發一次，算 1 個獨立聲音，不是 2。
#   selftest 驗參照完整性：這裡填的每個 id 都要在 people.yaml 查得到，
#   people.yaml 的每個人也都要至少對回一條來源。
#
# media_group 一律填「該刊物名」而非「Substack」：三個人都掛 Substack 的話，
# 獨立來源數會從 3 塌成 1，門檻 4（heat ≥70 需 ≥2 獨立來源）就被自己做假了。
# 加了 person_id 之後這條規則**沒有被取代**：兩個欄位管的是相反方向的錯。
#   media_group 填錯（都填 Substack）→ 低估獨立性，門檻變難過。
#   person_id 沒填  → 高估獨立性，門檻被做假。後者才是危險的那一種。
