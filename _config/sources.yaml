  - {entity_id: aws, label: AWS, max_silent_days: 21, pending: true}

# ---------------------------------------------------------------------------
# corpus_type —— v2.1 新增欄位
#   source_category 分的是「誰發的」（vendor / research / framework / regulator）
#   corpus_type 分的是「講的是什麼」。M1 的瓶頸診斷需要後者：
#   arXiv 是 research + research_paper，vLLM 是 framework + oss_release，
#   兩者 source_category 不同但語料型態同樣單一 —— 這是 M1 沒看出來的原因。
#   值域：company_release | research_paper | oss_release | policy | person_signal
#
#   若決定不採用此欄位，全域刪除 corpus_type 行即可，其餘不受影響。
# ---------------------------------------------------------------------------

# ===========================================================================
# 官方線 — 一手發布：實驗室 blog、論文、release、申報、主管機關公告
# ===========================================================================
official_sources:

  # ── 既有三條 ──
- id: src-openai-blog
  track: official
  owner: OpenAI
  media_group: OpenAI            # 獨立性判斷用（單一真相源，勿在 entities.yaml 重複）
  author:
  person_id:
  tier: 1
  role: official
  source_category: vendor
  corpus_type: company_release
  adapter: rss
  endpoint: "https://openai.com/news/rss.xml"
  region: US
  language: en
  lifecycle: probing
  robots_ok: true
  robots_checked_at: "2026-07-25T22:59:06+00:00"
  license_note: "titles + links only"
  frequency: daily
  quota_per_run: 50
    # 2026-07-25 更正——先前的 dormant + robots_ok:false 是假陰性，整條 OpenAI 線
    # 被它靜靜關掉，直接參與了 07-24 漏抓 Claude Opus 5 的那次事故。
    # 重驗結果：openai.com/robots.txt 是 `User-Agent: * / Allow: /`（唯一 Disallow
    # 是 /microsoft-for-startups/），/news/rss.xml 是活的 RSS，最新項目 2026-07-23。
    # 當初判 false 的原因是取 robots.txt 時收到 403，而 robots_allows() 依慣例
    # 把 403 當全面拒絕——那是**抓取失敗**，不是站方政策，兩者被混為一談。
    # 執行期若再遇 403，probe 仍會保守跳過（正確行為），但 pulse-robots-recheck.py
    # 會持續重驗並把每次變動寫進 _probe/source-history.jsonl，不再永久寫死。

  # ── 2026-07-25 新增：漏抓 Claude Opus 5 的直接補洞 ──
  # 事故本體不是門禁誤判，是**這份清單裡從來沒有 Anthropic**。
  # 沒有 RSS：/rss.xml、/news/rss.xml、/news/feed.xml、/sitemap_index.xml 全 404。
  # 唯一的機器可讀入口是 robots.txt 自己宣告的那個 Sitemap:，所以走 sitemap adapter。
  # 合規性：只走站方主動指出的入口，不猜路徑、不爬全站、不抓內文（紅線 7）。
  # 代價要講清楚（紅線 8）：sitemap 沒有標題也沒有摘要，標題由 URL slug 還原、
  # 摘要留空。所以這條來源撐得起「Anthropic 在 X 日發了 Y」，撐不起細節——
  # 細節要等第二個獨立來源，或人工補。
  # 狀態誠實聲明：本機容器對 anthropic.com 直連收 403（WAF 擋容器 IP），
  # 因此 endpoint 尚未在本機跑通，只驗到 robots.txt 允許。掛 probing 讓它在
  # Actions 上自證；跑不起來會照常出現在來源狀態表，不會被吞掉。
- id: src-anthropic-news
  track: official
  owner: Anthropic
  media_group: Anthropic
  author:
  person_id:
  tier: 1
  role: official
  source_category: vendor
  corpus_type: company_release
  adapter: sitemap
  endpoint: "https://www.anthropic.com/sitemap.xml"
  url_prefix: "/news/"
  sitemap_hints: ["news"]
  max_sitemaps: 3
  region: US
  language: en
  lifecycle: probing
  robots_ok: true
  robots_checked_at: "2026-07-25T22:59:06+00:00"
  license_note: "titles + links only"
  frequency: daily
  quota_per_run: 40

