# ===========================================================================
# probe checklist — 每個新源升 active 前必須逐項通過並留紀錄
# ===========================================================================
# 1. endpoint 回 200 且格式可解析（非 HTML 錯誤頁偽裝成 200）
# 2. robots.txt 允許該路徑
# 3. license / ToS 允許存標題與節錄
# 4. 連續觀察 ≥7 天，記錄實際發文頻率（用於校準 quota 與 freshness）
# 5a. 抽樣 20 筆，記錄 author 欄位存在率
#     ← 僅供偵測 adapter 解析失敗，不作任何人物層判斷
# 5b. 抽樣 20 筆，記錄可解析為單一自然人的比率
#     ← 這個數字才決定人物層有沒有用
#     判定規則：具名個人 = 1；bot / 組織名 / 帳號 login = 0；
#               無法判定 = 0（保守預設，缺資料往非獨立倒）
# 6. 抽樣 20 筆，記錄 entities.yaml 命中率 ← 這個數字決定字典要往哪長
# 7. 官方線另需：確認是一手發布而非轉載（轉載的官方帳號不算 tier 1）
# 8. KOL 線另需：person_id 已建、任職邊已依 people-and-relations.md 驗證
#
