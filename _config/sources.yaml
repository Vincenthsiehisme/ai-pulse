  #   1. 整份 sitemap **沒有任何 <lastmod>**。adapt_sitemap 靠 lastmod 排序取最新，
  #      沒有它就只能取一個沒有時間意義的前 N 筆，first_observed_at 會被寫成
  #      「我第一次看到的那天」而不是「它發表的那天」——lead_days 直接污染。
  #   2. slug 是 `news260424` 這種不透明日期碼。sitemap adapter 摘要一律留空，
  #      而 match_entities 只吃 title+summary，`_slug_to_title("news260424")` 還原
  #      出來是 "News260424"，**實體命中恆為 0**。
  # 兩者合起來的結果是：來源清單上多一行 DeepSeek、覆蓋率看門狗變綠、實際產出
  # 一條都沒有。那比沒有這條來源更糟，因為它會讓人以為這一塊已經蓋到了。
