# ===========================================================================
# KOL 線 — 具名個人的公開發表
#
# 收錄條件（三者皆須成立）：
#   1. 有穩定可解析的署名（能對到 people.yaml 的 person_id）
#   2. 有合法可抓的 feed（不繞 login / WAF / 付費牆）
#   3. 發表內容與 entities.yaml 的追蹤範圍有實質重疊
#
# 已知偏差（必須記錄，勿事後才發現）：
#   實際抓得到的只剩個人 blog RSS、Substack、YouTube channel feed、
#   GitHub 個人動態、Mastodon / Bluesky。
#   → KOL 線起手會嚴重偏向「寫長文的人」，漏掉純社群發言者。
#   → 任何以本線計算的 lead_days 都必須附註此偏差。
#
# X 的處置（2026-07-24 評估，M1 不接，M3 前不重議）：
#   1. 官方 API 於 2026-02 改為 pay-per-use，無免費 tier。
#      讀取約 $0.005/則，搜尋僅回溯 7 天，全檔案需 Enterprise（$42k/月起）。
#   2. 第三方轉售商（便宜 50–100 倍者）作法是爬取公開資料再轉賣。
#      若採用，等於在 OpenAI 已因 robots 標 dormant 的同時繞過另一家 ToS，
#      紅線變成看心情執行，整個 evidence 體系的可信度跟著鬆掉。不採用。
#   3. 語料型態為 person_signal，不在四類缺口內 ——
#      它補的不是多樣性，是人物層。
#
#   不可刪除此記錄：離職、內部風聲、模型提前流出，
#   最早只出現在 X 上的具名個人帳號。
#   lead_days / first_observed_at / watch / unverifiable_primary
#   這整套機制的主要適用對象就是它。
#
#   重議前置條件（兩者皆須成立）：
#     a. 七天觀測後判讀為「人物層值得建」
#     b. 找到不違反 ToS 且成本可接受的取用路徑
#
#   接入形態：以 person_id 為單位逐人建條目，不是建一條叫「X」的站台來源。
# ===========================================================================
